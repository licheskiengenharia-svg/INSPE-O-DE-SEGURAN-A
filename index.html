  ];

  // ---------- Estado ----------
  const state = {
    view: "painel", inspecoes: [], loaded: false, store: "db", canWrite: true,
    selected: null, confirmDelete: false, filtro: { q: "", setor: "" }, draft: null, ai: {},
    pf: { periodo: "12", setor: "", tst: "" },
    config: { secoes: structuredClone(DEFAULT_SECOES), setores: structuredClone(DEFAULT_SETORES) },
    cfgDraft: null, cfgSetor: "usinagem", cfgSecao: "epi", cfgDirty: false, cfgConfirmDel: false,
  };
  let db = null, downloads = null, sample = null, sampleImages = false;
  const fotoCache = {};
  const dataToBlob = d => { const [h, b64] = d.split(","); const bin = atob(b64); const u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return new Blob([u], { type: h.slice(5, h.indexOf(";")) }); };
  async function persistFoto(v) {
    if (!v || !v.startsWith("data:") || state.store !== "db") return v;
    const ref = db.collection("fotos").doc(); await ref.set({ data: v }); fotoCache[ref.id] = v; return "db:" + ref.id;
  }
  async function resolveFoto(v) {
    if (!v || !v.startsWith("db:")) return v || "";
    const id = v.slice(3); if (fotoCache[id]) return fotoCache[id];
    try { const d = await db.collection("fotos").doc(id).get(); fotoCache[id] = d.exists ? d.data().data : ""; } catch { fotoCache[id] = ""; }
    return fotoCache[id];
  }
  function imgTag(v, cls, alt) {
    if (!v) return "";
    if (v.startsWith("db:")) { const id = v.slice(3); return `<img class="${cls}" data-foto="${esc(id)}" ${fotoCache[id] ? `src="${fotoCache[id]}"` : ""} alt="${esc(alt)}">`; }
    return `<img class="${cls}" src="${v}" alt="${esc(alt)}">`;
  }
  function hydrateFotos() {
    document.querySelectorAll("img[data-foto]:not([src])").forEach(async img => { const src = await resolveFoto("db:" + img.dataset.foto); if (src) img.src = src; });
  }
  const app = document.getElementById("app");

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Date().toISOString().slice(0, 10);
  const nowHM = () => new Date().toTimeString().slice(0, 5);
  const fmtDate = d => d ? d.split("-").reverse().join("/") : "—";
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const secById = (cfg, id) => cfg.secoes.find(s => s.id === id);
  const countQ = (cfg, setor) => setor.secoes.reduce((n, id) => n + (secById(cfg, id)?.perguntas.length || 0), 0);
  const setorLabel = i => i.setorNome || [i.nr, i.checklistNome].filter(Boolean).join(" · ") || "—";

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  function score(insp) {
    const c = insp.itens.filter(i => i.status === "C").length;
    const nc = insp.itens.filter(i => i.status === "NC").length;
    return { c, nc, na: insp.itens.filter(i => i.status === "NA").length, pct: c + nc ? Math.round(c / (c + nc) * 100) : null };
  }
  const pctColor = p => p == null ? "var(--na)" : p >= 90 ? "var(--ok)" : p >= 70 ? "var(--accent)" : "var(--bad)";
  const pctChip = p => p == null ? `<span class="chip na">—</span>` : `<span class="chip ${p >= 90 ? "ok" : p >= 70 ? "warn" : "bad"}">${p}%</span>`;

  // ---------- Armazenamento ----------
  const LS_KEY = "inspecoes-seguranca-v1", LS_CFG = "inspecoes-seguranca-config-v1", LS_TST = "inspecoes-seguranca-tst-v1";
  const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  async function saveInsp(insp) {
    if (state.store === "db") { const { id, ...body } = insp; await db.collection("inspecoes").doc(id).set(body); }
    else {
      const i = state.inspecoes.findIndex(x => x.id === insp.id);
      if (i >= 0) state.inspecoes[i] = insp; else state.inspecoes.push(insp);
      sortInsp(); lsSet(LS_KEY, state.inspecoes); render();
    }
  }
  async function deleteInsp(id) {
    if (state.store === "db") {
      const i = state.inspecoes.find(x => x.id === id);
      await db.collection("inspecoes").doc(id).delete();
      const refs = [i?.assinaturaLider, ...(i?.itens || []).flatMap(it => [it.foto, it.fotoConclusao])].filter(v => v && v.startsWith("db:"));
      for (const r of refs) { try { await db.collection("fotos").doc(r.slice(3)).delete(); } catch {} }
      return;
    }
    else { state.inspecoes = state.inspecoes.filter(x => x.id !== id); lsSet(LS_KEY, state.inspecoes); render(); }
  }
  async function saveConfig(cfg) {
    if (state.store === "db") await db.doc("config/setup").set(cfg);
    else { state.config = structuredClone(cfg); lsSet(LS_CFG, cfg); render(); }
  }
  function sortInsp() { state.inspecoes.sort((a, b) => (b.data || "").localeCompare(a.data || "") || (b.criadoEm || 0) - (a.criadoEm || 0)); }
  function useLocal() {
    state.store = "local"; state.inspecoes = lsGet(LS_KEY, []);
    const cfg = lsGet(LS_CFG, null); if (cfg?.setores && cfg?.secoes) state.config = cfg;
    sortInsp(); state.loaded = true; render();
  }

  async function initStore() {
    try {
      db = await claude.use("db");
      const user = await claude.use("user");
      if (user && user.can) { const w = await user.can("data.write"); if (w === false) state.canWrite = false; }
    } catch { db = null; }
    try { downloads = await claude.use("downloads"); } catch { downloads = null; }
    try { sample = await claude.use("sample"); const lim = sample ? await sample.limits().catch(() => null) : null; sampleImages = !!lim?.images; } catch { sample = null; }
    if (!db) return useLocal();
    db.doc("config/setup").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (d?.setores && d?.secoes) state.config = structuredClone(d);
      if (state.loaded && !state.cfgDirty) { state.cfgDraft = null; render(); }
    }, () => {});
    db.collection("inspecoes").onSnapshot(snap => {
      state.inspecoes = snap.docs.map(d => ({ id: d.id, ...structuredClone(d.data()) }));
      sortInsp(); state.loaded = true; render();
    }, () => useLocal());
  }

  // ---------- Navegação ----------
  function go(view, opts = {}) {
    state.view = view; state.confirmDelete = false; state.closing = null;
    if ("selected" in opts) state.selected = opts.selected;
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === (view === "detalhe" ? "historico" : view))));
    render(); window.scrollTo(0, 0);
  }
  document.querySelector("nav.tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-view]"); if (b) go(b.dataset.view);
  });

  // ---------- Render ----------
  function render() {
    if (!state.loaded) return;
    if (state.view === "nova") readHeader();
    const note = state.store === "local"
      ? `<div class="store-note">As inspeções e a configuração dos setores ficam salvas neste navegador. Use Exportar CSV para guardar uma cópia.</div>` : "";
    const v = { painel: viewPainel, nova: viewNova, historico: viewHistorico, detalhe: viewDetalhe, setores: viewSetores }[state.view] || viewPainel;
    app.innerHTML = note + v();
    hydrateFotos();
    if (state.view === "nova") bindNova();
  }

  function pendencias() {
    const out = [];
    for (const insp of state.inspecoes) insp.itens.forEach((it, idx) => { if (it.status === "NC" && !it.corrigido) out.push({ insp, it, idx }); });
    return out.sort((a, b) => (a.it.prazo || "9999").localeCompare(b.it.prazo || "9999"));
  }
  function emptyState(title, text) {
    return `<div class="panel empty"><h3>${title}</h3><p>${text}</p><button class="btn primary" data-act="nova">Iniciar inspeção</button></div>`;
  }

  // ---------- Painel de ações ----------
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const mLabel = k => `${MESES[+k.slice(5, 7) - 1]}/${k.slice(2, 4)}`;
  const endOfMonth = k => { const [y, m] = k.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };
  function monthRange() {
    const t = today(), cur = t.slice(0, 7), p = state.pf.periodo;
    let start;
    if (p === "ano") start = t.slice(0, 4) + "-01";
    else if (p === "tudo") start = state.inspecoes.reduce((a, i) => (i.data || cur).slice(0, 7) < a ? (i.data || cur).slice(0, 7) : a, cur);
    else { const d = new Date(Date.UTC(+t.slice(0, 4), +t.slice(5, 7) - 1 - (+p - 1), 1)); start = d.toISOString().slice(0, 7); }
    const out = []; let [y, m] = start.split("-").map(Number);
    while (`${y}-${String(m).padStart(2, "0")}` <= cur) { out.push(`${y}-${String(m).padStart(2, "0")}`); m++; if (m > 12) { m = 1; y++; } }
    return out;
  }
  function svgBars(months, series) {
    const W = 900, H = 220, L = 30, B = 24, T = 10, max = Math.max(1, ...series.flatMap(s => s.values));
    const step = Math.max(1, Math.ceil(max / 4)), top = step * 4, y = v => T + (H - T - B) * (1 - v / top);
    const gw = (W - L - 6) / months.length, bw = Math.max(2, Math.min(16, (gw - 6) / series.length - 2));
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="tick">${v}</text>`;
    months.forEach((k, i) => {
      const cx = L + gw * i + gw / 2, x0 = cx - (series.length * (bw + 2) - 2) / 2;
      series.forEach((s, j) => { const v = s.values[i]; if (!v) return; const yy = y(v), h = y(0) - yy;
        g += `<path d="M${x0 + j * (bw + 2)},${y(0)} v${-(h - 3)} q0,-3 3,-3 h${bw - 6} q3,0 3,3 v${h - 3} z" fill="${s.color}"><title>${mLabel(k)} · ${s.name}: ${v}</title></path>`; });
      const every = Math.ceil(months.length / 8);
      if (i % every === 0 || i === months.length - 1) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" class="tick">${mLabel(k)}</text>`;
    });
    return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfico de barras por mês">${g}</svg></div>`;
  }
  function svgLine(months, values, name) {
    const W = 900, H = 220, L = 30, B = 24, T = 24, max = Math.max(1, ...values);
    const step = Math.max(1, Math.ceil(max / 4)), top = step * 4, y = v => T + (H - T - B) * (1 - v / top);
    const x = i => months.length === 1 ? (L + W) / 2 : L + 20 + (W - L - 50) * i / (months.length - 1);
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="tick">${v}</text>`;
    g += `<polyline points="${values.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round"/>`;
    const every = Math.ceil(months.length / 8);
    values.forEach((v, i) => {
      g += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--bad)" stroke="var(--surface)" stroke-width="2"><title>${mLabel(months[i])} · ${name}: ${v}</title></circle>`;
      if (i % every === 0 || i === months.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="tick">${mLabel(months[i])}</text>`;
    });
    const li = values.length - 1;
    g += `<text x="${Math.min(x(li) + 8, W - 4)}" y="${y(values[li]) - 8}" text-anchor="end" class="val">${values[li]}</text>`;
    return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${name} por mês">${g}</svg></div>`;
  }
  const legend = items => `<div class="legend">${items.map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>`;
  const tableView = (head, rows) => `<details class="tv"><summary>Ver em tabela</summary><div class="table-wrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;

  function viewPainel() {
    const lead = `<h2>Painel de ações</h2><p class="lead">Evolução das não conformidades e dos planos de ação, calculada a partir das inspeções registradas.</p>`;
    if (!state.inspecoes.length) return lead + emptyState("Nenhuma inspeção registrada", "Escolha o setor, responda as perguntas e salve. Os indicadores aparecem aqui.");
    const pf = state.pf, t = today();
    const L = state.inspecoes.filter(i => (!pf.setor || setorLabel(i) === pf.setor) && (!pf.tst || (i.responsavel || "").trim() === pf.tst));
    const setores = [...new Set(state.inspecoes.map(setorLabel))].sort();
    const tsts = [...new Set(state.inspecoes.map(i => (i.responsavel || "").trim()).filter(Boolean))].sort();
    const filtros = `<div class="filters">
      <label class="field"><span class="label">Período dos gráficos mensais</span><select id="pf-periodo">${[["3", "Últimos 3 meses"], ["6", "Últimos 6 meses"], ["12", "Últimos 12 meses"], ["ano", "Este ano"], ["tudo", "Todo o período"]].map(([v, n]) => `<option value="${v}" ${pf.periodo === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label class="field"><span class="label">Setor</span><select id="pf-setor"><option value="">Todos os setores</option>${setores.map(s => `<option ${pf.setor === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
      <label class="field"><span class="label">TST</span><select id="pf-tst"><option value="">Todos os TSTs</option>${tsts.map(s => `<option ${pf.tst === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
    </div>`;
    if (!L.length) return lead + filtros + `<div class="panel empty"><h3>Nenhuma inspeção com esses filtros</h3><p>Troque o setor ou o TST para ver os indicadores.</p></div>`;

    const acoes = [];
    for (const insp of L) insp.itens.forEach((it, idx) => { if (it.status !== "NC") return;
      const done = !!it.corrigido, late = !done && it.prazo && it.prazo < t;
      acoes.push({ insp, it, idx, setor: setorLabel(insp), norma: it.nr || insp.nr || "Sem norma", reg: insp.data || "", done, doneAt: it.corrigidoEm || "", late, prazo: it.prazo }); });
    const avaliados = L.reduce((a, i) => a + i.itens.filter(x => x.status === "C" || x.status === "NC").length, 0);
    const conformes = L.reduce((a, i) => a + i.itens.filter(x => x.status === "C").length, 0);
    const indice = avaliados ? (conformes / avaliados * 100) : null;
    const concl = acoes.filter(a => a.done), abertas = acoes.filter(a => !a.done), atras = acoes.filter(a => a.late);
    const semPrazo = abertas.filter(a => !a.prazo).length;
    const conclComPrazo = concl.filter(a => a.prazo), noPrazo = conclComPrazo.filter(a => a.doneAt && a.doneAt <= a.prazo);
    const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
    const fmtPct = v => v == null ? "—" : v.toFixed(1).replace(".", ",") + "%";

    const kpis = `<div class="kpis kpis7">
      <div class="kpi"><span class="label">Inspeções</span><span class="num">${L.length}</span><span class="sub">${L.filter(i => (i.data || "").startsWith(t.slice(0, 7))).length} neste mês</span></div>
      <div class="kpi"><span class="label">Índice de conformidade</span><span class="num" style="color:${pctColor(indice == null ? null : Math.round(indice))}">${fmtPct(indice)}</span><span class="sub">${conformes} conformes de ${avaliados} avaliados</span></div>
      <div class="kpi"><span class="label">Não conformidades</span><span class="num">${acoes.length}</span><span class="sub">registradas no total</span></div>
      <div class="kpi"><span class="label">Ações concluídas</span><span class="num" style="color:var(--ok)">${concl.length}</span><span class="sub">${pct(concl.length, acoes.length)} do total</span></div>
      <div class="kpi"><span class="label">Ações em aberto</span><span class="num">${abertas.length}</span><span class="sub">${semPrazo} sem prazo definido</span></div>
      <div class="kpi ${atras.length ? "alert" : ""}"><span class="label">Ações atrasadas</span><span class="num" style="color:${atras.length ? "var(--bad)" : "inherit"}">${atras.length}</span><span class="sub">prazo vencido e não concluídas</span></div>
      <div class="kpi"><span class="label">Concluídas no prazo</span><span class="num">${pct(noPrazo.length, conclComPrazo.length)}</span><span class="sub">${noPrazo.length} de ${conclComPrazo.length} com prazo</span></div>
    </div>`;

    const months = monthRange();
    const reg = months.map(k => acoes.filter(a => a.reg.startsWith(k)).length);
    const don = months.map(k => acoes.filter(a => a.done && a.doneAt.startsWith(k)).length);
    const open = months.map(k => { const e = endOfMonth(k); return acoes.filter(a => a.reg && a.reg <= e && !(a.done && a.doneAt && a.doneAt <= e)).length; });

    const porSetor = Object.values(acoes.reduce((m, a) => { const r = (m[a.setor] ||= { nome: a.setor, c: 0, p: 0, l: 0 }); a.done ? r.c++ : a.late ? r.l++ : r.p++; return m; }, {})).sort((a, b) => (b.c + b.p + b.l) - (a.c + a.p + a.l));
    const maxS = Math.max(1, ...porSetor.map(r => r.c + r.p + r.l));
    const porNorma = Object.values(acoes.reduce((m, a) => { const r = (m[a.norma] ||= { nome: a.norma, n: 0, c: 0 }); r.n++; if (a.done) r.c++; return m; }, {})).sort((a, b) => b.n - a.n);
    const maxN = Math.max(1, ...porNorma.map(r => r.n));
    const porTst = Object.values(L.reduce((m, i) => { const k = (i.responsavel || "—").trim(); const r = (m[k] ||= { nome: k, n: 0, ult: "", reg: i.registroTst || "", nc: 0, ps: [] }); r.n++; if ((i.data || "") > r.ult) { r.ult = i.data; r.reg = i.registroTst || r.reg; } const s = score(i); if (s.pct != null) r.ps.push(s.pct); r.nc += s.nc; return m; }, {})).sort((a, b) => b.n - a.n);

    const C_REG = "var(--s-reg)", C_DONE = "var(--s-done)", C_OPEN = "var(--s-open)", C_LATE = "var(--s-late)";
    const pend = abertas.sort((a, b) => (a.prazo || "9999").localeCompare(b.prazo || "9999"));

    return lead + `<div class="stack">${filtros}${kpis}
      <section class="panel"><div class="panel-head"><h3>Registradas × concluídas por mês</h3></div>
        <p class="lead" style="margin:-6px 0 8px">Não conformidades pelo mês da inspeção; ações pelo mês em que foram marcadas como concluídas.</p>
        ${legend([[C_REG, "Não conformidades registradas"], [C_DONE, "Ações concluídas"]])}
        ${svgBars(months, [{ name: "Não conformidades registradas", color: C_REG, values: reg }, { name: "Ações concluídas", color: C_DONE, values: don }])}
        ${tableView(["Mês", "Registradas", "Concluídas"], months.map((k, i) => [mLabel(k), reg[i], don[i]]))}
      </section>
      <section class="panel"><div class="panel-head"><h3>Ações em aberto ao fim de cada mês</h3></div>
        <p class="lead" style="margin:-6px 0 8px">Se a linha desce, a equipe está fechando ações mais rápido do que surgem novas não conformidades.</p>
        ${svgLine(months, open, "Ações em aberto")}
        ${tableView(["Mês", "Em aberto no fim do mês"], months.map((k, i) => [mLabel(k), open[i]]))}
      </section>
      <div class="grid2 even">
        <section class="panel"><div class="panel-head"><h3>Situação das ações por setor</h3></div>
          <p class="lead" style="margin:-6px 0 8px">Situação atual de todas as não conformidades registradas.</p>
          ${legend([[C_DONE, "Concluídas"], [C_OPEN, "Abertas no prazo"], [C_LATE, "Atrasadas"]])}
          ${porSetor.length ? `<div class="hbars">${porSetor.map(r => { const tot = r.c + r.p + r.l; return `<div class="hrow"><span class="hl" title="${esc(r.nome)}">${esc(r.nome)}</span>
            <div class="htrack"><div class="hstack" style="width:${tot / maxS * 100}%">${[[r.c, C_DONE, "concluídas"], [r.p, C_OPEN, "abertas no prazo"], [r.l, C_LATE, "atrasadas"]].filter(x => x[0]).map(([v, c, n]) => `<i style="flex:${v};background:${c}" title="${esc(r.nome)}: ${v} ${n}"></i>`).join("")}</div></div>
            <span class="hv">${r.c}/${tot} concluídas</span></div>`; }).join("")}</div>` : `<p class="lead" style="margin:0">Nenhuma não conformidade registrada.</p>`}
          ${porSetor.length ? tableView(["Setor", "Concluídas", "Abertas no prazo", "Atrasadas"], porSetor.map(r => [esc(r.nome), r.c, r.p, r.l])) : ""}
        </section>
        <section class="panel"><div class="panel-head"><h3>Não conformidades por norma</h3></div>
          <p class="lead" style="margin:-6px 0 8px">Onde as falhas se concentram, com quantas já tiveram a ação concluída.</p>
          ${porNorma.length ? `<div class="hbars">${porNorma.map(r => `<div class="hrow"><span class="hl" title="${esc(r.nome)}">${esc(r.nome)}</span>
            <div class="htrack"><div class="hstack" style="width:${r.n / maxN * 100}%"><i style="flex:1;background:${C_REG}" title="${esc(r.nome)}: ${r.n} não conformidades"></i></div></div>
            <span class="hv">${r.n} · ${r.c} concluídas</span></div>`).join("")}</div>` : `<p class="lead" style="margin:0">Nenhuma não conformidade registrada.</p>`}
        </section>
      </div>
      <div class="grid2 even">
        <section class="panel"><div class="panel-head"><h3>Ações corretivas pendentes</h3><span class="label">por prazo</span></div>
          ${pend.length ? `<div class="nc-list">${pend.slice(0, 10).map(p => `<div class="nc-row"><div class="bar" style="background:${p.late ? C_LATE : C_OPEN}"></div>
              <div style="min-width:0"><div class="t">${esc(p.it.texto)}</div>
                <div class="m">${esc(p.setor)}${p.it.secao ? " · " + esc(p.it.secao) : ""} · ${p.it.respAcao ? "Resp.: " + esc(p.it.respAcao) + " · " : ""}${p.prazo ? (p.late ? `<span class="chip bad">vencido ${fmtDate(p.prazo)}</span>` : "prazo " + fmtDate(p.prazo)) : "sem prazo"}</div></div>
              <button class="btn small" data-act="abrir" data-id="${p.insp.id}">Ver</button></div>`).join("")}</div>${pend.length > 10 ? `<p class="label" style="margin:8px 0 0">+ ${pend.length - 10} pendências</p>` : ""}`
          : `<p class="lead" style="margin:0">Nenhuma ação em aberto.</p>`}
        </section>
        <section class="panel"><div class="panel-head"><h3>Inspeções por TST</h3></div>
          <div class="table-wrap" style="border:0"><table><thead><tr><th>TST</th><th>Inspeções</th><th>Última</th><th>Conf.</th><th>NC</th></tr></thead><tbody>
          ${porTst.map(r => `<tr data-act="pf-tst" data-tst="${esc(r.nome)}" tabindex="0"><td>${esc(r.nome)}${r.reg ? `<div class="label">${esc(r.reg)}</div>` : ""}</td><td class="num">${r.n}</td><td class="num">${fmtDate(r.ult)}</td><td>${pctChip(r.ps.length ? Math.round(r.ps.reduce((a, b) => a + b, 0) / r.ps.length) : null)}</td><td class="num">${r.nc}</td></tr>`).join("")}
          </tbody></table></div>
        </section>
      </div>
    </div>`;
  }

  // ---------- Nova inspeção ----------
  function newDraft(setorId) {
    const cfg = state.config, st = cfg.setores.find(s => s.id === setorId);
    const itens = [];
    for (const sid of st.secoes) { const sec = secById(cfg, sid); if (!sec) continue;
      for (const p of sec.perguntas) itens.push({ secaoId: sec.id, secao: sec.nome, nr: sec.nr, texto: p.texto, ref: p.ref, status: "", obs: "", nota: "", foto: "", analiseFoto: "", enquadramento: "", risco: "", acao: "", prazo: "", respAcao: "" }); }
    const tst = lsGet(LS_TST, {});
    return { setorId, setorNome: st.generico ? "" : st.nome, generico: st.generico, local: "", responsavel: tst.nome || "", registroTst: tst.registro || "", data: today(), horaInicio: nowHM(), horaFim: "", turno: "", acompanhante: "", cargoLider: "", assinaturaLider: "", observacoes: "", itens };
  }

  function viewNova() {
    if (!state.canWrite) return `<h2>Nova inspeção</h2><div class="panel empty"><h3>Somente leitura</h3><p>Seu acesso a esta página permite consultar as inspeções, mas não registrar novas.</p></div>`;
    const d = state.draft, cfg = state.config;
    const chips = `<div class="chips">${cfg.setores.map(s => `<button type="button" class="pill" data-setor="${esc(s.id)}" aria-pressed="${d?.setorId === s.id}">${esc(s.nome)} <span class="c">(${countQ(cfg, s)})</span></button>`).join("")}</div>`;
    if (!d) return `<h2>Nova inspeção</h2><p class="lead">Escolha o setor. Cada setor traz só as seções de perguntas que se aplicam a ele.</p>${chips}`;
    const s = score(d), answered = d.itens.filter(i => i.status).length;
    let lastSec = null, n = 0, secN = 0;
    const rows = d.itens.map((it, i) => {
      let head = "";
      if (it.secaoId !== lastSec) { lastSec = it.secaoId; secN++; n = 0;
        const total = d.itens.filter(x => x.secaoId === it.secaoId).length;
        head = `<div class="sec-head"><h3>${esc(it.secao)}</h3><span class="label">${esc(it.nr || "")}${it.nr ? " · " : ""}${total} perguntas <button type="button" class="btn small" data-act="sec-c" data-sec="${esc(it.secaoId)}" style="margin-left:8px">Pendentes = C</button></span></div>`; }
      n++;
      return head + itemRow(it, i, `${secN}.${n}`);
    }).join("");
    return `<h2>Nova inspeção</h2><p class="lead">${esc(d.generico ? "Outro setor" : d.setorNome)} · ${d.itens.length} perguntas</p>
    <form id="f-insp" class="stack" novalidate>
      <details class="panel"><summary class="label" style="cursor:pointer">Trocar setor</summary><div style="margin-top:12px">${chips}</div></details>
      <section class="panel">
        <div class="panel-head"><h3>Dados do TST</h3><span class="label">quem realizou a inspeção</span></div>
        <div class="fields">
          <label class="field span2"><span class="label">Nome do TST *</span><input id="f-resp" required value="${esc(d.responsavel)}" placeholder="Nome completo do técnico"></label>
          <label class="field"><span class="label">Registro profissional</span><input id="f-reg" value="${esc(d.registroTst)}" placeholder="Ex.: MTE/SRTE nº 12345"></label>
          <label class="field"><span class="label">Data da inspeção *</span><input id="f-data" type="date" required value="${esc(d.data)}"></label>
          <label class="field"><span class="label">Hora de início</span><input id="f-hini" type="time" value="${esc(d.horaInicio)}"><span class="label" style="text-transform:none;letter-spacing:0">Registrada ao abrir a inspeção</span></label>
          <label class="field"><span class="label">Hora de término</span><input id="f-hfim" type="time" value="${esc(d.horaFim)}" placeholder="ao salvar"><span class="label" style="text-transform:none;letter-spacing:0">${d.horaFim ? "" : "Preenchida ao salvar"}</span></label>
          <label class="field"><span class="label">Turno</span><select id="f-turno"><option value="">—</option>${["1º turno", "2º turno", "3º turno", "Administrativo"].map(o => `<option ${d.turno === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Setor inspecionado</h3></div>
        <div class="fields">
          ${d.generico ? `<label class="field"><span class="label">Nome do setor *</span><input id="f-setor-nome" required value="${esc(d.setorNome)}" placeholder="Ex.: Manutenção"></label>` : ""}
          <label class="field ${d.generico ? "" : "span2"}"><span class="label">Local / área</span><input id="f-local" value="${esc(d.local)}" placeholder="Ex.: Célula 3, forno 2"></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Liderança que acompanhou</h3></div>
        <div class="fields">
          <label class="field span2"><span class="label">Nome da liderança *</span><input id="f-acomp" required value="${esc(d.acompanhante)}" placeholder="Nome de quem acompanhou a inspeção"></label>
          <label class="field"><span class="label">Cargo / função</span><input id="f-cargo" value="${esc(d.cargoLider)}" placeholder="Ex.: Supervisor, Líder de turno"></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Perguntas</h3>
          <div class="progress"><span><b>${answered}</b>/${d.itens.length} respondidas</span><span class="chip ok">${s.c} C</span><span class="chip bad">${s.nc} NC</span><span class="chip na">${s.na} N/A</span></div></div>
        <div class="items">${rows}</div>
      </section>
      <section class="panel">
        <label class="field"><span class="label">Observações gerais</span><textarea id="f-obs" placeholder="Condições encontradas, orientações dadas no local…">${esc(d.observacoes)}</textarea></label>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Assinatura da liderança *</h3><button type="button" class="btn small" data-act="sig-clear">Limpar assinatura</button></div>
        <p class="lead" style="margin:-4px 0 10px">${d.acompanhante ? esc(d.acompanhante) : "A liderança"} assina com o dedo ou o mouse no quadro abaixo, ao final da inspeção.</p>
        <canvas id="sig-pad" class="sig-pad" width="900" height="240" aria-label="Quadro de assinatura da liderança"></canvas>
        <div class="sig-line"><span>${esc(d.acompanhante || "Nome da liderança")}${d.cargoLider ? " · " + esc(d.cargoLider) : ""}</span></div>
      </section>
      <div class="sticky-actions">
        <span class="label" id="f-msg">Todas as perguntas precisam de resposta.</span>
        <div class="row-actions"><button type="button" class="btn" data-act="descartar">Descartar</button><button type="submit" class="btn primary">Salvar inspeção</button></div>
      </div>
    </form>`;
  }

  function itemRow(it, i, num) {
    const seg = ["C", "NC", "NA"].map(v => `<button type="button" data-v="${v}" data-i="${i}" aria-pressed="${it.status === v}" aria-label="${{ C: "Conforme", NC: "Não conforme", NA: "Não aplicável" }[v]}">${v === "NA" ? "N/A" : v}</button>`).join("");
    const ai = state.ai[i];
    const aiBox = !sample ? `<div class="ai-note">A análise automática pelo Claude funciona quando o sistema é aberto dentro do Claude. Aqui, preencha os campos manualmente.</div>`
      : ai?.status === "loading" ? `<div class="ai-note busy">Claude está analisando a foto e montando o plano de ação…</div>`
      : ai?.status === "erro" ? `<div class="ai-note err">${esc(ai.msg)} <button type="button" class="btn small" data-act="ai-run" data-i="${i}">Tentar de novo</button></div>`
      : it.foto ? `<div class="ai-note">${it.analiseFoto ? "Texto gerado pelo Claude. Revise antes de salvar." : "Anexe a foto e, se quiser, escreva o que viu. O Claude completa o resto."} <button type="button" class="btn small" data-act="ai-run" data-i="${i}">${it.analiseFoto ? "Gerar de novo" : "Analisar com Claude"}</button></div>` : "";
    const extra = it.status === "NC" ? `<div class="extra">
        <div class="field span3 foto-field"><span class="label">Foto da não conformidade *</span>
          <div class="foto-row">${it.foto ? imgTag(it.foto, "evid", "Foto da não conformidade") : `<div class="foto-empty">Sem foto</div>`}
            <label class="btn small"><input type="file" accept="image/*" capture="environment" data-nc-foto="${i}" hidden>${it.foto ? "Trocar foto" : "Tirar ou anexar foto"}</label></div></div>
        <label class="field span3"><span class="label">O que o TST observou (rascunho)</span><input id="nc-nota-${i}" data-k="nota" data-i="${i}" value="${esc(it.nota)}" placeholder="Ex.: proteção da correia aberta"></label>
        <div class="span3">${aiBox}</div>
        ${it.analiseFoto ? `<div class="field span3"><span class="label">Análise da foto pelo Claude${it.risco ? ` · <span class="chip ${it.risco === "Alto" ? "bad" : it.risco === "Médio" ? "warn" : "ok"}">Risco ${esc(it.risco)}</span>` : ""}</span><div class="ai-text">${esc(it.analiseFoto)}</div></div>` : ""}
        ${(it.perguntasIA || []).some(x => !x.r?.trim()) || (it.perguntasIA || []).length ? `<div class="field span3 perguntas"><span class="label">Perguntas do Claude para completar o plano</span>
          ${it.perguntasIA.map((x, k) => `<label class="field"><span>${esc(x.q)}</span><input id="pq-${i}-${k}" data-pq="${i}:${k}" value="${esc(x.r)}" placeholder="Sua resposta"></label>`).join("")}
          ${sample ? `<div><button type="button" class="btn small primary" data-act="ai-run" data-i="${i}">Responder e atualizar plano</button></div>` : ""}</div>` : ""}
        <label class="field span3"><span class="label">Descrição técnica da não conformidade *</span><textarea id="nc-obs-${i}" data-k="obs" data-i="${i}" placeholder="Descrição técnica conforme a NR">${esc(it.obs)}</textarea></label>
        <label class="field span3"><span class="label">Enquadramento legal</span><input id="nc-enq-${i}" data-k="enquadramento" data-i="${i}" value="${esc(it.enquadramento)}" placeholder="Ex.: NR-12, item 12.5.1"></label>
        <label class="field span3"><span class="label">Plano de ação *</span><textarea id="nc-acao-${i}" data-k="acao" data-i="${i}" placeholder="O que deve ser feito para corrigir">${esc(it.acao)}</textarea></label>
        <label class="field span2"><span class="label">Responsável pela execução *</span><input id="nc-resp-${i}" data-k="respAcao" data-i="${i}" value="${esc(it.respAcao)}" placeholder="Nome de quem vai executar"></label>
        <label class="field"><span class="label">Prazo *</span><input id="nc-prazo-${i}" type="date" data-k="prazo" data-i="${i}" value="${esc(it.prazo)}"></label>
      </div>` : (it.status ? `<input class="obs" id="it-obs-${i}" data-k="obs" data-i="${i}" value="${esc(it.obs)}" placeholder="Observação (opcional)">` : "");
    return `<div class="item" id="item-${i}"><span class="n">${num}</span>
      <div class="txt">${esc(it.texto)}${it.ref ? `<div class="ref">${esc(it.ref)}</div>` : ""}</div>
      <div class="seg" role="group" aria-label="Resultado da pergunta ${num}">${seg}</div>${extra}</div>`;
  }

  async function runAI(i) {
    const d = state.draft, it = d?.itens[i];
    if (!sample || !it?.foto) return;
    state.ai[i] = { status: "loading" }; rerenderKeep();
    const prompt = `Você é um Técnico de Segurança do Trabalho sênior no Brasil, numa fundição. Analise a foto anexada, tirada durante uma inspeção de segurança, e responda em português do Brasil.

Setor: ${d.setorNome || "não informado"}
Local: ${d.local || "não informado"}
Seção do checklist: ${it.secao} (${it.nr || "sem norma indicada"})
Pergunta marcada como NÃO CONFORME: "${it.texto}"${it.ref ? ` (referência ${it.ref})` : ""}
Descrição/anotação do TST: ${it.nota?.trim() || "nenhuma"}
${it.obs?.trim() && it.analiseFoto ? `Descrição técnica atual: ${it.obs.trim()}\n` : ""}${(it.perguntasIA || []).filter(x => x.r?.trim()).length ? "Respostas do TST às suas perguntas anteriores:\n" + it.perguntasIA.filter(x => x.r?.trim()).map(x => `- ${x.q} → ${x.r.trim()}`).join("\n") + "\n" : ""}
Tarefas:
1. Descreva objetivamente o que a foto mostra em relação a essa pergunta. Se a foto não mostrar a não conformidade, diga isso claramente.
2. Escreva a descrição técnica da não conformidade, em linguagem formal de relatório de SST, citando a NR e o item aplicável (NRs do MTE vigentes).
3. Classifique o risco: Alto, Médio ou Baixo.
4. Monte o plano de ação: medidas objetivas, na ordem de execução (imediata e definitiva), seguindo a hierarquia de controles.
5. Sugira o prazo em dias corridos: Alto até 7, Médio até 15, Baixo até 30.
6. Se faltar informação para um plano de ação preciso (por exemplo: se o equipamento está em operação, dimensões, quantidade de trabalhadores expostos, frequência da atividade, se já existe proteção), faça até 3 perguntas curtas e objetivas ao TST. Não repita perguntas já respondidas. Se não faltar nada, devolva a lista vazia.

Responda só com JSON neste formato:
{"analiseFoto": "...", "fotoMostraNC": true, "descricaoTecnica": "...", "enquadramento": "NR-xx, item x.x.x", "risco": "Alto", "planoAcao": "1. ... 2. ...", "prazoDias": 7, "perguntas": ["..."]}`;
    try {
      const r = await sample.json(prompt, { images: [dataToBlob(it.foto)] });
      const cur = state.draft?.itens[i]; if (!cur) return;
      cur.analiseFoto = String(r.analiseFoto || "") + (r.fotoMostraNC === false ? " (Atenção: a foto não parece mostrar a não conformidade; confira ou troque a foto.)" : "");
      if (r.descricaoTecnica) cur.obs = String(r.descricaoTecnica);
      if (r.enquadramento) cur.enquadramento = String(r.enquadramento);
      if (r.planoAcao) cur.acao = String(r.planoAcao);
      if (["Alto", "Médio", "Baixo"].includes(r.risco)) cur.risco = r.risco;
      const respondidas = (cur.perguntasIA || []).filter(x => x.r?.trim());
      const novas = Array.isArray(r.perguntas) ? r.perguntas.map(String).filter(q => q.trim() && !respondidas.some(x => x.q === q)).slice(0, 3) : [];
      cur.perguntasIA = [...respondidas, ...novas.map(q => ({ q, r: "" }))];
      const dias = Math.max(1, Math.min(90, parseInt(r.prazoDias) || 15));
      if (!cur.prazo) { const dt = new Date(); dt.setDate(dt.getDate() + dias); cur.prazo = dt.toISOString().slice(0, 10); }
      state.ai[i] = { status: "ok" };
    } catch (e) {
      state.ai[i] = { status: "erro", msg: e?.code === "not_granted" ? "Você não autorizou o Claude nesta página. Preencha manualmente ou autorize e tente de novo."
        : e?.code === "rate_limited" ? "Muitas análises seguidas. Aguarde um pouco e tente de novo."
        : e?.code === "images_unavailable" || e?.code === "image_rejected" ? "O Claude não conseguiu ler esta foto. Tente outra imagem."
        : "Não foi possível analisar agora. Tente de novo ou preencha manualmente." };
    }
    if (state.view === "nova") rerenderKeep();
  }
  function rerenderKeep() { if (state.view !== "nova") return; const y = window.scrollY; render(); window.scrollTo(0, y); }

  function readHeader() {
    const d = state.draft; if (!d) return;
    const g = id => document.getElementById(id);
    if (!g("f-data")) return;
    if (g("f-setor-nome")) d.setorNome = g("f-setor-nome").value;
    d.local = g("f-local").value; d.data = g("f-data").value; d.responsavel = g("f-resp").value; d.acompanhante = g("f-acomp").value; d.cargoLider = g("f-cargo").value; d.observacoes = g("f-obs").value;
    d.registroTst = g("f-reg").value; d.horaInicio = g("f-hini").value; d.horaFim = g("f-hfim").value; d.turno = g("f-turno").value;
  }

  function bindNova() {
    const f = document.getElementById("f-insp"); if (!f) return;
    const pad = document.getElementById("sig-pad");
    if (pad) {
      const ctx = pad.getContext("2d");
      ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1d211c";
      if (state.draft.assinaturaLider) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = state.draft.assinaturaLider; }
      let drawing = false, last = null;
      const pt = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
      pad.addEventListener("pointerdown", e => { drawing = true; last = pt(e); pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.4, 0, Math.PI * 2); ctx.fillStyle = "#1d211c"; ctx.fill(); });
      pad.addEventListener("pointermove", e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
      const end = () => { if (!drawing) return; drawing = false; state.draft.assinaturaLider = pad.toDataURL("image/png"); };
      pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end);
    }
    f.addEventListener("input", e => {
      if (e.target.dataset.pq) { const [i, k] = e.target.dataset.pq.split(":").map(Number); state.draft.itens[i].perguntasIA[k].r = e.target.value; return; }
      const k = e.target.dataset.k, i = e.target.dataset.i;
      if (k != null && i != null) state.draft.itens[+i][k] = e.target.value;
    });
    f.addEventListener("submit", async e => {
      e.preventDefault(); readHeader();
      const d = state.draft, msg = document.getElementById("f-msg");
      const fail = (t, id) => { msg.textContent = t; msg.style.color = "var(--bad)"; if (id) document.getElementById(id)?.focus(); };
      if (d.generico && !d.setorNome.trim()) return fail("Digite o nome do setor.", "f-setor-nome");
      if (!d.data) return fail("Preencha a data.", "f-data");
      if (!d.responsavel.trim()) return fail("Preencha o nome do TST.", "f-resp");
      if (!d.acompanhante.trim()) return fail("Preencha o nome da liderança que acompanhou.", "f-acomp");
      const faltando = d.itens.findIndex(i => !i.status);
      if (faltando >= 0) { fail(`Responda a pergunta "${d.itens[faltando].texto.slice(0, 50)}…"`); document.getElementById("item-" + faltando).scrollIntoView({ block: "center" }); return; }
      const semResp = d.itens.findIndex(i => i.status === "NC" && (i.perguntasIA || []).some(x => !x.r?.trim()));
      if (semResp >= 0) { fail("Responda as perguntas do Claude e clique em Responder e atualizar plano."); document.getElementById("item-" + semResp).scrollIntoView({ block: "center" }); return; }
      const ncFalta = d.itens.findIndex(i => i.status === "NC" && (!i.foto || !i.obs?.trim() || !i.acao?.trim() || !i.respAcao?.trim() || !i.prazo));
      if (ncFalta >= 0) { const x = d.itens[ncFalta]; fail(`Não conformidade "${x.texto.slice(0, 40)}…": falta ${!x.foto ? "a foto" : !x.obs?.trim() ? "a descrição técnica" : !x.acao?.trim() ? "o plano de ação" : !x.respAcao?.trim() ? "o responsável pela execução" : "o prazo"}.`); document.getElementById("item-" + ncFalta).scrollIntoView({ block: "center" }); return; }
      if (Object.values(state.ai).some(a => a?.status === "loading")) return fail("Aguarde o Claude terminar a análise das fotos.");
      if (!d.assinaturaLider) { fail("Colha a assinatura da liderança no quadro de assinatura."); document.getElementById("sig-pad").scrollIntoView({ block: "center" }); return; }
      if (!d.horaFim) d.horaFim = nowHM();
      if (!d.horaInicio) d.horaInicio = d.horaFim;
      const insp = { id: uid(), ...structuredClone(d), setorNome: d.setorNome.trim(), criadoEm: Date.now(), itens: d.itens.map(i => ({ ...i, corrigido: false, corrigidoEm: "" })) };
      delete insp.generico;
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Salvando…";
      lsSet(LS_TST, { nome: insp.responsavel.trim(), registro: (insp.registroTst || "").trim() });
      try {
        btn.textContent = "Enviando fotos…";
        for (const it of insp.itens) if (it.foto) it.foto = await persistFoto(it.foto);
        insp.assinaturaLider = await persistFoto(insp.assinaturaLider);
        btn.textContent = "Salvando…";
        await saveInsp(insp); state.draft = null; state.ai = {}; toast("Inspeção salva"); go("detalhe", { selected: insp.id }); }
      catch (err) {
        btn.disabled = false; btn.textContent = "Salvar inspeção";
        fail(err?.code === "invalid_argument" ? "Seu acesso não permite salvar inspeções nesta página." : err?.code === "quota_exceeded" ? "O banco atingiu o limite de registros. Exclua inspeções antigas para continuar." : "Não foi possível salvar agora. Tente novamente em instantes.");
      }
    });
  }

  // ---------- Setores e perguntas ----------
  function viewSetores() {
    if (!state.cfgDraft) state.cfgDraft = structuredClone(state.config);
    const cfg = state.cfgDraft;
    if (!cfg.setores.find(s => s.id === state.cfgSetor)) state.cfgSetor = cfg.setores[0]?.id;
    if (!cfg.secoes.find(s => s.id === state.cfgSecao)) state.cfgSecao = cfg.secoes[0]?.id;
    const st = cfg.setores.find(s => s.id === state.cfgSetor);
    const sec = cfg.secoes.find(s => s.id === state.cfgSecao);
    const ro = !state.canWrite;
    return `<h2>Setores e perguntas</h2><p class="lead">Cada setor recebe só as seções que se aplicam a ele. As mudanças valem para as próximas inspeções; as já registradas mantêm suas perguntas.</p>
    <div class="stack">
      <div class="chips">${cfg.setores.map(s => `<button type="button" class="pill" data-act="cfg-setor" data-id="${esc(s.id)}" aria-pressed="${s.id === state.cfgSetor}">${esc(s.nome)} <span class="c">(${countQ(cfg, s)})</span></button>`).join("")}
        ${ro ? "" : `<button type="button" class="pill" data-act="cfg-novo-setor">+ Novo setor</button>`}</div>
      ${st ? `<section class="panel stack" style="gap:14px">
        <div class="fields">
          <label class="field span2"><span class="label">Nome do setor</span><input id="cfg-nome" data-cfg="nome" value="${esc(st.nome)}" ${ro ? "disabled" : ""}></label>
          <label class="inline-check" style="align-self:end"><input type="checkbox" id="cfg-generico" data-cfg="generico" ${st.generico ? "checked" : ""} ${ro ? "disabled" : ""}><span>O TST digita o nome do setor ao abrir a inspeção (setor genérico)</span></label>
        </div>
        <div><h3>Seções de perguntas</h3><p class="lead" style="margin:2px 0 10px">Marque as seções que se aplicam a este setor.</p>
          <div class="check-grid">${cfg.secoes.map(s => `<label class="check-card"><input type="checkbox" data-cfg="secao" value="${esc(s.id)}" ${st.secoes.includes(s.id) ? "checked" : ""} ${ro ? "disabled" : ""}>
            <span class="nm">${esc(s.nome)}</span><span class="sub">${s.perguntas.length} perguntas${s.nr ? " · " + esc(s.nr) : ""}</span></label>`).join("")}</div></div>
        ${ro ? "" : (state.cfgConfirmDel ? `<div class="confirm">Excluir o setor "${esc(st.nome)}"? As inspeções já registradas não são apagadas. <button class="btn small danger" data-act="cfg-del-sim">Excluir</button><button class="btn small" data-act="cfg-del-nao">Cancelar</button></div>`
          : `<div><button type="button" class="btn danger small" data-act="cfg-del">Excluir setor</button></div>`)}
      </section>` : ""}
      <section class="panel stack" style="gap:12px">
        <div class="panel-head" style="margin:0"><h3>Perguntas das seções</h3>${ro ? "" : `<button type="button" class="btn small" data-act="cfg-nova-secao">+ Nova seção</button>`}</div>
        <div class="chips">${cfg.secoes.map(s => `<button type="button" class="pill" data-act="cfg-secao" data-id="${esc(s.id)}" aria-pressed="${s.id === state.cfgSecao}">${esc(s.nome)} <span class="c">(${s.perguntas.length})</span></button>`).join("")}</div>
        ${sec ? `<div class="fields">
          <label class="field span2"><span class="label">Nome da seção</span><input id="sec-nome" data-sec="nome" value="${esc(sec.nome)}" ${ro ? "disabled" : ""}></label>
          <label class="field"><span class="label">Norma</span><input id="sec-nr" data-sec="nr" value="${esc(sec.nr)}" placeholder="Ex.: NR-12" ${ro ? "disabled" : ""}></label>
        </div>
        <div>${sec.perguntas.map((p, i) => `<div class="q-row"><span class="n">${i + 1}</span>
          <input id="q-t-${i}" data-q="texto" data-i="${i}" value="${esc(p.texto)}" ${ro ? "disabled" : ""}>
          <input class="ref-in" id="q-r-${i}" data-q="ref" data-i="${i}" value="${esc(p.ref)}" placeholder="Item da NR" ${ro ? "disabled" : ""}>
          ${ro ? "" : `<button type="button" class="btn small danger" data-act="q-del" data-i="${i}" aria-label="Remover pergunta ${i + 1}">Remover</button>`}</div>`).join("")}</div>
        ${ro ? "" : `<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="q-nova" placeholder="Nova pergunta para a seção ${esc(sec.nome)}" style="flex:1 1 260px;width:auto"><button type="button" class="btn" data-act="q-add">Adicionar pergunta</button></div>`}` : ""}
      </section>
      ${ro ? "" : `<div class="save-bar"><button type="button" class="btn primary" data-act="cfg-salvar" ${state.cfgDirty ? "" : "disabled"}>Salvar alterações</button>
        <button type="button" class="btn" data-act="cfg-descartar" ${state.cfgDirty ? "" : "disabled"}>Descartar</button>
        <span class="label">${state.cfgDirty ? "Há alterações não salvas" : "Tudo salvo"}</span>
        <button type="button" class="btn small" data-act="cfg-padrao" style="margin-left:auto">Restaurar padrão</button></div>`}
    </div>`;
  }
  function cfgChanged(rerender = true) {
    state.cfgDirty = true;
    if (rerender) { const y = window.scrollY; render(); window.scrollTo(0, y); }
    else document.querySelectorAll('[data-act="cfg-salvar"],[data-act="cfg-descartar"]').forEach(b => b.disabled = false);
  }

  // ---------- Histórico ----------
  function filtered() {
    const qq = state.filtro.q.trim().toLowerCase();
    return state.inspecoes.filter(i => (!state.filtro.setor || setorLabel(i) === state.filtro.setor) &&
      (!qq || [setorLabel(i), i.local, i.responsavel].join(" ").toLowerCase().includes(qq)));
  }
  function viewHistorico() {
    const lead = `<h2>Histórico</h2><p class="lead">Todas as inspeções registradas. Clique em uma linha para ver o relatório.</p>`;
    if (!state.inspecoes.length) return lead + emptyState("Nenhuma inspeção ainda", "Registre a primeira inspeção para montar o histórico.");
    const setores = [...new Set(state.inspecoes.map(setorLabel))].sort();
    return lead + `<div class="filters">
        <input id="h-q" type="search" placeholder="Buscar por setor, local ou TST" value="${esc(state.filtro.q)}">
        <select id="h-setor"><option value="">Todos os setores</option>${setores.map(s => `<option ${state.filtro.setor === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <button class="btn" data-act="csv">Exportar CSV</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Data</th><th>Setor</th><th class="hide-sm">Local</th><th class="hide-sm">TST</th><th>Conformidade</th><th>NC abertas</th></tr></thead>
      <tbody id="h-body">${histRows(filtered())}</tbody></table></div>
      <div id="copy-area"></div>`;
  }
  function histRows(L) {
    if (!L.length) return `<tr><td colspan="6" class="empty">Nenhuma inspeção corresponde à busca.</td></tr>`;
    return L.map(i => { const s = score(i); const ab = i.itens.filter(x => x.status === "NC" && !x.corrigido).length;
      return `<tr data-act="abrir" data-id="${i.id}" tabindex="0"><td class="num">${fmtDate(i.data)}</td><td>${esc(setorLabel(i))}${i.exemplo ? ` <span class="chip ex">exemplo</span>` : ""}</td>
      <td class="hide-sm">${esc(i.local || "—")}</td><td class="hide-sm">${esc(i.responsavel)}</td><td>${pctChip(s.pct)}</td><td class="num">${ab ? `<span class="chip bad">${ab}</span>` : "0"}</td></tr>`; }).join("");
  }

  // ---------- Detalhe ----------
  function viewDetalhe() {
    const i = state.inspecoes.find(x => x.id === state.selected);
    if (!i) return `<h2>Inspeção não encontrada</h2><p class="lead">Ela pode ter sido excluída.</p><button class="btn" data-act="voltar">Voltar ao histórico</button>`;
    const s = score(i);
    let last = null;
    const itens = i.itens.map((it, idx) => {
      const head = it.secao && it.secao !== last ? `<div class="sec-head"><h3>${esc(it.secao)}</h3><span class="label">${esc(it.nr || "")}</span></div>` : "";
      last = it.secao || last;
      return head + `<div class="d-item"><span class="n label" style="padding-top:2px">${idx + 1}</span>
        <div>${esc(it.texto)}${it.ref ? ` <span class="label">${esc(it.ref)}</span>` : ""}</div>
        <span class="chip ${it.status === "C" ? "ok" : it.status === "NC" ? "bad" : "na"}">${{ C: "Conforme", NC: "Não conforme", NA: "N/A" }[it.status]}</span>
        ${it.obs ? `<div class="note">${esc(it.obs)}</div>` : ""}
        ${it.status === "NC" && (it.foto || it.enquadramento || it.risco) ? `<div class="note nc-info">${imgTag(it.foto, "evid", "Foto da não conformidade")}<div>${it.enquadramento ? `<div><span class="label">Enquadramento</span> ${esc(it.enquadramento)}</div>` : ""}${it.risco ? `<div><span class="label">Risco</span> ${esc(it.risco)}</div>` : ""}${it.analiseFoto ? `<div class="m">${esc(it.analiseFoto)}</div>` : ""}</div></div>` : ""}
        ${it.status === "NC" ? `<div class="act ${it.corrigido ? "done" : ""}">
          <span><span class="label">Plano de ação</span> ${esc(it.acao || "não definido")}</span>
          ${it.respAcao ? `<span><span class="label">Responsável pela execução</span> ${esc(it.respAcao)}</span>` : ""}
          <span><span class="label">Prazo</span> ${fmtDate(it.prazo)}</span>
          ${it.corrigido ? `<span class="chip ok">Finalizada em ${fmtDate(it.corrigidoEm)}${it.prazo ? (it.corrigidoEm <= it.prazo ? " · no prazo" : " · fora do prazo") : ""}</span>`
            : state.canWrite ? (state.closing?.idx === idx ? "" : `<button class="btn small" data-act="finalizar" data-idx="${idx}">Finalizar ação</button>`) : `<span class="chip bad">Em aberto</span>`}
          ${it.corrigido ? `<div class="fin">
              <span class="label">Finalização da ação</span>
              <div>${esc(it.descricaoConclusao || "Sem descrição")}</div>
              <div class="m">${it.corrigidoPor ? "Executado por " + esc(it.corrigidoPor) + " · " : ""}${fmtDate(it.corrigidoEm)}</div>
              ${imgTag(it.fotoConclusao, "evid", "Foto da ação concluída")}
              ${state.canWrite ? `<div><button class="btn small" data-act="reabrir" data-idx="${idx}">Reabrir ação</button></div>` : ""}
            </div>` : ""}
          ${!it.corrigido && state.closing?.idx === idx ? finForm(idx) : ""}
        </div>` : ""}</div>`;
    }).join("");
    return `<div class="stack">
      <div><button class="btn small" data-act="voltar">← Histórico</button></div>
      <section class="panel">
        <div class="detail-head">
          <div style="min-width:0"><span class="label">Setor</span><h2 style="margin-top:4px">${esc(setorLabel(i))}</h2>${i.exemplo ? `<span class="chip ex">registro de exemplo</span>` : ""}</div>
          <div style="text-align:right"><div class="score" style="color:${pctColor(s.pct)}">${s.pct ?? "—"}${s.pct != null ? "%" : ""}</div><span class="label">conformidade</span></div>
        </div>
        <div class="meta">
          <div><span class="label">Data</span><b>${fmtDate(i.data)}</b></div>
          <div><span class="label">Local / área</span><b>${esc(i.local || "—")}</b></div>
          <div><span class="label">TST</span><b>${esc(i.responsavel)}</b>${i.registroTst ? `<span class="label">${esc(i.registroTst)}</span>` : ""}</div>
          <div><span class="label">Horário</span><b>${i.horaInicio || i.horaFim ? `${esc(i.horaInicio || "?")} – ${esc(i.horaFim || "?")}` : "—"}</b></div>
          <div><span class="label">Turno</span><b>${esc(i.turno || "—")}</b></div>
          <div><span class="label">Liderança</span><b>${esc(i.acompanhante || "—")}</b>${i.cargoLider ? `<span class="label">${esc(i.cargoLider)}</span>` : ""}</div>
          <div><span class="label">Resultado</span><b><span class="chip ok">${s.c} C</span> <span class="chip bad">${s.nc} NC</span> <span class="chip na">${s.na} N/A</span></b></div>
        </div>
        ${i.observacoes ? `<p style="margin:16px 0 0;max-width:65ch"><span class="label">Observações gerais</span><br>${esc(i.observacoes)}</p>` : ""}
      </section>
      <section class="panel">${itens}</section>
      ${i.assinaturaLider ? `<section class="panel"><div class="panel-head"><h3>Assinatura da liderança</h3><span class="label">${fmtDate(i.data)} ${esc(i.horaFim || "")}</span></div>
        ${imgTag(i.assinaturaLider, "sig-img", "Assinatura de " + i.acompanhante)}<div class="sig-line"><span>${esc(i.acompanhante)}${i.cargoLider ? " · " + esc(i.cargoLider) : ""}</span></div></section>` : ""}
      <div class="row-actions">
        <button class="btn" data-act="relatorio">Baixar relatório (HTML)</button>
        <button class="btn" data-act="csv-one">Exportar CSV</button>
        ${i.setorId && state.config.setores.some(s => s.id === i.setorId) ? `<button class="btn" data-act="duplicar">Nova inspeção neste setor</button>` : ""}
        ${state.canWrite ? (state.confirmDelete
          ? `<div class="confirm">Excluir esta inspeção definitivamente? <button class="btn small danger" data-act="excluir-sim">Excluir</button><button class="btn small" data-act="excluir-nao">Cancelar</button></div>`
          : `<button class="btn danger" data-act="excluir">Excluir</button>`) : ""}
      </div>
      <div id="copy-area"></div>
    </div>`;
  }

  function finForm(idx) {
    const c = state.closing;
    return `<div class="fin fin-form">
      <span class="label">Finalização da ação</span>
      <div class="fields">
        <label class="field"><span class="label">Data de conclusão *</span><input id="fin-data" type="date" value="${esc(c.data)}"></label>
        <label class="field span2"><span class="label">Executado por *</span><input id="fin-por" value="${esc(c.por)}" placeholder="Quem realizou a ação"></label>
        <label class="field span3"><span class="label">O que foi feito *</span><textarea id="fin-desc" placeholder="Descreva a correção realizada">${esc(c.desc)}</textarea></label>
        <label class="field span3"><span class="label">Foto da ação concluída *</span><input id="fin-foto" type="file" accept="image/*"></label>
      </div>
      ${c.foto ? imgTag(c.foto, "evid", "Prévia da foto de evidência") : ""}
      <div class="row-actions"><span class="label" id="fin-msg" style="align-self:center"></span>
        <button class="btn small" data-act="fin-cancelar">Cancelar</button><button class="btn small primary" data-act="fin-salvar" data-idx="${idx}">Salvar finalização</button></div>
    </div>`;
  }
  function shrinkImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { const k = Math.min(1, 800 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.6)); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(); };
      img.src = url;
    });
  }

  // ---------- Exportação ----------
  function toCSV(list) {
    const head = ["Data", "Setor", "Local", "TST", "Registro TST", "Turno", "Liderança", "Cargo liderança", "Seção", "Norma", "Nº", "Pergunta", "Ref.", "Resultado", "Descrição técnica", "Enquadramento", "Risco", "Plano de ação", "Responsável pela execução", "Prazo", "Situação da ação", "Data de conclusão", "Executado por", "O que foi feito", "No prazo"];
    const qq = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [head.map(qq).join(";")];
    for (const i of list) i.itens.forEach((it, n) => rows.push([fmtDate(i.data), setorLabel(i), i.local, i.responsavel, i.registroTst, i.turno, i.acompanhante, i.cargoLider, it.secao, it.nr || i.nr, n + 1, it.texto, it.ref,
      { C: "Conforme", NC: "Não conforme", NA: "N/A" }[it.status], it.obs, it.enquadramento, it.risco, it.acao, it.respAcao, it.prazo ? fmtDate(it.prazo) : "", it.status === "NC" ? (it.corrigido ? "Finalizada" : "Em aberto") : "", it.corrigido ? fmtDate(it.corrigidoEm) : "", it.corrigidoPor, it.descricaoConclusao,
      it.corrigido && it.prazo ? (it.corrigidoEm <= it.prazo ? "Sim" : "Não") : ""].map(qq).join(";")));
    return "﻿" + rows.join("\r\n");
  }
  async function reportHTML(i0) {
    const i = structuredClone(i0);
    i.assinaturaLider = await resolveFoto(i.assinaturaLider);
    for (const it of i.itens) { it.foto = await resolveFoto(it.foto); it.fotoConclusao = await resolveFoto(it.fotoConclusao); }
    const s = score(i), lab = { C: "Conforme", NC: "Não conforme", NA: "N/A" };
    let last = null;
    const rows = i.itens.map((it, n) => {
      const h = it.secao && it.secao !== last ? `<tr><th colspan="5" style="background:#1d211c;color:#fff">${esc(it.secao)}${it.nr ? " · " + esc(it.nr) : ""}</th></tr>` : "";
      last = it.secao || last;
      return h + `<tr><td>${n + 1}</td><td>${esc(it.texto)}${it.ref ? ` <small>(${esc(it.ref)})</small>` : ""}</td><td class="${it.status}">${lab[it.status]}</td><td>${esc(it.obs)}${it.enquadramento ? `<br><small><b>Enquadramento:</b> ${esc(it.enquadramento)}</small>` : ""}${it.risco ? `<br><small><b>Risco:</b> ${esc(it.risco)}</small>` : ""}${(it.perguntasIA || []).length ? `<br><small>${it.perguntasIA.map(x => `<b>${esc(x.q)}</b> ${esc(x.r)}`).join("<br>")}</small>` : ""}${it.foto ? `<br><img src="${it.foto}" alt="Foto da NC" style="max-width:220px;margin-top:4px">` : ""}</td><td>${it.status === "NC" ? `${esc(it.acao)}${it.respAcao ? "<br><b>Responsável pela execução:</b> " + esc(it.respAcao) : ""}${it.prazo ? " / " + fmtDate(it.prazo) : ""}${it.corrigido ? `<br><b>Finalizada em ${fmtDate(it.corrigidoEm)}</b>${it.corrigidoPor ? " por " + esc(it.corrigidoPor) : ""}: ${esc(it.descricaoConclusao || "")}${it.fotoConclusao ? `<br><img src="${it.fotoConclusao}" alt="Evidência" style="max-width:220px;margin-top:4px">` : ""}` : ""}` : ""}</td></tr>`;
    }).join("");
    return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Inspeção – ${esc(setorLabel(i))} – ${fmtDate(i.data)}</title>
<style>body{font-family:Arial,sans-serif;color:#1d211c;max-width:900px;margin:24px auto;padding:0 16px;font-size:13px}h1{font-size:20px;margin:0}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #bbb;padding:6px;text-align:left;vertical-align:top}th{background:#eee}.C{color:#1f7a3d}.NC{color:#c0281e;font-weight:bold}.meta td{border:0;padding:2px 12px 2px 0}.sig{display:flex;gap:48px;margin-top:96px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}</style></head><body>
<div style="height:6px;background:repeating-linear-gradient(-45deg,#e8b500 0 12px,#1d211c 12px 24px)"></div>
<h1 style="margin-top:12px">Relatório de Inspeção de Segurança</h1><p>Setor: <b>${esc(setorLabel(i))}</b></p>
<table class="meta"><tr><td><b>Local:</b> ${esc(i.local || "—")}</td><td><b>Data:</b> ${fmtDate(i.data)}</td><td><b>Conformidade:</b> ${s.pct ?? "—"}% (${s.c} C · ${s.nc} NC · ${s.na} N/A)</td></tr>
<tr><td><b>TST:</b> ${esc(i.responsavel)}${i.registroTst ? " (" + esc(i.registroTst) + ")" : ""}</td><td><b>Horário:</b> ${esc(i.horaInicio || "—")} – ${esc(i.horaFim || "—")}${i.turno ? " · " + esc(i.turno) : ""}</td><td><b>Liderança:</b> ${esc(i.acompanhante || "—")}${i.cargoLider ? " (" + esc(i.cargoLider) + ")" : ""}</td></tr></table>
<table><thead><tr><th>Nº</th><th>Pergunta</th><th>Resultado</th><th>Descrição técnica</th><th>Plano de ação / Responsável / Prazo</th></tr></thead><tbody>${rows}</tbody></table>
${i.observacoes ? `<p><b>Observações gerais:</b> ${esc(i.observacoes)}</p>` : ""}
<div class="sig"><div>${esc(i.responsavel)}${i.registroTst ? "<br>" + esc(i.registroTst) : ""}<br>Técnico de Segurança do Trabalho</div><div>${i.assinaturaLider ? `<img src="${i.assinaturaLider}" alt="Assinatura" style="display:block;max-width:100%;height:70px;object-fit:contain;margin:-78px auto 4px">` : ""}${esc(i.acompanhante || "")}<br>${esc(i.cargoLider || "Liderança do setor")}</div></div></body></html>`;
  }
  async function offer(filename, data) {
    if (downloads) {
      try { await downloads.save({ filename, data }); toast("Arquivo salvo"); return; }
      catch (e) { if (e?.code === "declined") return; }
    }
    if (!window.claude) {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "text/html;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Arquivo baixado"); return;
    }
    const area = document.getElementById("copy-area");
    if (area) {
      area.innerHTML = `<div class="panel" style="margin-top:12px"><div class="panel-head"><h3>Copiar conteúdo</h3><button class="btn small" data-act="copiar">Copiar</button></div>
        <p class="lead" style="margin:0 0 8px">O download não está disponível nesta visualização. Copie o conteúdo abaixo e salve como <b>${esc(filename)}</b>.</p><textarea class="copybox" id="copy-text" readonly></textarea></div>`;
      document.getElementById("copy-text").value = data;
    }
  }
  const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 40);

  // ---------- Ações ----------
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-act], [data-setor], .seg button");
    if (!el) return;
    if (el.dataset.setor && !el.dataset.act) {
      readHeader();
      const old = state.draft; state.draft = newDraft(el.dataset.setor);
      if (old) Object.assign(state.draft, { local: old.local, responsavel: old.responsavel, registroTst: old.registroTst, data: old.data, horaInicio: old.horaInicio, horaFim: old.horaFim, turno: old.turno, acompanhante: old.acompanhante, cargoLider: old.cargoLider, assinaturaLider: old.assinaturaLider, observacoes: old.observacoes });
      render(); return;
    }
    if (el.matches(".seg button")) {
      readHeader();
      const it = state.draft.itens[+el.dataset.i]; it.status = it.status === el.dataset.v ? "" : el.dataset.v;
      const y = window.scrollY; render(); window.scrollTo(0, y);
      if (it.status === "NC") document.getElementById("nc-obs-" + el.dataset.i)?.focus({ preventScroll: true });
      return;
    }
    const act = el.dataset.act;
    const cur = () => state.inspecoes.find(x => x.id === state.selected);
    const cfg = state.cfgDraft;
    const keepY = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
    switch (act) {
      case "nova": go("nova"); break;
      case "pf-tst": state.pf.tst = el.dataset.tst === "—" ? "" : el.dataset.tst; window.scrollTo(0, 0); render(); break;
      case "abrir": go("detalhe", { selected: el.dataset.id }); break;
      case "voltar": go("historico"); break;
      case "descartar": state.draft = null; state.ai = {}; render(); break;
      case "ai-run": readHeader(); runAI(+el.dataset.i); break;
      case "sig-clear": { state.draft.assinaturaLider = ""; const pad = document.getElementById("sig-pad"); pad.getContext("2d").clearRect(0, 0, pad.width, pad.height); break; }
      case "sec-c": readHeader(); state.draft.itens.forEach(i => { if (i.secaoId === el.dataset.sec && !i.status) i.status = "C"; }); keepY(); break;
      case "finalizar": { const it = cur().itens[+el.dataset.idx]; state.closing = { idx: +el.dataset.idx, data: today(), por: it.respAcao || "", desc: "", foto: "" }; keepY(); document.getElementById("fin-desc")?.focus({ preventScroll: true }); break; }
      case "fin-cancelar": state.closing = null; keepY(); break;
      case "fin-salvar": {
        const c = state.closing, msg = document.getElementById("fin-msg");
        const bad = (t, id) => { msg.textContent = t; msg.style.color = "var(--bad)"; document.getElementById(id)?.focus(); };
        if (!c.data) return bad("Informe a data de conclusão.", "fin-data");
        if (!c.por.trim()) return bad("Informe quem executou.", "fin-por");
        if (!c.desc.trim()) return bad("Descreva o que foi feito.", "fin-desc");
        if (!c.foto) return bad("Anexe a foto da ação concluída.", "fin-foto");
        const i = structuredClone(cur()); const it = i.itens[c.idx];
        el.disabled = true;
        try {
        Object.assign(it, { corrigido: true, corrigidoEm: c.data, corrigidoPor: c.por.trim(), descricaoConclusao: c.desc.trim(), fotoConclusao: await persistFoto(c.foto) }); await saveInsp(i); state.closing = null; toast("Ação finalizada"); keepY(); }
        catch (err) { el.disabled = false; bad(err?.code === "invalid_argument" ? "Não foi possível salvar. Se anexou foto, tente uma imagem menor." : "Não foi possível salvar. Tente novamente."); }
        break;
      }
      case "reabrir": {
        const i = structuredClone(cur()); const it = i.itens[+el.dataset.idx];
        Object.assign(it, { corrigido: false, corrigidoEm: "", corrigidoPor: "", descricaoConclusao: "", fotoConclusao: "" });
        el.disabled = true;
        try { await saveInsp(i); toast("Ação reaberta"); } catch { el.disabled = false; toast("Não foi possível atualizar. Tente novamente."); }
        break;
      }
      case "excluir": state.confirmDelete = true; render(); break;
      case "excluir-nao": state.confirmDelete = false; render(); break;
      case "excluir-sim": try { await deleteInsp(state.selected); toast("Inspeção excluída"); go("historico"); } catch { toast("Não foi possível excluir. Tente novamente."); } break;
      case "duplicar": { const i = cur(); state.draft = newDraft(i.setorId); Object.assign(state.draft, { setorNome: i.setorNome, local: i.local, responsavel: i.responsavel, registroTst: i.registroTst || state.draft.registroTst, acompanhante: i.acompanhante, cargoLider: i.cargoLider || "" }); go("nova"); break; }
      case "relatorio": { const i = cur(); el.disabled = true; const html = await reportHTML(i); el.disabled = false; offer(`inspecao-${slug(setorLabel(i))}-${i.data}.html`, html); break; }
      case "csv-one": { const i = cur(); offer(`inspecao-${slug(setorLabel(i))}-${i.data}.csv`, toCSV([i])); break; }
      case "csv": offer(`inspecoes-${today()}.csv`, toCSV(filtered())); break;
      case "copiar": {
        const ta = document.getElementById("copy-text");
        try { await navigator.clipboard.writeText(ta.value); toast("Copiado"); } catch { ta.select(); toast("Texto selecionado. Use Ctrl+C para copiar."); }
        break;
      }
      // Configuração
      case "cfg-setor": state.cfgSetor = el.dataset.id; state.cfgConfirmDel = false; keepY(); break;
      case "cfg-secao": state.cfgSecao = el.dataset.id; keepY(); break;
      case "cfg-novo-setor": { const id = "s-" + uid(); cfg.setores.push({ id, nome: "Novo setor", generico: false, secoes: [] }); state.cfgSetor = id; cfgChanged(); document.getElementById("cfg-nome")?.select(); break; }
      case "cfg-nova-secao": { const id = "sec-" + uid(); cfg.secoes.push({ id, nome: "Nova seção", nr: "", perguntas: [] }); state.cfgSecao = id; cfgChanged(); document.getElementById("sec-nome")?.select(); break; }
      case "cfg-del": state.cfgConfirmDel = true; keepY(); break;
      case "cfg-del-nao": state.cfgConfirmDel = false; keepY(); break;
      case "cfg-del-sim": cfg.setores = cfg.setores.filter(s => s.id !== state.cfgSetor); state.cfgConfirmDel = false; state.cfgSetor = cfg.setores[0]?.id; cfgChanged(); break;
      case "q-del": cfg.secoes.find(s => s.id === state.cfgSecao).perguntas.splice(+el.dataset.i, 1); cfgChanged(); break;
      case "q-add": { const inp = document.getElementById("q-nova"); const t = inp.value.trim(); if (!t) { inp.focus(); break; }
        cfg.secoes.find(s => s.id === state.cfgSecao).perguntas.push({ texto: t, ref: "" }); cfgChanged(); document.getElementById("q-nova")?.focus(); break; }
      case "cfg-padrao": state.cfgDraft = { secoes: structuredClone(DEFAULT_SECOES), setores: structuredClone(DEFAULT_SETORES) }; cfgChanged(); toast("Padrão carregado. Clique em Salvar alterações para aplicar."); break;
      case "cfg-descartar": state.cfgDraft = null; state.cfgDirty = false; keepY(); break;
      case "cfg-salvar": {
        const usados = new Set(cfg.setores.flatMap(s => s.secoes));
        cfg.secoes.forEach(s => s.perguntas = s.perguntas.filter(p => p.texto.trim()));
        el.disabled = true;
        try { await saveConfig(structuredClone(cfg)); state.config = structuredClone(cfg); state.cfgDirty = false; state.cfgDraft = null; toast("Setores e perguntas salvos"); keepY(); }
        catch (err) { el.disabled = false; toast(err?.code === "invalid_argument" ? "Seu acesso não permite alterar os setores." : "Não foi possível salvar. Tente novamente."); }
        void usados; break;
      }
    }
  });
  document.addEventListener("change", async e => {
    if (e.target.dataset.ncFoto != null && state.draft) {
      const i = +e.target.dataset.ncFoto, f = e.target.files?.[0]; if (!f) return;
      readHeader();
      try { state.draft.itens[i].foto = await shrinkImage(f); state.draft.itens[i].analiseFoto = ""; rerenderKeep(); if (sample) runAI(i); }
      catch { toast("Não foi possível ler a imagem. Tente outra foto."); }
      return;
    }
    if (e.target.id !== "fin-foto" || !state.closing) return;
    const f = e.target.files?.[0]; if (!f) return;
    try { state.closing.foto = await shrinkImage(f); const y = window.scrollY; render(); window.scrollTo(0, y); }
    catch { toast("Não foi possível ler a imagem. Tente outra foto."); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
    if (e.key === "Enter" && e.target.id === "q-nova") { e.preventDefault(); document.querySelector('[data-act="q-add"]')?.click(); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (state.closing && t.id === "fin-data") { state.closing.data = t.value; return; }
    if (state.closing && t.id === "fin-por") { state.closing.por = t.value; return; }
    if (state.closing && t.id === "fin-desc") { state.closing.desc = t.value; return; }
    if (t.id === "pf-periodo" || t.id === "pf-setor" || t.id === "pf-tst") {
      state.pf = { periodo: document.getElementById("pf-periodo").value, setor: document.getElementById("pf-setor").value, tst: document.getElementById("pf-tst").value };
      const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    if (t.id === "h-q" || t.id === "h-setor") {
      state.filtro.q = document.getElementById("h-q").value; state.filtro.setor = document.getElementById("h-setor").value;
      document.getElementById("h-body").innerHTML = histRows(filtered()); return;
    }
    if (state.view !== "setores" || !state.cfgDraft) return;
    const st = state.cfgDraft.setores.find(s => s.id === state.cfgSetor);
    const sec = state.cfgDraft.secoes.find(s => s.id === state.cfgSecao);
    if (t.dataset.cfg === "nome") { st.nome = t.value; cfgChanged(false); }
    else if (t.dataset.cfg === "generico") { st.generico = t.checked; cfgChanged(false); }
    else if (t.dataset.cfg === "secao") {
      const ids = [...document.querySelectorAll('[data-cfg="secao"]:checked')].map(x => x.value);
      st.secoes = state.cfgDraft.secoes.map(s => s.id).filter(id => ids.includes(id)); cfgChanged();
    }
    else if (t.dataset.sec) { sec[t.dataset.sec] = t.value; cfgChanged(false); }
    else if (t.dataset.q) { sec.perguntas[+t.dataset.i][t.dataset.q] = t.value; cfgChanged(false); }
  });

  try { const h = location.hash.slice(1); if (["painel", "nova", "historico", "setores"].includes(h)) state.view = h; } catch {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  initStore();
})();
</script>

</body>
</html>
