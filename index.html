<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Inspeção de Segurança</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prancheta de campo. Barra superior com abas, conteúdo em coluna única de até 1040px; faixas de sinalização NR-26 (amarelo/preto) só no cabeçalho. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #e9ebe6;
  --fg: #1d211c;
  --muted: #5d645a;
  --line: #d3d7cf;
  --accent: #e8b500;      /* amarelo segurança */
  --accent-ink: #1d211c;
  --ok: #1f7a3d;
  --ok-bg: #e2f2e6;
  --bad: #c0281e;
  --bad-bg: #fbe5e2;
  --na: #6b7068;
  --na-bg: #ebece8;
  --warn: #9a6a00;
  --warn-bg: #fdf1cf;
  --focus: #1b5fd1;
  --s-reg: #2f6fb5; --s-done: #1f8a45; --s-open: #d49b00; --s-late: #c0281e;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151814; --surface: #1e221d; --surface-2: #272c26; --fg: #e9ece6; --muted: #a2a99e; --line: #353b33;
    --accent: #f2c21b; --accent-ink: #151814;
    --ok: #5cc27e; --ok-bg: #1b3323; --bad: #ff7a6e; --bad-bg: #3d1d1a; --na: #a2a99e; --na-bg: #2b302a;
    --warn: #f2c21b; --warn-bg: #3a3116; --focus: #7aa8ff; --s-reg: #4f8fdc; --s-done: #3fa865; --s-open: #e0b020; --s-late: #ff7a6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151814; --surface: #1e221d; --surface-2: #272c26; --fg: #e9ece6; --muted: #a2a99e; --line: #353b33;
  --accent: #f2c21b; --accent-ink: #151814;
  --ok: #5cc27e; --ok-bg: #1b3323; --bad: #ff7a6e; --bad-bg: #3d1d1a; --na: #a2a99e; --na-bg: #2b302a;
  --warn: #f2c21b; --warn-bg: #3a3116; --focus: #7aa8ff; --s-reg: #4f8fdc; --s-done: #3fa865; --s-open: #e0b020; --s-late: #ff7a6e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabeçalho */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fg); color: var(--bg); }
.hazard { height: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, var(--fg) 12px 24px); }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand small { display: block; font-family: var(--f-mono); font-size: 11px; opacity: .7; letter-spacing: .04em; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs button { font: 600 14px var(--f-body); background: transparent; color: var(--bg); border: 1px solid transparent; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
nav.tabs button:hover { border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

main { padding-block: 24px 64px; }
.store-note { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 30px; text-transform: uppercase; letter-spacing: .01em; margin: 0 0 4px; line-height: 1.05; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 65ch; }
.label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 20px; }

/* Painel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .num { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.alert .num { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.nc-list { display: flex; flex-direction: column; gap: 0; }
.nc-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.nc-row:first-child { border-top: 0; }
.nc-row .bar { align-self: stretch; background: var(--bad); border-radius: 2px; }
.nc-row.late .bar { background: var(--bad); }
.nc-row.ontime .bar { background: var(--accent); }
.nc-row .t { font-weight: 500; }
.nc-row .m { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.barrow { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 4px 10px; align-items: center; font-size: 13px; }
.barrow .track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.barrow .fill { height: 100%; border-radius: 4px; }
.barrow .pct { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Botões e campos */
.btn { font: 600 14px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.span2 { grid-column: span 2; }
.field.span3 { grid-column: 1 / -1; }
input, select, textarea { font: 400 15px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 60px; }

/* Seleção de checklist */
.cl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cl-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; color: var(--fg); font: inherit; display: flex; flex-direction: column; gap: 4px; }
.cl-card:hover { border-color: var(--muted); }
.cl-card[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: var(--surface-2); }
.cl-card .nr { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cl-card .nm { font-weight: 600; }

/* Itens do checklist */
.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.item .txt { padding-top: 5px; }
.item .ref { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 13px var(--f-body); border: 0; background: var(--surface); color: var(--muted); padding: 7px 11px; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"][data-v="C"] { background: var(--ok); color: #fff; }
.seg button[aria-pressed="true"][data-v="NC"] { background: var(--bad); color: #fff; }
.seg button[aria-pressed="true"][data-v="NA"] { background: var(--na); color: var(--surface); }
.item .extra { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; background: var(--bad-bg); border-radius: 6px; padding: 10px 12px; }
.item .extra .field.span3 { grid-column: 1 / -1; }
.item .obs { grid-column: 2 / -1; }
.progress { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--fg); }
.sticky-actions { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; z-index: 3; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-body); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.na { background: var(--na-bg); color: var(--na); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ex { background: var(--surface-2); color: var(--muted); font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }

/* Histórico */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters input { flex: 1 1 220px; width: auto; }
.filters select { width: auto; flex: 0 1 220px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Detalhe */
.detail-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 16px; margin-top: 12px; }
.meta div { display: flex; flex-direction: column; min-width: 0; }
.meta b { font-weight: 500; overflow-wrap: anywhere; }
.score { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.d-item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.d-item:first-child { border-top: 0; }
.d-item .note { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
.d-item .act { grid-column: 2 / -1; font-size: 13px; background: var(--bad-bg); border-radius: 6px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.d-item .act.done { background: var(--ok-bg); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bad-bg); color: var(--bad); padding: 8px 12px; border-radius: 6px; font-size: 14px; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h3 { color: var(--fg); margin-bottom: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.copybox { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: 12px; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .field.span2 { grid-column: auto; }
  .item { grid-template-columns: 26px minmax(0, 1fr); }
  .item .seg { grid-column: 2; justify-self: start; }
  .item .extra { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
}

/* Painel de ações */
.kpis7 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.kpis7 .num { font-size: 32px; }
.filters .field { flex: 1 1 200px; }
.filters .field select { width: 100%; flex: none; }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 600px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { font: 11px var(--f-mono); fill: var(--muted); }
.chart .val { font: 600 13px var(--f-mono); fill: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htrack { height: 12px; }
.hstack { display: flex; gap: 2px; height: 100%; min-width: 4px; }
.hstack i { display: block; height: 100%; border-radius: 3px; min-width: 3px; }
.hv { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tv { margin-top: 8px; font-size: 13px; }
.tv summary { cursor: pointer; color: var(--muted); }
.tv .table-wrap { margin-top: 8px; }
.grid2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 760px) { .grid2.even { grid-template-columns: minmax(0, 1fr); } .hrow { grid-template-columns: minmax(0, 1fr) auto; } .hrow .htrack { grid-column: 1 / -1; grid-row: 2; } }

/* Finalização da ação */
.fin { flex-basis: 100%; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border-radius: 6px; padding: 10px 12px; margin-top: 4px; }
.fin .m { font-size: 12px; color: var(--muted); }
.fin-form .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.evid { max-width: 260px; max-height: 200px; border-radius: 6px; object-fit: cover; }
@media (max-width: 760px) { .fin-form .fields { grid-template-columns: minmax(0, 1fr); } }

/* Foto e análise do Claude */
.foto-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.foto-empty { width: 120px; height: 84px; border: 1px dashed var(--bad); border-radius: 6px; display: grid; place-items: center; font-size: 12px; color: var(--bad); background: var(--surface); }
.ai-note { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 6px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ai-note.busy { color: var(--fg); }
.ai-note.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--fg); animation: spin 1s linear infinite; }
.ai-note.err { color: var(--bad); }
.ai-text { font-size: 14px; background: var(--surface); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
.nc-info { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.nc-info .m { color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ai-note.busy::before { animation: none; } }
.d-item .act { white-space: pre-wrap; }

.extra > .span3 { grid-column: 1 / -1; }
.acoes { display: grid; gap: 8px; }
.acao-row { display: grid; grid-template-columns: 64px minmax(0, 2fr) minmax(0, 1fr) 150px auto; gap: 8px; align-items: start; }
.acao-n { font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding-top: 10px; }
.acoes-d { display: grid; gap: 8px; }
@media (max-width: 760px) { .acao-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .acao-row textarea, .acao-n { grid-column: 1 / -1; } .acao-n { padding-top: 0; } }
.perguntas { background: var(--warn-bg); border-radius: 6px; padding: 10px 12px; gap: 8px; }
.perguntas .field > span { font-size: 14px; }

/* Assinatura */
.sig-pad { display: block; width: 100%; max-width: 100%; aspect-ratio: 900 / 240; background: #fff; border: 1px dashed var(--muted); border-radius: 6px; touch-action: none; cursor: crosshair; }
.sig-img { display: block; max-width: 100%; height: 110px; object-fit: contain; background: #fff; border-radius: 6px; }
.sig-line { border-top: 1px solid var(--fg); margin-top: 6px; padding-top: 4px; font-size: 13px; color: var(--muted); max-width: 420px; }

/* Setores e perguntas */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font: 500 14px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.pill:hover { border-color: var(--muted); }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill .c { font-family: var(--f-mono); font-size: 12px; opacity: .7; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.check-card { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px; align-items: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
.check-card input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--bad); }
.check-card .nm { font-weight: 600; }
.check-card .sub { grid-column: 2; font-size: 12px; color: var(--muted); }
.inline-check { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.inline-check input { width: 18px; height: 18px; flex: none; margin-top: 2px; accent-color: var(--bad); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 18px 0 8px; border-bottom: 2px solid var(--fg); }
.sec-head:first-child { padding-top: 0; }
.q-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.q-row:first-child { border-top: 0; }
.q-row .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.save-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 3; }
@media (max-width: 760px) { .q-row { grid-template-columns: 24px minmax(0, 1fr); } .q-row .ref-in, .q-row .btn { grid-column: 2; justify-self: start; } }

    const C_REG = "var(--s-reg)", C_DONE = "var(--s-done)", C_OPEN = "var(--s-open)", C_LATE = "var(--s-late)";
    const pend = abertas.sort((a, b) => (a.prazo || "9999").localeCompare(b.prazo || "9999"));

    return lead + `<div class="stack">${filtros}${kpis}
      <section class="panel"><div class="panel-head"><h3>Registradas × concluídas por mês</h3></div>
        <p class="lead" style="margin:-6px 0 8px">Não conformidades pelo mês da inspeção; ações pelo mês em que foram marcadas como concluídas.</p>
        ${legend([[C_REG, "Não conformidades registradas"], [C_DONE, "Ações concluídas"]])}
        ${svgBars(months, [{ name: "Não conformidades registradas", color: C_REG, values: reg }, { name: "Ações concluídas", color: C_DONE, values: don }])}
        ${tableView(["Mês", "Registradas", "Concluídas"], months.map((k, i) => [mLabel(k), reg[i], don[i]]))}
      </section>
      <section class="panel"><div class="panel-head"><h3>Ações em aberto ao fim de cada mês</h3></div>
        <p class="lead" style="margin:-6px 0 8px">Se a linha desce, a equipe está fechando ações mais rápido do que surgem novas não conformidades.</p>
        ${svgLine(months, open, "Ações em aberto")}
        ${tableView(["Mês", "Em aberto no fim do mês"], months.map((k, i) => [mLabel(k), open[i]]))}
      </section>
      <div class="grid2 even">
        <section class="panel"><div class="panel-head"><h3>Situação das ações por setor</h3></div>
          <p class="lead" style="margin:-6px 0 8px">Situação atual de todas as não conformidades registradas.</p>
          ${legend([[C_DONE, "Concluídas"], [C_OPEN, "Abertas no prazo"], [C_LATE, "Atrasadas"]])}
          ${porSetor.length ? `<div class="hbars">${porSetor.map(r => { const tot = r.c + r.p + r.l; return `<div class="hrow"><span class="hl" title="${esc(r.nome)}">${esc(r.nome)}</span>
            <div class="htrack"><div class="hstack" style="width:${tot / maxS * 100}%">${[[r.c, C_DONE, "concluídas"], [r.p, C_OPEN, "abertas no prazo"], [r.l, C_LATE, "atrasadas"]].filter(x => x[0]).map(([v, c, n]) => `<i style="flex:${v};background:${c}" title="${esc(r.nome)}: ${v} ${n}"></i>`).join("")}</div></div>
            <span class="hv">${r.c}/${tot} concluídas</span></div>`; }).join("")}</div>` : `<p class="lead" style="margin:0">Nenhuma não conformidade registrada.</p>`}
          ${porSetor.length ? tableView(["Setor", "Concluídas", "Abertas no prazo", "Atrasadas"], porSetor.map(r => [esc(r.nome), r.c, r.p, r.l])) : ""}
        </section>
        <section class="panel"><div class="panel-head"><h3>Não conformidades por norma</h3></div>
          <p class="lead" style="margin:-6px 0 8px">Onde as falhas se concentram, com quantas já tiveram a ação concluída.</p>
          ${porNorma.length ? `<div class="hbars">${porNorma.map(r => `<div class="hrow"><span class="hl" title="${esc(r.nome)}">${esc(r.nome)}</span>
            <div class="htrack"><div class="hstack" style="width:${r.n / maxN * 100}%"><i style="flex:1;background:${C_REG}" title="${esc(r.nome)}: ${r.n} não conformidades"></i></div></div>
            <span class="hv">${r.n} · ${r.c} concluídas</span></div>`).join("")}</div>` : `<p class="lead" style="margin:0">Nenhuma não conformidade registrada.</p>`}
        </section>
      </div>
      <div class="grid2 even">
        <section class="panel"><div class="panel-head"><h3>Ações corretivas pendentes</h3><span class="label">por prazo</span></div>
          ${pend.length ? `<div class="nc-list">${pend.slice(0, 10).map(p => `<div class="nc-row"><div class="bar" style="background:${p.late ? C_LATE : C_OPEN}"></div>
              <div style="min-width:0"><div class="t">Ação ${p.k + 1}: ${esc(p.a.texto || p.it.texto)}</div>
                <div class="m">${esc(p.setor)}${p.it.localNC ? " · " + esc(p.it.localNC) : p.it.secao ? " · " + esc(p.it.secao) : ""} · Resp.: ${esc(p.resp)} · ${p.prazo ? (p.late ? `<span class="chip bad">vencido ${fmtDate(p.prazo)}</span>` : "prazo " + fmtDate(p.prazo)) : "sem prazo"}</div></div>
              <button class="btn small" data-act="abrir" data-id="${p.insp.id}">Ver</button></div>`).join("")}</div>${pend.length > 10 ? `<p class="label" style="margin:8px 0 0">+ ${pend.length - 10} pendências</p>` : ""}`
          : `<p class="lead" style="margin:0">Nenhuma ação em aberto.</p>`}
        </section>
        <section class="panel"><div class="panel-head"><h3>Inspeções por TST</h3></div>
          <div class="table-wrap" style="border:0"><table><thead><tr><th>TST</th><th>Inspeções</th><th>No mês${meta ? ` / meta ${meta}` : ""}</th><th>Última</th><th>Conf.</th><th>NC</th></tr></thead><tbody>
          ${porTst.map(r => `<tr data-act="pf-tst" data-tst="${esc(r.nome)}" tabindex="0"><td>${esc(r.nome)}${r.reg ? `<div class="label">${esc(r.reg)}</div>` : ""}</td><td class="num">${r.n}</td><td class="num">${meta ? `<span class="chip ${(r.mes || 0) >= meta ? "ok" : "warn"}">${r.mes || 0}/${meta}</span>` : (r.mes || 0)}</td><td class="num">${r.ult ? fmtDate(r.ult) : "—"}</td><td>${pctChip(r.ps.length ? Math.round(r.ps.reduce((a, b) => a + b, 0) / r.ps.length) : null)}</td><td class="num">${r.nc}</td></tr>`).join("")}
          </tbody></table></div>
        </section>
      </div>
      ${porResp.length ? `<section class="panel"><div class="panel-head"><h3>Ações por responsável</h3><span class="label">quem executa cada ação</span></div>
        <div class="table-wrap" style="border:0"><table><thead><tr><th>Responsável</th><th>Ações</th><th>Concluídas</th><th>Em aberto</th><th>Atrasadas</th></tr></thead><tbody>
        ${porResp.map(r => `<tr><td>${esc(r.nome)}</td><td class="num">${r.n}</td><td class="num">${r.c}</td><td class="num">${r.ab}</td><td class="num">${r.l ? `<span class="chip bad">${r.l}</span>` : "0"}</td></tr>`).join("")}
        </tbody></table></div></section>` : ""}
      ${porLocal.length ? `<section class="panel"><div class="panel-head"><h3>Não conformidades por local / equipamento</h3><span class="label">pontos que mais se repetem</span></div>
        <div class="table-wrap" style="border:0"><table><thead><tr><th>Setor</th><th>Local / equipamento</th><th>NC</th><th>Em aberto</th><th>Inspeções</th></tr></thead><tbody>
        ${porLocal.slice(0, 15).map(r => `<tr><td>${esc(r.setor)}</td><td>${esc(r.local)}</td><td class="num">${r.n}</td><td class="num">${r.ab ? `<span class="chip bad">${r.ab}</span>` : "0"}</td><td class="num">${r.insp.size}</td></tr>`).join("")}
        </tbody></table></div></section>` : ""}
      ${reinc.length ? `<section class="panel"><div class="panel-head"><h3>Não conformidades reincidentes</h3><span class="label">mesmo setor, mesma pergunta</span></div>
        <div class="table-wrap" style="border:0"><table><thead><tr><th>Setor</th><th>Pergunta</th><th>Inspeções com NC</th></tr></thead><tbody>
        ${reinc.slice(0, 15).map(r => `<tr><td>${esc(r.setor)}</td><td>${esc(r.texto)}</td><td class="num">${r.insp.size}</td></tr>`).join("")}
        </tbody></table></div></section>` : ""}
    </div>`;
  }

  // ---------- Locais das NCs (sugestões por setor) ----------
  function locaisSetor(d) {
    const set = new Map(), add = v => { const t = (v || "").trim(); if (t && !set.has(t.toLowerCase())) set.set(t.toLowerCase(), t); };
    for (const i of state.inspecoes) if (i.setorId === d.setorId) i.itens.forEach(it => add(it.localNC));
    (d.itens || []).forEach(it => add(it.localNC));
    return [...set.values()].sort((a, b) => a.localeCompare(b, "pt-BR"));
  }

  const novaAcao = () => ({ texto: "", resp: "", prazo: "", corrigido: false, corrigidoEm: "", corrigidoPor: "", descricaoConclusao: "", fotoConclusao: "" });
  // ações de uma NC (inspeções antigas têm uma única ação nos campos acao/respAcao/prazo)
  function acoesDe(it) {
    if (Array.isArray(it.acoes) && it.acoes.length) return it.acoes;
    if (!(it.acao || it.respAcao || it.prazo || it.corrigido)) return [];
    return [{ texto: it.acao || "", resp: it.respAcao || "", prazo: it.prazo || "", corrigido: !!it.corrigido, corrigidoEm: it.corrigidoEm || "", corrigidoPor: it.corrigidoPor || "", descricaoConclusao: it.descricaoConclusao || "", fotoConclusao: it.fotoConclusao || "" }];
  }
  // campos resumo da NC calculados a partir das ações
  function syncNC(it) {
    const A = it.acoes = structuredClone(acoesDe(it)).map(a => ({ ...novaAcao(), ...a }));
    const uniq = xs => [...new Set(xs.map(x => (x || "").trim()).filter(Boolean))];
    it.acao = A.map((a, k) => `${k + 1}. ${a.texto.trim()}`).join("\n");
    it.respAcao = uniq(A.map(a => a.resp)).join(", ");
    it.prazo = A.map(a => a.prazo).filter(Boolean).sort().pop() || "";
    it.corrigido = A.length > 0 && A.every(a => a.corrigido);
    it.corrigidoEm = it.corrigido ? A.map(a => a.corrigidoEm).sort().pop() : "";
    it.corrigidoPor = it.corrigido ? uniq(A.map(a => a.corrigidoPor)).join(", ") : "";
    it.descricaoConclusao = it.corrigido ? A.map((a, k) => `${k + 1}. ${a.descricaoConclusao}`).join("\n") : "";
    it.fotoConclusao = it.corrigido ? (A.map(a => a.fotoConclusao).filter(Boolean).pop() || "") : "";
    return it;
  }
  const respsUsados = () => [...new Set(state.inspecoes.flatMap(i => i.itens.flatMap(it => acoesDe(it).map(a => (a.resp || "").trim()))).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const locaisNC = i => [...new Set(i.itens.filter(it => it.status === "NC" && it.localNC?.trim()).map(it => it.localNC.trim()))].join("; ") || i.local || "";

  // ---------- TSTs ----------
  async function registrarTst(nome, registro) {
    nome = (nome || "").trim(); registro = (registro || "").trim(); if (!nome) return;
    const eq = structuredClone(state.equipe); eq.tsts ||= [];
    const ex = eq.tsts.find(t => (t.nome || "").trim().toLowerCase() === nome.toLowerCase());
    if (ex && (ex.registro || !registro)) return;
    if (ex) ex.registro = registro; else eq.tsts.push({ nome, registro });
    eq.tsts.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    try { await saveEquipe(eq); if (state.cfgDraft && !state.cfgDirty) state.cfgDraft = null; } catch {}
  }
  function tstList() {
    const m = new Map();
    for (const t of state.equipe.tsts || []) { const n = (t.nome || "").trim(); if (n) m.set(n.toLowerCase(), { nome: n, registro: (t.registro || "").trim() }); }
    for (const i of [...state.inspecoes].reverse()) { const n = (i.responsavel || "").trim(); if (!n) continue; const k = n.toLowerCase();
      if (!m.has(k)) m.set(k, { nome: n, registro: (i.registroTst || "").trim() }); else if (!m.get(k).registro && i.registroTst) m.get(k).registro = i.registroTst.trim(); }
    return [...m.values()].sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  }

  // ---------- Nova inspeção ----------
  function newDraft(setorId) {
    const cfg = state.config, st = cfg.setores.find(s => s.id === setorId);
    const itens = [];
    for (const sid of st.secoes) { const sec = secById(cfg, sid); if (!sec) continue;
      for (const p of sec.perguntas) itens.push({ secaoId: sec.id, secao: sec.nome, nr: /^NR-\d/.test(p.ref || "") ? p.ref : sec.nr, texto: p.texto, ref: /^NR-\d/.test(p.ref || "") ? "" : p.ref, status: "", obs: "", nota: "", foto: "", analiseFoto: "", enquadramento: "", risco: "", acao: "", prazo: "", respAcao: "" }); }
    const tst = lsGet(LS_TST, {});
    return { setorId, setorNome: st.generico ? "" : st.nome, generico: st.generico, local: "", responsavel: tst.nome || "", registroTst: tst.registro || "", data: today(), horaInicio: nowHM(), horaFim: "", turno: "", acompanhante: "", cargoLider: "", assinaturaLider: "", observacoes: "", itens };
  }

  function viewNova() {
    if (!state.canWrite) return `<h2>Nova inspeção</h2><div class="panel empty"><h3>Somente leitura</h3><p>Seu acesso a esta página permite consultar as inspeções, mas não registrar novas.</p></div>`;
    const d = state.draft, cfg = state.config;
    const chips = `<div class="chips">${cfg.setores.map(s => `<button type="button" class="pill" data-setor="${esc(s.id)}" aria-pressed="${d?.setorId === s.id}">${esc(s.nome)} <span class="c">(${countQ(cfg, s)})</span></button>`).join("")}</div>`;
    if (!d) return `<h2>Nova inspeção</h2><p class="lead">Escolha o setor. Cada setor traz só as seções de perguntas que se aplicam a ele.</p>${chips}`;
    const s = score(d), answered = d.itens.filter(i => i.status).length;
    let lastSec = null, n = 0, secN = 0, mixNr = false;
    const rows = d.itens.map((it, i) => {
      let head = "";
      if (it.secaoId !== lastSec) { lastSec = it.secaoId; secN++; n = 0;
        const total = d.itens.filter(x => x.secaoId === it.secaoId).length;
        const nrs = [...new Set(d.itens.filter(x => x.secaoId === it.secaoId).map(x => x.nr).filter(Boolean))];
        mixNr = nrs.length > 1;
        head = `<div class="sec-head"><h3>${esc(it.secao)}</h3><span class="label">${esc(nrs.join(" / "))}${nrs.length ? " · " : ""}${total} perguntas <button type="button" class="btn small" data-act="sec-c" data-sec="${esc(it.secaoId)}" style="margin-left:8px">Pendentes = C</button></span></div>`; }
      n++;
      return head + itemRow(it, i, `${secN}.${n}`, mixNr);
    }).join("");
    return `<h2>Nova inspeção</h2><p class="lead">${esc(d.generico ? "Outro setor" : d.setorNome)} · ${d.itens.length} perguntas</p>
    <form id="f-insp" class="stack" novalidate>
      <details class="panel"><summary class="label" style="cursor:pointer">Trocar setor</summary><div style="margin-top:12px">${chips}</div></details>
      <section class="panel">
        <div class="panel-head"><h3>Dados do TST</h3><span class="label">quem realizou a inspeção</span></div>
        <div class="fields">
          ${(() => { const L = tstList(), cur = (d.responsavel || "").trim().toLowerCase(), known = L.some(t => t.nome.toLowerCase() === cur), outro = !L.length || (cur && !known) || d.tstOutro;
            return `<label class="field span2"><span class="label">Nome do TST *</span>${L.length ? `<select id="f-tst-sel"><option value="">Selecione o TST</option>${L.map(t => `<option value="${esc(t.nome)}" data-reg="${esc(t.registro)}" ${!outro && t.nome.toLowerCase() === cur ? "selected" : ""}>${esc(t.nome)}</option>`).join("")}<option value="__outro" ${outro ? "selected" : ""}>Outro nome…</option></select>` : ""}
              <input id="f-resp" required value="${esc(d.responsavel)}" placeholder="Nome completo do técnico" ${outro ? "" : "hidden"}></label>`; })()}
          <label class="field"><span class="label">Registro profissional</span><input id="f-reg" value="${esc(d.registroTst)}" placeholder="Ex.: MTE/SRTE nº 12345"></label>
          <label class="field"><span class="label">Data da inspeção *</span><input id="f-data" type="date" required value="${esc(d.data)}"></label>
          <label class="field"><span class="label">Hora de início</span><input id="f-hini" type="time" value="${esc(d.horaInicio)}"><span class="label" style="text-transform:none;letter-spacing:0">Registrada ao abrir a inspeção</span></label>
          <label class="field"><span class="label">Hora de término</span><input id="f-hfim" type="time" value="${esc(d.horaFim)}" placeholder="ao salvar"><span class="label" style="text-transform:none;letter-spacing:0">${d.horaFim ? "" : "Preenchida ao salvar"}</span></label>
          <label class="field"><span class="label">Turno</span><select id="f-turno"><option value="">—</option>${["1º turno", "2º turno", "3º turno", "Administrativo"].map(o => `<option ${d.turno === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>
        </div>
      </section>
      ${d.generico ? `<section class="panel">
        <div class="panel-head"><h3>Setor inspecionado</h3></div>
        <div class="fields">
          <label class="field span2"><span class="label">Nome do setor *</span><input id="f-setor-nome" required value="${esc(d.setorNome)}" placeholder="Ex.: Manutenção"></label>
        </div>
      </section>` : ""}
      <datalist id="resp-dl">${respsUsados().map(l => `<option value="${esc(l)}">`).join("")}</datalist>
      <datalist id="locs-dl">${locaisSetor(d).map(l => `<option value="${esc(l)}">`).join("")}</datalist>
      <section class="panel">
        <div class="panel-head"><h3>Liderança que acompanhou</h3></div>
        <div class="fields">
          <label class="field span2"><span class="label">Nome da liderança *</span><input id="f-acomp" required value="${esc(d.acompanhante)}" placeholder="Nome de quem acompanhou a inspeção"></label>
          <label class="field"><span class="label">Cargo / função</span><input id="f-cargo" value="${esc(d.cargoLider)}" placeholder="Ex.: Supervisor, Líder de turno"></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Perguntas</h3>
          <div class="progress"><span><b>${answered}</b>/${d.itens.length} respondidas</span><span class="chip ok">${s.c} C</span><span class="chip bad">${s.nc} NC</span><span class="chip na">${s.na} N/A</span></div></div>
        <div class="items">${rows}</div>
      </section>
      <section class="panel">
        <label class="field"><span class="label">Observações gerais</span><textarea id="f-obs" placeholder="Condições encontradas, orientações dadas no local…">${esc(d.observacoes)}</textarea></label>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Assinatura da liderança *</h3><button type="button" class="btn small" data-act="sig-clear">Limpar assinatura</button></div>
        <p class="lead" style="margin:-4px 0 10px">${d.acompanhante ? esc(d.acompanhante) : "A liderança"} assina com o dedo ou o mouse no quadro abaixo, ao final da inspeção.</p>
        <canvas id="sig-pad" class="sig-pad" width="900" height="240" aria-label="Quadro de assinatura da liderança"></canvas>
        <div class="sig-line"><span>${esc(d.acompanhante || "Nome da liderança")}${d.cargoLider ? " · " + esc(d.cargoLider) : ""}</span></div>
      </section>
      <div class="sticky-actions">
        <span class="label" id="f-msg">Todas as perguntas precisam de resposta.</span>
        <div class="row-actions"><button type="button" class="btn" data-act="descartar">Descartar</button><button type="submit" class="btn primary">Salvar inspeção</button></div>
      </div>
    </form>`;
  }

  function itemRow(it, i, num, mixNr = false) {
    const seg = ["C", "NC", "NA"].map(v => `<button type="button" data-v="${v}" data-i="${i}" aria-pressed="${it.status === v}" aria-label="${{ C: "Conforme", NC: "Não conforme", NA: "Não aplicável" }[v]}">${v === "NA" ? "N/A" : v}</button>`).join("");
    const ai = state.ai[i];
    const aiBox = !sample ? `<div class="ai-note">A análise automática pelo Claude funciona quando o sistema é aberto dentro do Claude. Aqui, preencha os campos manualmente.</div>`
      : ai?.status === "loading" ? `<div class="ai-note busy">Claude está analisando a foto e montando o plano de ação…</div>`
      : ai?.status === "erro" ? `<div class="ai-note err">${esc(ai.msg)} <button type="button" class="btn small" data-act="ai-run" data-i="${i}">Tentar de novo</button></div>`
      : it.foto ? `<div class="ai-note">${it.analiseFoto ? "Texto gerado pelo Claude. Revise antes de salvar." : "Anexe a foto e, se quiser, escreva o que viu. O Claude completa o resto."} <button type="button" class="btn small" data-act="ai-run" data-i="${i}">${it.analiseFoto ? "Gerar de novo" : "Analisar com Claude"}</button></div>` : "";
    const extra = it.status === "NC" ? `<div class="extra">
        <label class="field span3"><span class="label">Local da não conformidade *</span><input id="nc-local-${i}" data-k="localNC" data-i="${i}" list="locs-dl" autocomplete="off" value="${esc(it.localNC || "")}" placeholder="Máquina ou equipamento e ponto de referência. Ex.: Moldadora 2, lado do operador, próximo ao painel P-14"></label>
        <div class="field span3 foto-field"><span class="label">Foto da não conformidade *</span>
          <div class="foto-row">${it.foto ? imgTag(it.foto, "evid", "Foto da não conformidade") : `<div class="foto-empty">Sem foto</div>`}
            <label class="btn small"><input type="file" accept="image/*" capture="environment" data-nc-foto="${i}" hidden>${it.foto ? "Trocar foto" : "Tirar ou anexar foto"}</label></div></div>
        <label class="field span3"><span class="label">O que o TST observou (rascunho)</span><input id="nc-nota-${i}" data-k="nota" data-i="${i}" value="${esc(it.nota)}" placeholder="Ex.: proteção da correia aberta"></label>
        <div class="span3">${aiBox}</div>
        ${it.analiseFoto ? `<div class="field span3"><span class="label">Análise da foto pelo Claude${it.risco ? ` · <span class="chip ${it.risco === "Alto" ? "bad" : it.risco === "Médio" ? "warn" : "ok"}">Risco ${esc(it.risco)}</span>` : ""}</span><div class="ai-text">${esc(it.analiseFoto)}</div></div>` : ""}

  // Garante o texto na voz do TST: remove frases que citam a foto/imagem.
  function semFoto(t) {
    const frases = t.split(/(?<=[.;!?])\s+/);
    const ok = frases.filter(f => !/\b(foto|fotografia|fotográfic\w*|imagem|imagens|registro fotográfico)\b/i.test(f));
    return (ok.length ? ok : frases).join(" ").replace(/^(Conforme|Como) (se )?(observa|vê|mostra)\w*[^,]*,\s*/i, "").trim();
  }

  function bindNova() {
    const f = document.getElementById("f-insp"); if (!f) return;
    const pad = document.getElementById("sig-pad");
    if (pad) {
      const ctx = pad.getContext("2d");
      ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1d211c";
      if (state.draft.assinaturaLider) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = state.draft.assinaturaLider; }
      let drawing = false, last = null;
      const pt = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
      pad.addEventListener("pointerdown", e => { drawing = true; last = pt(e); pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.4, 0, Math.PI * 2); ctx.fillStyle = "#1d211c"; ctx.fill(); });
      pad.addEventListener("pointermove", e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
      const end = () => { if (!drawing) return; drawing = false; state.draft.assinaturaLider = pad.toDataURL("image/png"); };
      pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end);
    }
    f.addEventListener("input", e => {
      if (e.target.dataset.ac) { const [i, k, c] = e.target.dataset.ac.split(":"); state.draft.itens[+i].acoes[+k][c] = e.target.value; return; }
      if (e.target.dataset.pq) { const [i, k] = e.target.dataset.pq.split(":").map(Number); state.draft.itens[i].perguntasIA[k].r = e.target.value; return; }
      const k = e.target.dataset.k, i = e.target.dataset.i;
      if (k != null && i != null) state.draft.itens[+i][k] = e.target.value;
    });
    f.addEventListener("submit", async e => {
      e.preventDefault(); readHeader();
      const d = state.draft, msg = document.getElementById("f-msg");
      const fail = (t, id) => { msg.textContent = t; msg.style.color = "var(--bad)"; if (id) document.getElementById(id)?.focus(); };
      if (d.generico && !d.setorNome.trim()) return fail("Digite o nome do setor.", "f-setor-nome");
      if (!d.data) return fail("Preencha a data.", "f-data");
      if (!d.responsavel.trim()) return fail("Selecione ou digite o nome do TST.", document.getElementById("f-resp").hidden ? "f-tst-sel" : "f-resp");
      if (!d.acompanhante.trim()) return fail("Preencha o nome da liderança que acompanhou.", "f-acomp");
      const faltando = d.itens.findIndex(i => !i.status);
      if (faltando >= 0) { fail(`Responda a pergunta "${d.itens[faltando].texto.slice(0, 50)}…"`); document.getElementById("item-" + faltando).scrollIntoView({ block: "center" }); return; }
      const semResp = d.itens.findIndex(i => i.status === "NC" && (i.perguntasIA || []).some(x => !x.r?.trim()));
      if (semResp >= 0) { fail("Responda as perguntas do Claude e clique em Responder e atualizar plano."); document.getElementById("item-" + semResp).scrollIntoView({ block: "center" }); return; }
      const acFalta = x => (x.acoes || []).findIndex(a => !a.texto.trim() || !a.resp.trim() || !a.prazo);
      const ncFalta = d.itens.findIndex(i => i.status === "NC" && (!i.localNC?.trim() || !i.foto || !i.obs?.trim() || !(i.acoes || []).length || acFalta(i) >= 0));
      if (ncFalta >= 0) { const x = d.itens[ncFalta], k = acFalta(x), a = x.acoes?.[k];
        fail(`Não conformidade "${x.texto.slice(0, 40)}…": falta ${!x.localNC?.trim() ? "o local da não conformidade" : !x.foto ? "a foto" : !x.obs?.trim() ? "a descrição técnica" : !(x.acoes || []).length ? "o plano de ação" : !a.texto.trim() ? `o texto da ação ${k + 1}` : !a.resp.trim() ? `o responsável pela ação ${k + 1}` : `o prazo da ação ${k + 1}`}.`); document.getElementById("item-" + ncFalta).scrollIntoView({ block: "center" }); return; }
      if (Object.values(state.ai).some(a => a?.status === "loading")) return fail("Aguarde o Claude terminar a análise das fotos.");
      if (!d.assinaturaLider) { fail("Colha a assinatura da liderança no quadro de assinatura."); document.getElementById("sig-pad").scrollIntoView({ block: "center" }); return; }
      if (!d.horaFim) d.horaFim = nowHM();
      if (!d.horaInicio) d.horaInicio = d.horaFim;
      const insp = { id: uid(), ...structuredClone(d), setorNome: d.setorNome.trim(), criadoEm: Date.now(), itens: d.itens.map(i => { const x = { ...i, corrigido: false, corrigidoEm: "" }; if (x.status === "NC") syncNC(x); else delete x.acoes; return x; }) };
      delete insp.generico; delete insp.tstOutro;
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Salvando…";
      lsSet(LS_TST, { nome: insp.responsavel.trim(), registro: (insp.registroTst || "").trim() });
      registrarTst(insp.responsavel, insp.registroTst);
      try {
        btn.textContent = "Enviando fotos…";
        for (const it of insp.itens) if (it.foto) it.foto = await persistFoto(it.foto);
        insp.assinaturaLider = await persistFoto(insp.assinaturaLider);
        btn.textContent = "Salvando…";
        insp.codigo = codigoInsp(insp);
        await saveInsp(insp); state.draft = null; state.ai = {}; toast("Inspeção salva. Gerando o relatório em Excel…"); go("detalhe", { selected: insp.id });
        exportXlsx(insp, document.querySelector('[data-act="relatorio"]')); }
      catch (err) {
        btn.disabled = false; btn.textContent = "Salvar inspeção";
        fail(err?.code === "invalid_argument" ? "Seu acesso não permite salvar inspeções nesta página." : err?.code === "quota_exceeded" ? "O banco atingiu o limite de registros. Exclua inspeções antigas para continuar." : "Não foi possível salvar agora. Tente novamente em instantes.");
      }
    });
  }

    return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Inspeção – ${esc(setorLabel(i))} – ${fmtDate(i.data)}</title>
<style>body{font-family:Arial,sans-serif;color:#1d211c;max-width:900px;margin:24px auto;padding:0 16px;font-size:13px}h1{font-size:20px;margin:0}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #bbb;padding:6px;text-align:left;vertical-align:top}th{background:#eee}.C{color:#1f7a3d}.NC{color:#c0281e;font-weight:bold}.meta td{border:0;padding:2px 12px 2px 0}.sig{display:flex;gap:48px;margin-top:96px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}</style></head><body>
<div style="height:6px;background:repeating-linear-gradient(-45deg,#e8b500 0 12px,#1d211c 12px 24px)"></div>
<h1 style="margin-top:12px">Relatório de Inspeção de Segurança</h1><p>Setor: <b>${esc(setorLabel(i))}</b></p>
<table class="meta"><tr><td><b>Local:</b> ${esc(i.local || "—")}</td><td><b>Data:</b> ${fmtDate(i.data)}</td><td><b>Conformidade:</b> ${s.pct ?? "—"}% (${s.c} C · ${s.nc} NC · ${s.na} N/A)</td></tr>
<tr><td><b>TST:</b> ${esc(i.responsavel)}${i.registroTst ? " (" + esc(i.registroTst) + ")" : ""}</td><td><b>Horário:</b> ${esc(i.horaInicio || "—")} – ${esc(i.horaFim || "—")}${i.turno ? " · " + esc(i.turno) : ""}</td><td><b>Liderança:</b> ${esc(i.acompanhante || "—")}${i.cargoLider ? " (" + esc(i.cargoLider) + ")" : ""}</td></tr></table>
<table><thead><tr><th>Nº</th><th>Pergunta</th><th>Resultado</th><th>Descrição técnica</th><th>Plano de ação / Responsável / Prazo</th></tr></thead><tbody>${rows}</tbody></table>
${i.observacoes ? `<p><b>Observações gerais:</b> ${esc(i.observacoes)}</p>` : ""}
<div class="sig"><div>${esc(i.responsavel)}${i.registroTst ? "<br>" + esc(i.registroTst) : ""}<br>Técnico de Segurança do Trabalho</div><div>${i.assinaturaLider ? `<img src="${i.assinaturaLider}" alt="Assinatura" style="display:block;max-width:100%;height:70px;object-fit:contain;margin:-78px auto 4px">` : ""}${esc(i.acompanhante || "")}<br>${esc(i.cargoLider || "Liderança do setor")}</div></div></body></html>`;
  }
  async function offer(filename, data) {
    if (downloads) {
      try { await downloads.save({ filename, data }); toast("Arquivo salvo"); return; }
      catch (e) { if (e?.code === "declined") return; }
    }
    if (!window.claude) {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : filename.endsWith(".xlsx") ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "text/html;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Arquivo baixado"); return;
    }
    if (data instanceof Blob) { toast("O download não está disponível nesta visualização. Abra o sistema no navegador para baixar."); return; }
    const area = document.getElementById("copy-area");
    if (area) {
      area.innerHTML = `<div class="panel" style="margin-top:12px"><div class="panel-head"><h3>Copiar conteúdo</h3><button class="btn small" data-act="copiar">Copiar</button></div>
        <p class="lead" style="margin:0 0 8px">O download não está disponível nesta visualização. Copie o conteúdo abaixo e salve como <b>${esc(filename)}</b>.</p><textarea class="copybox" id="copy-text" readonly></textarea></div>`;
      document.getElementById("copy-text").value = data;
    }
  }
  const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 40);

  // ---------- Ações ----------
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-act], [data-setor], .seg button");
    if (!el) return;
    if (el.dataset.setor && !el.dataset.act) {
      readHeader();
      const old = state.draft; state.draft = newDraft(el.dataset.setor);
      if (old) Object.assign(state.draft, { local: old.local, responsavel: old.responsavel, registroTst: old.registroTst, data: old.data, horaInicio: old.horaInicio, horaFim: old.horaFim, turno: old.turno, acompanhante: old.acompanhante, cargoLider: old.cargoLider, assinaturaLider: old.assinaturaLider, observacoes: old.observacoes });
      render(); return;
    }
    if (el.matches(".seg button")) {
      readHeader();
      const it = state.draft.itens[+el.dataset.i]; it.status = it.status === el.dataset.v ? "" : el.dataset.v;
      const y = window.scrollY; render(); window.scrollTo(0, y);
      if (it.status === "NC") document.getElementById("nc-obs-" + el.dataset.i)?.focus({ preventScroll: true });
      return;
    }
    const act = el.dataset.act;
    const cur = () => state.inspecoes.find(x => x.id === state.selected);
    const cfg = state.cfgDraft;
    const keepY = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
    switch (act) {
      case "nova": go("nova"); break;
      case "pf-tst": state.pf.tst = el.dataset.tst === "—" ? "" : el.dataset.tst; window.scrollTo(0, 0); render(); break;
      case "abrir": go("detalhe", { selected: el.dataset.id }); break;
      case "voltar": go("historico"); break;
      case "descartar": state.draft = null; state.ai = {}; render(); break;
      case "ai-run": readHeader(); runAI(+el.dataset.i); break;
      case "ac-add": { readHeader(); const it = state.draft.itens[+el.dataset.i]; it.acoes.push(novaAcao()); keepY(); document.getElementById(`ac-${el.dataset.i}-${it.acoes.length - 1}-texto`)?.focus({ preventScroll: true }); break; }
      case "ac-del": readHeader(); state.draft.itens[+el.dataset.i].acoes.splice(+el.dataset.k, 1); keepY(); break;
      case "sig-clear": { state.draft.assinaturaLider = ""; const pad = document.getElementById("sig-pad"); pad.getContext("2d").clearRect(0, 0, pad.width, pad.height); break; }
      case "sec-c": readHeader(); state.draft.itens.forEach(i => { if (i.secaoId === el.dataset.sec && !i.status) i.status = "C"; }); keepY(); break;
      case "finalizar": { const it = cur().itens[+el.dataset.idx], k = +el.dataset.k || 0; state.closing = { idx: +el.dataset.idx, k, data: today(), por: acoesDe(it)[k]?.resp || "", desc: "", foto: "" }; keepY(); document.getElementById("fin-desc")?.focus({ preventScroll: true }); break; }
      case "fin-cancelar": state.closing = null; keepY(); break;
      case "fin-salvar": {
        const c = state.closing, msg = document.getElementById("fin-msg");
        const bad = (t, id) => { msg.textContent = t; msg.style.color = "var(--bad)"; document.getElementById(id)?.focus(); };
        if (!c.data) return bad("Informe a data de conclusão.", "fin-data");
        if (!c.por.trim()) return bad("Informe quem executou.", "fin-por");
        if (!c.desc.trim()) return bad("Descreva o que foi feito.", "fin-desc");
        if (!c.foto) return bad("Anexe a foto da ação concluída.", "fin-foto");
        const i = structuredClone(cur()); const it = i.itens[c.idx];
        el.disabled = true;
        try {
        it.acoes = structuredClone(acoesDe(it));
        Object.assign(it.acoes[c.k || 0], { corrigido: true, corrigidoEm: c.data, corrigidoPor: c.por.trim(), descricaoConclusao: c.desc.trim(), fotoConclusao: await persistFoto(c.foto) }); syncNC(it); await saveInsp(i); state.closing = null; toast("Ação finalizada"); keepY(); }
        catch (err) { el.disabled = false; bad(err?.code === "invalid_argument" ? "Não foi possível salvar. Se anexou foto, tente uma imagem menor." : "Não foi possível salvar. Tente novamente."); }
        break;
      }
      case "reabrir": {
        const i = structuredClone(cur()); const it = i.itens[+el.dataset.idx];
        it.acoes = structuredClone(acoesDe(it));
        Object.assign(it.acoes[+el.dataset.k || 0], { corrigido: false, corrigidoEm: "", corrigidoPor: "", descricaoConclusao: "", fotoConclusao: "" }); syncNC(it);
        el.disabled = true;
        try { await saveInsp(i); toast("Ação reaberta"); } catch { el.disabled = false; toast("Não foi possível atualizar. Tente novamente."); }
        break;
      }
      case "excluir": state.confirmDelete = true; render(); break;
      case "excluir-nao": state.confirmDelete = false; render(); break;
      case "excluir-sim": try { await deleteInsp(state.selected); toast("Inspeção excluída"); go("historico"); } catch { toast("Não foi possível excluir. Tente novamente."); } break;
      case "duplicar": { const i = cur(); state.draft = newDraft(i.setorId); Object.assign(state.draft, { setorNome: i.setorNome, local: i.local, responsavel: i.responsavel, registroTst: i.registroTst || state.draft.registroTst, acompanhante: i.acompanhante, cargoLider: i.cargoLider || "" }); go("nova"); break; }
      case "relatorio": exportXlsx(cur(), el); break;
      case "csv-one": { const i = cur(); offer(`inspecao-${slug(setorLabel(i))}-${i.data}.csv`, toCSV([i])); break; }
      case "csv": offer(`inspecoes-${today()}.csv`, toCSV(filtered())); break;
      case "copiar": {
        const ta = document.getElementById("copy-text");
        try { await navigator.clipboard.writeText(ta.value); toast("Copiado"); } catch { ta.select(); toast("Texto selecionado. Use Ctrl+C para copiar."); }
        break;
      }
      // Configuração
      case "cfg-setor": state.cfgSetor = el.dataset.id; state.cfgConfirmDel = false; keepY(); break;
      case "cfg-secao": state.cfgSecao = el.dataset.id; keepY(); break;
      case "cfg-novo-setor": { const id = "s-" + uid(); cfg.setores.push({ id, nome: "Novo setor", generico: false, secoes: [] }); state.cfgSetor = id; cfgChanged(); document.getElementById("cfg-nome")?.select(); break; }
      case "cfg-nova-secao": { const id = "sec-" + uid(); cfg.secoes.push({ id, nome: "Nova seção", nr: "", perguntas: [] }); state.cfgSecao = id; cfgChanged(); document.getElementById("sec-nome")?.select(); break; }
      case "cfg-del": state.cfgConfirmDel = true; keepY(); break;
      case "cfg-del-nao": state.cfgConfirmDel = false; keepY(); break;
      case "cfg-del-sim": cfg.setores = cfg.setores.filter(s => s.id !== state.cfgSetor); state.cfgConfirmDel = false; state.cfgSetor = cfg.setores[0]?.id; cfgChanged(); break;
      case "q-del": cfg.secoes.find(s => s.id === state.cfgSecao).perguntas.splice(+el.dataset.i, 1); cfgChanged(); break;
      case "q-add": { const inp = document.getElementById("q-nova"); const t = inp.value.trim(); if (!t) { inp.focus(); break; }
        cfg.secoes.find(s => s.id === state.cfgSecao).perguntas.push({ texto: t, ref: "" }); cfgChanged(); document.getElementById("q-nova")?.focus(); break; }
      case "cfg-padrao": state.cfgDraft = { secoes: structuredClone(DEFAULT_SECOES), setores: structuredClone(DEFAULT_SETORES), tsts: structuredClone(cfg.tsts || []), metaTst: cfg.metaTst || 0 }; cfgChanged(); toast("Padrão carregado. Clique em Salvar alterações para aplicar."); break;
      case "tst-add": (cfg.tsts ||= []).push({ nome: "", registro: "" }); cfgChanged(); document.getElementById(`tst-n-${cfg.tsts.length - 1}`)?.focus(); break;
      case "tst-del": cfg.tsts.splice(+el.dataset.i, 1); cfgChanged(); break;
      case "cfg-descartar": state.cfgDraft = null; state.cfgDirty = false; keepY(); break;
      case "cfg-salvar": {
        const usados = new Set(cfg.setores.flatMap(s => s.secoes));
        cfg.secoes.forEach(s => s.perguntas = s.perguntas.filter(p => p.texto.trim()));
        cfg.tsts = (cfg.tsts || []).map(t => ({ nome: (t.nome || "").trim(), registro: (t.registro || "").trim() })).filter(t => t.nome);
        el.disabled = true;
        const { tsts, metaTst, ...base } = cfg;
        try { if (JSON.stringify(base) !== JSON.stringify(state.config)) { await saveConfig(structuredClone(base)); state.config = structuredClone(base); }
          await saveEquipe({ tsts, metaTst: metaTst || 0 }); state.cfgDirty = false; state.cfgDraft = null; toast("Setores e perguntas salvos"); keepY(); }
        catch (err) { el.disabled = false; toast(err?.code === "invalid_argument" ? "Seu acesso não permite alterar os setores." : "Não foi possível salvar. Tente novamente."); }
        void usados; break;
      }
    }
  });
  document.addEventListener("change", async e => {
    if (e.target.id === "f-tst-sel") {
      const o = e.target.selectedOptions[0], r = document.getElementById("f-resp"), g = document.getElementById("f-reg"), outro = e.target.value === "__outro";
      if (state.draft) state.draft.tstOutro = outro;
      r.hidden = !outro; r.value = outro || !e.target.value ? "" : e.target.value;
      g.value = !outro && e.target.value ? o.dataset.reg || "" : ""; if (outro) r.focus();
      return;
    }
    if (e.target.dataset.ncFoto != null && state.draft) {
      const i = +e.target.dataset.ncFoto, f = e.target.files?.[0]; if (!f) return;
      readHeader();
      try { state.draft.itens[i].foto = await shrinkImage(f); state.draft.itens[i].analiseFoto = ""; rerenderKeep(); if (sample) runAI(i); }
      catch { toast("Não foi possível ler a imagem. Tente outra foto."); }
      return;
    }
    if (e.target.id !== "fin-foto" || !state.closing) return;
    const f = e.target.files?.[0]; if (!f) return;
    try { state.closing.foto = await shrinkImage(f); const y = window.scrollY; render(); window.scrollTo(0, y); }
    catch { toast("Não foi possível ler a imagem. Tente outra foto."); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
    if (e.key === "Enter" && e.target.id === "q-nova") { e.preventDefault(); document.querySelector('[data-act="q-add"]')?.click(); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (state.closing && t.id === "fin-data") { state.closing.data = t.value; return; }
    if (state.closing && t.id === "fin-por") { state.closing.por = t.value; return; }
    if (state.closing && t.id === "fin-desc") { state.closing.desc = t.value; return; }
    if (t.id === "pf-periodo" || t.id === "pf-setor" || t.id === "pf-tst") {
      state.pf = { periodo: document.getElementById("pf-periodo").value, setor: document.getElementById("pf-setor").value, tst: document.getElementById("pf-tst").value };
      const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    if (t.id === "h-q" || t.id === "h-setor") {
      state.filtro.q = document.getElementById("h-q").value; state.filtro.setor = document.getElementById("h-setor").value;
      document.getElementById("h-body").innerHTML = histRows(filtered()); return;
    }
    if (state.view !== "setores" || !state.cfgDraft) return;
    const st = state.cfgDraft.setores.find(s => s.id === state.cfgSetor);
    const sec = state.cfgDraft.secoes.find(s => s.id === state.cfgSecao);
    if (t.dataset.cfg === "nome") { st.nome = t.value; cfgChanged(false); }
    else if (t.dataset.cfg === "generico") { st.generico = t.checked; cfgChanged(false); }
    else if (t.dataset.cfg === "secao") {
      const ids = [...document.querySelectorAll('[data-cfg="secao"]:checked')].map(x => x.value);
      st.secoes = state.cfgDraft.secoes.map(s => s.id).filter(id => ids.includes(id)); cfgChanged();
    }
    else if (t.dataset.sec) { sec[t.dataset.sec] = t.value; cfgChanged(false); }
    else if (t.dataset.q) { sec.perguntas[+t.dataset.i][t.dataset.q] = t.value; cfgChanged(false); }
    else if (t.dataset.cfgmeta) { state.cfgDraft.metaTst = Math.max(0, parseInt(t.value, 10) || 0); cfgChanged(false); }
    else if (t.dataset.tst) { state.cfgDraft.tsts[+t.dataset.i][t.dataset.tst] = t.value; cfgChanged(false); }
  });

  try { const h = location.hash.slice(1); if (["painel", "nova", "historico", "setores"].includes(h)) state.view = h; } catch {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  initStore();
})();
</script>

</body>
</html>
