<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Inspeção de Segurança</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prancheta de campo. Barra superior com abas, conteúdo em coluna única de até 1040px; faixas de sinalização NR-26 (amarelo/preto) só no cabeçalho. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #e9ebe6;
  --fg: #1d211c;
  --muted: #5d645a;
  --line: #d3d7cf;
  --accent: #e8b500;      /* amarelo segurança */
  --accent-ink: #1d211c;
  --ok: #1f7a3d;
  --ok-bg: #e2f2e6;
  --bad: #c0281e;
  --bad-bg: #fbe5e2;
  --na: #6b7068;
  --na-bg: #ebece8;
  --warn: #9a6a00;
  --warn-bg: #fdf1cf;
  --focus: #1b5fd1;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151814; --surface: #1e221d; --surface-2: #272c26; --fg: #e9ece6; --muted: #a2a99e; --line: #353b33;
    --accent: #f2c21b; --accent-ink: #151814;
    --ok: #5cc27e; --ok-bg: #1b3323; --bad: #ff7a6e; --bad-bg: #3d1d1a; --na: #a2a99e; --na-bg: #2b302a;
    --warn: #f2c21b; --warn-bg: #3a3116; --focus: #7aa8ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151814; --surface: #1e221d; --surface-2: #272c26; --fg: #e9ece6; --muted: #a2a99e; --line: #353b33;
  --accent: #f2c21b; --accent-ink: #151814;
  --ok: #5cc27e; --ok-bg: #1b3323; --bad: #ff7a6e; --bad-bg: #3d1d1a; --na: #a2a99e; --na-bg: #2b302a;
  --warn: #f2c21b; --warn-bg: #3a3116; --focus: #7aa8ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabeçalho */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fg); color: var(--bg); }
.hazard { height: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, var(--fg) 12px 24px); }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand small { display: block; font-family: var(--f-mono); font-size: 11px; opacity: .7; letter-spacing: .04em; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs button { font: 600 14px var(--f-body); background: transparent; color: var(--bg); border: 1px solid transparent; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
nav.tabs button:hover { border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

main { padding-block: 24px 64px; }
.store-note { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 30px; text-transform: uppercase; letter-spacing: .01em; margin: 0 0 4px; line-height: 1.05; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 65ch; }
.label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 20px; }

/* Painel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .num { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.alert .num { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.nc-list { display: flex; flex-direction: column; gap: 0; }
.nc-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.nc-row:first-child { border-top: 0; }
.nc-row .bar { align-self: stretch; background: var(--bad); border-radius: 2px; }
.nc-row.late .bar { background: var(--bad); }
.nc-row.ontime .bar { background: var(--accent); }
.nc-row .t { font-weight: 500; }
.nc-row .m { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.barrow { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 4px 10px; align-items: center; font-size: 13px; }
.barrow .track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.barrow .fill { height: 100%; border-radius: 4px; }
.barrow .pct { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Botões e campos */
.btn { font: 600 14px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.span2 { grid-column: span 2; }
.field.span3 { grid-column: 1 / -1; }
input, select, textarea { font: 400 15px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 60px; }

/* Seleção de checklist */
.cl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cl-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; color: var(--fg); font: inherit; display: flex; flex-direction: column; gap: 4px; }
.cl-card:hover { border-color: var(--muted); }
.cl-card[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: var(--surface-2); }
.cl-card .nr { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cl-card .nm { font-weight: 600; }

/* Itens do checklist */
.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.item .txt { padding-top: 5px; }
.item .ref { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 13px var(--f-body); border: 0; background: var(--surface); color: var(--muted); padding: 7px 11px; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"][data-v="C"] { background: var(--ok); color: #fff; }
.seg button[aria-pressed="true"][data-v="NC"] { background: var(--bad); color: #fff; }
.seg button[aria-pressed="true"][data-v="NA"] { background: var(--na); color: var(--surface); }
.item .extra { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; background: var(--bad-bg); border-radius: 6px; padding: 10px 12px; }
.item .extra .field.span3 { grid-column: 1 / -1; }
.item .obs { grid-column: 2 / -1; }
.progress { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--fg); }
.sticky-actions { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; z-index: 3; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-body); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.na { background: var(--na-bg); color: var(--na); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ex { background: var(--surface-2); color: var(--muted); font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }

/* Histórico */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters input { flex: 1 1 220px; width: auto; }
.filters select { width: auto; flex: 0 1 220px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Detalhe */
.detail-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 16px; margin-top: 12px; }
.meta div { display: flex; flex-direction: column; min-width: 0; }
.meta b { font-weight: 500; overflow-wrap: anywhere; }
.score { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.d-item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.d-item:first-child { border-top: 0; }
.d-item .note { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
.d-item .act { grid-column: 2 / -1; font-size: 13px; background: var(--bad-bg); border-radius: 6px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.d-item .act.done { background: var(--ok-bg); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bad-bg); color: var(--bad); padding: 8px 12px; border-radius: 6px; font-size: 14px; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h3 { color: var(--fg); margin-bottom: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.copybox { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: 12px; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .field.span2 { grid-column: auto; }
  .item { grid-template-columns: 26px minmax(0, 1fr); }
  .item .seg { grid-column: 2; justify-self: start; }
  .item .extra { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
}

/* Setores e perguntas */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font: 500 14px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.pill:hover { border-color: var(--muted); }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill .c { font-family: var(--f-mono); font-size: 12px; opacity: .7; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.check-card { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px; align-items: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
.check-card input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--bad); }
.check-card .nm { font-weight: 600; }
.check-card .sub { grid-column: 2; font-size: 12px; color: var(--muted); }
.inline-check { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.inline-check input { width: 18px; height: 18px; flex: none; margin-top: 2px; accent-color: var(--bad); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 18px 0 8px; border-bottom: 2px solid var(--fg); }
.sec-head:first-child { padding-top: 0; }
.q-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.q-row:first-child { border-top: 0; }
.q-row .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.save-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 3; }
@media (max-width: 760px) { .q-row { grid-template-columns: 24px minmax(0, 1fr); } .q-row .ref-in, .q-row .btn { grid-column: 2; justify-self: start; } }
</style>

<header class="top">
  <div class="hazard" aria-hidden="true"></div>
  <div class="wrap">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 28H2Z" fill="var(--accent)"/><path d="M16 3 30 28H2Z" fill="none" stroke="var(--fg)" stroke-width="1.5"/><rect x="14.6" y="11" width="2.8" height="9" rx="1" fill="var(--fg)"/><circle cx="16" cy="23.5" r="1.7" fill="var(--fg)"/></svg>
      <div><h1>Inspeção de Segurança</h1><small>Checklists por setor · NRs MTE</small></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button role="tab" id="tab-painel" data-view="painel" aria-selected="true">Painel</button>
      <button role="tab" id="tab-nova" data-view="nova" aria-selected="false">Nova inspeção</button>
      <button role="tab" id="tab-historico" data-view="historico" aria-selected="false">Histórico</button>
      <button role="tab" id="tab-setores" data-view="setores" aria-selected="false">Setores e perguntas</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty"><h3>Carregando inspeções…</h3><p>Conectando ao banco de dados do sistema.</p></div>
</main>

<script>
(() => {
  // ---------- Seções de perguntas (padrão; editáveis em "Setores e perguntas") ----------
  const q = (texto, ref = "") => ({ texto, ref });
  const DEFAULT_SECOES = [
    { id: "epi", nome: "EPI", nr: "NR-06", perguntas: [

      q("EPIs com Certificado de Aprovação (CA) válido e em bom estado", "6.2"),
      q("Ficha de entrega de EPI atualizada e assinada", "6.5.1"),

    { id: "eletrica", nome: "Instalações elétricas", nr: "NR-10", perguntas: [

      q("Diagrama unifilar atualizado disponível", "10.2.3"),
    ]},
    { id: "maquinas", nome: "Máquinas e equipamentos", nr: "NR-12", perguntas: [
      q("Proteções fixas ou móveis instaladas nas zonas de perigo", "12.5"),
      q("Parada de emergência acessível e funcionando", "12.6"),
      q("Dispositivos de intertravamento operantes", "12.5"),
      q("Sinalização de segurança nas máquinas", "12.12"),
      q("Procedimento de operação disponível no posto", "12.13"),
      q("Operadores capacitados e autorizados", "12.16"),
      q("Manutenção preventiva registrada e em dia", "12.11"),
      q("Área de circulação demarcada ao redor das máquinas", "12.2"),
    ]},
    { id: "quimicos", nome: "Inflamáveis, químicos e resíduos", nr: "NR-20", perguntas: [

      q("Kit de contenção de derramamento disponível"),

    { id: "frentes", nome: "Frentes de trabalho", nr: "NR-33 / NR-35", perguntas: [

      q("Trabalhadores com treinamento NR-35 ou NR-33 válido"),
      q("Cinto e talabarte inspecionados, ponto de ancoragem definido", "35.5"),

      q("Área isolada e sinalizada"),
      q("Plano de resgate disponível"),
    ]},
    { id: "fornos", nome: "Fornos, metal líquido e calor", nr: "NR-13 / NR-14", perguntas: [
      q("Fornos com inspeção e manutenção registradas", "NR-14"),
      q("Panelas de vazamento secas, inspecionadas e com refratário em bom estado"),
      q("Área de vazamento livre de umidade e água"),
      q("Rotas de fuga livres ao redor dos fornos"),

      q("Pausas e hidratação para trabalho com calor", "NR-15 An. 3"),
      q("Sistema de exaustão dos fornos funcionando"),
    ]},
    { id: "cargas", nome: "Movimentação de cargas", nr: "NR-11", perguntas: [
      q("Ponte rolante e talhas com inspeção em dia e capacidade indicada"),
      q("Cintas, correntes e ganchos inspecionados e identificados"),
      q("Operadores de empilhadeira e ponte rolante habilitados", "11.1.5"),
      q("Empilhadeira com checklist diário, sinal sonoro e luminoso"),
      q("Ninguém sob carga suspensa; área de içamento isolada"),
      q("Peças e materiais empilhados com altura e estabilidade seguras"),
    ]},
    { id: "ambiente", nome: "Ruído, poeira e ergonomia", nr: "NR-15 / NR-17", perguntas: [
      q("Exaustão local funcionando nos pontos de poeira (jateamento, rebarbação, desmoldagem)"),
      q("Cabines de jato e pintura com exaustão e filtros em bom estado"),
      q("Fontes de ruído enclausuradas ou protegidas quando possível"),
      q("Postos com altura e alcance adequados", "17.3"),
      q("Levantamento manual de peças com auxílio mecânico quando necessário", "17.5"),
    ]},
    { id: "incendio", nome: "Prevenção e combate a incêndio", nr: "NR-23", perguntas: [
      q("Extintores no local, sinalizados, desobstruídos e dentro da validade"),
      q("Hidrantes e mangueiras em condições de uso"),
      q("Saídas de emergência sinalizadas e desobstruídas", "23.3"),
      q("Iluminação de emergência funcionando"),
      q("Brigada de incêndio do turno identificada"),
    ]},
    { id: "areas", nome: "Áreas comuns e 5S", nr: "NR-24 / NR-26", perguntas: [
      q("Corredores e rotas desobstruídos e demarcados"),
      q("Piso sem óleo, areia acumulada, buracos ou desníveis"),
      q("Materiais organizados, sem itens desnecessários no setor"),
      q("Sinalização de segurança visível", "NR-26"),
      q("Iluminação adequada"),
      q("Sanitários, vestiários e refeitório limpos", "NR-24"),
      q("Água potável disponível", "24.7"),
      q("Lixeiras e coleta seletiva identificadas"),
    ]},
  ];
  const TODAS = DEFAULT_SECOES.map(s => s.id);
  const sem = (...ex) => TODAS.filter(id => !ex.includes(id));
  const DEFAULT_SETORES = [
    { id: "usinagem", nome: "Usinagem", generico: false, secoes: sem("fornos", "frentes") },
    { id: "fusao", nome: "Fusão", generico: false, secoes: TODAS },
    { id: "macharia", nome: "Macharia", generico: false, secoes: sem("fornos", "frentes") },
    { id: "savelli", nome: "Savelli (areia verde)", generico: false, secoes: sem("fornos") },
    { id: "curafrio", nome: "Cura Frio", generico: false, secoes: sem("fornos", "frentes") },
    { id: "rebarbacao", nome: "Rebarbação e jateamento", generico: false, secoes: sem("fornos", "frentes") },
    { id: "pintura", nome: "Pintura", generico: false, secoes: sem("fornos", "cargas") },
    { id: "outro", nome: "Outro setor (todas as seções)", generico: true, secoes: TODAS },
  ];

  // ---------- Estado ----------
  const state = {
    view: "painel", inspecoes: [], loaded: false, store: "db", canWrite: true,
    selected: null, confirmDelete: false, filtro: { q: "", setor: "" }, draft: null,
    config: { secoes: structuredClone(DEFAULT_SECOES), setores: structuredClone(DEFAULT_SETORES) },
    cfgDraft: null, cfgSetor: "usinagem", cfgSecao: "epi", cfgDirty: false, cfgConfirmDel: false,
  };
  let db = null, downloads = null;
  const app = document.getElementById("app");

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Date().toISOString().slice(0, 10);
  const fmtDate = d => d ? d.split("-").reverse().join("/") : "—";
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const secById = (cfg, id) => cfg.secoes.find(s => s.id === id);
  const countQ = (cfg, setor) => setor.secoes.reduce((n, id) => n + (secById(cfg, id)?.perguntas.length || 0), 0);
  const setorLabel = i => i.setorNome || [i.nr, i.checklistNome].filter(Boolean).join(" · ") || "—";

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  function score(insp) {
    const c = insp.itens.filter(i => i.status === "C").length;
    const nc = insp.itens.filter(i => i.status === "NC").length;
    return { c, nc, na: insp.itens.filter(i => i.status === "NA").length, pct: c + nc ? Math.round(c / (c + nc) * 100) : null };
  }
  const pctColor = p => p == null ? "var(--na)" : p >= 90 ? "var(--ok)" : p >= 70 ? "var(--accent)" : "var(--bad)";
  const pctChip = p => p == null ? `<span class="chip na">—</span>` : `<span class="chip ${p >= 90 ? "ok" : p >= 70 ? "warn" : "bad"}">${p}%</span>`;

  // ---------- Armazenamento ----------
  const LS_KEY = "inspecoes-seguranca-v1", LS_CFG = "inspecoes-seguranca-config-v1";
  const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  async function saveInsp(insp) {
    if (state.store === "db") { const { id, ...body } = insp; await db.collection("inspecoes").doc(id).set(body); }
    else {
      const i = state.inspecoes.findIndex(x => x.id === insp.id);
      if (i >= 0) state.inspecoes[i] = insp; else state.inspecoes.push(insp);
      sortInsp(); lsSet(LS_KEY, state.inspecoes); render();
    }
  }
  async function deleteInsp(id) {
    if (state.store === "db") await db.collection("inspecoes").doc(id).delete();
    else { state.inspecoes = state.inspecoes.filter(x => x.id !== id); lsSet(LS_KEY, state.inspecoes); render(); }
  }
  async function saveConfig(cfg) {
    if (state.store === "db") await db.doc("config/setup").set(cfg);
    else { state.config = structuredClone(cfg); lsSet(LS_CFG, cfg); render(); }
  }
  function sortInsp() { state.inspecoes.sort((a, b) => (b.data || "").localeCompare(a.data || "") || (b.criadoEm || 0) - (a.criadoEm || 0)); }
  function useLocal() {
    state.store = "local"; state.inspecoes = lsGet(LS_KEY, []);
    const cfg = lsGet(LS_CFG, null); if (cfg?.setores && cfg?.secoes) state.config = cfg;
    sortInsp(); state.loaded = true; render();
  }

  async function initStore() {
    try {
      db = await claude.use("db");
      const user = await claude.use("user");
      if (user && user.can) { const w = await user.can("data.write"); if (w === false) state.canWrite = false; }
    } catch { db = null; }
    try { downloads = await claude.use("downloads"); } catch { downloads = null; }
    if (!db) return useLocal();
    db.doc("config/setup").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (d?.setores && d?.secoes) state.config = structuredClone(d);
      if (state.loaded && !state.cfgDirty) { state.cfgDraft = null; render(); }
    }, () => {});
    db.collection("inspecoes").onSnapshot(snap => {
      state.inspecoes = snap.docs.map(d => ({ id: d.id, ...structuredClone(d.data()) }));
      sortInsp(); state.loaded = true; render();
    }, () => useLocal());
  }

  // ---------- Navegação ----------
  function go(view, opts = {}) {
    state.view = view; state.confirmDelete = false;
    if ("selected" in opts) state.selected = opts.selected;
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === (view === "detalhe" ? "historico" : view))));
    render(); window.scrollTo(0, 0);
  }
  document.querySelector("nav.tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-view]"); if (b) go(b.dataset.view);
  });

  // ---------- Render ----------
  function render() {
    if (!state.loaded) return;
    if (state.view === "nova") readHeader();
    const note = state.store === "local"
      ? `<div class="store-note">As inspeções e a configuração dos setores ficam salvas neste navegador. Use Exportar CSV para guardar uma cópia.</div>` : "";
    const v = { painel: viewPainel, nova: viewNova, historico: viewHistorico, detalhe: viewDetalhe, setores: viewSetores }[state.view] || viewPainel;
    app.innerHTML = note + v();
    if (state.view === "nova") bindNova();
  }

  function pendencias() {
    const out = [];
    for (const insp of state.inspecoes) insp.itens.forEach((it, idx) => { if (it.status === "NC" && !it.corrigido) out.push({ insp, it, idx }); });
    return out.sort((a, b) => (a.it.prazo || "9999").localeCompare(b.it.prazo || "9999"));
  }
  function emptyState(title, text) {
    return `<div class="panel empty"><h3>${title}</h3><p>${text}</p><button class="btn primary" data-act="nova">Iniciar inspeção</button></div>`;
  }

  function viewPainel() {
    const L = state.inspecoes;
    const lead = `<h2>Painel</h2><p class="lead">Resumo das inspeções, não conformidades abertas e conformidade por setor.</p>`;
    if (!L.length) return lead + emptyState("Nenhuma inspeção registrada", "Escolha o setor, responda as perguntas de cada seção como conforme, não conforme ou não aplicável e salve. Os resultados aparecem aqui.");
    const pend = pendencias(), t = today();
    const atrasadas = pend.filter(p => p.it.prazo && p.it.prazo < t).length;
    const scores = L.map(score).filter(s => s.pct != null);
    const media = scores.length ? Math.round(scores.reduce((a, s) => a + s.pct, 0) / scores.length) : null;
    const doMes = L.filter(i => (i.data || "").startsWith(t.slice(0, 7))).length;
    const grupos = {};
    for (const i of L) { const s = score(i); if (s.pct == null) continue; (grupos[setorLabel(i)] ||= []).push(s.pct); }
    const porSetor = Object.entries(grupos).map(([nome, ps]) => ({ nome, n: ps.length, pct: Math.round(ps.reduce((a, b) => a + b, 0) / ps.length) })).sort((a, b) => a.pct - b.pct);

    return lead + `<div class="stack">
      <div class="kpis">
        <div class="kpi"><span class="label">Inspeções</span><span class="num">${L.length}</span><span class="sub">${doMes} neste mês</span></div>
        <div class="kpi"><span class="label">Conformidade média</span><span class="num" style="color:${pctColor(media)}">${media ?? "—"}${media != null ? "%" : ""}</span><span class="sub">C ÷ (C + NC)</span></div>
        <div class="kpi ${pend.length ? "alert" : ""}"><span class="label">NC em aberto</span><span class="num">${pend.length}</span><span class="sub">${atrasadas} com prazo vencido</span></div>
        <div class="kpi"><span class="label">Última inspeção</span><span class="num" style="font-size:28px">${fmtDate(L[0].data)}</span><span class="sub">${esc(setorLabel(L[0]))}</span></div>
      </div>
      <div class="grid2">
        <section class="panel">
          <div class="panel-head"><h3>Ações corretivas pendentes</h3><span class="label">por prazo</span></div>
          ${pend.length ? `<div class="nc-list">${pend.slice(0, 12).map(p => {
            const late = p.it.prazo && p.it.prazo < t;
            return `<div class="nc-row ${late ? "late" : "ontime"}"><div class="bar"></div>
              <div style="min-width:0"><div class="t">${esc(p.it.texto)}</div>
                <div class="m">${esc(setorLabel(p.insp))}${p.it.secao ? " · " + esc(p.it.secao) : ""} · ${p.it.respAcao ? "Resp.: " + esc(p.it.respAcao) + " · " : ""}${p.it.prazo ? (late ? `<span class="chip bad">vencido ${fmtDate(p.it.prazo)}</span>` : "prazo " + fmtDate(p.it.prazo)) : "sem prazo"}</div></div>
              <button class="btn small" data-act="abrir" data-id="${p.insp.id}">Ver</button></div>`; }).join("")}</div>${pend.length > 12 ? `<p class="label" style="margin:8px 0 0">+ ${pend.length - 12} pendências no histórico</p>` : ""}`
          : `<p class="lead" style="margin:0">Nenhuma não conformidade em aberto.</p>`}
        </section>
        <section class="panel">
          <div class="panel-head"><h3>Conformidade por setor</h3><span class="label">média</span></div>
          <div class="bars">${porSetor.map(x => `<div class="barrow"><span>${esc(x.nome)} <span class="label">(${x.n})</span></span><span class="pct">${x.pct}%</span>
            <div class="track"><div class="fill" style="width:${x.pct}%;background:${pctColor(x.pct)}"></div></div></div>`).join("")}</div>
        </section>
      </div>
    </div>`;
  }

  // ---------- Nova inspeção ----------
  function newDraft(setorId) {
    const cfg = state.config, st = cfg.setores.find(s => s.id === setorId);
    const itens = [];
    for (const sid of st.secoes) { const sec = secById(cfg, sid); if (!sec) continue;
      for (const p of sec.perguntas) itens.push({ secaoId: sec.id, secao: sec.nome, nr: sec.nr, texto: p.texto, ref: p.ref, status: "", obs: "", acao: "", prazo: "", respAcao: "" }); }
    return { setorId, setorNome: st.generico ? "" : st.nome, generico: st.generico, local: "", responsavel: "", data: today(), acompanhante: "", observacoes: "", itens };
  }

  function viewNova() {
    if (!state.canWrite) return `<h2>Nova inspeção</h2><div class="panel empty"><h3>Somente leitura</h3><p>Seu acesso a esta página permite consultar as inspeções, mas não registrar novas.</p></div>`;
    const d = state.draft, cfg = state.config;
    const chips = `<div class="chips">${cfg.setores.map(s => `<button type="button" class="pill" data-setor="${esc(s.id)}" aria-pressed="${d?.setorId === s.id}">${esc(s.nome)} <span class="c">(${countQ(cfg, s)})</span></button>`).join("")}</div>`;
    if (!d) return `<h2>Nova inspeção</h2><p class="lead">Escolha o setor. Cada setor traz só as seções de perguntas que se aplicam a ele.</p>${chips}`;
    const s = score(d), answered = d.itens.filter(i => i.status).length;
    let lastSec = null, n = 0, secN = 0;
    const rows = d.itens.map((it, i) => {
      let head = "";
      if (it.secaoId !== lastSec) { lastSec = it.secaoId; secN++; n = 0;
        const total = d.itens.filter(x => x.secaoId === it.secaoId).length;
        head = `<div class="sec-head"><h3>${esc(it.secao)}</h3><span class="label">${esc(it.nr || "")}${it.nr ? " · " : ""}${total} perguntas <button type="button" class="btn small" data-act="sec-c" data-sec="${esc(it.secaoId)}" style="margin-left:8px">Pendentes = C</button></span></div>`; }
      n++;
      return head + itemRow(it, i, `${secN}.${n}`);
    }).join("");
    return `<h2>Nova inspeção</h2><p class="lead">${esc(d.generico ? "Outro setor" : d.setorNome)} · ${d.itens.length} perguntas</p>
    <form id="f-insp" class="stack" novalidate>
      <details class="panel"><summary class="label" style="cursor:pointer">Trocar setor</summary><div style="margin-top:12px">${chips}</div></details>
      <section class="panel">
        <div class="panel-head"><h3>Identificação</h3></div>
        <div class="fields">
          ${d.generico ? `<label class="field span2"><span class="label">Nome do setor *</span><input id="f-setor-nome" required value="${esc(d.setorNome)}" placeholder="Ex.: Manutenção"></label>` : ""}
          <label class="field ${d.generico ? "" : "span2"}"><span class="label">Local / área</span><input id="f-local" value="${esc(d.local)}" placeholder="Ex.: Célula 3, forno 2"></label>
          <label class="field"><span class="label">Data *</span><input id="f-data" type="date" required value="${esc(d.data)}"></label>
          <label class="field"><span class="label">TST / inspetor *</span><input id="f-resp" required value="${esc(d.responsavel)}" placeholder="Nome do técnico"></label>
          <label class="field"><span class="label">Acompanhante</span><input id="f-acomp" value="${esc(d.acompanhante)}" placeholder="Ex.: Supervisor do setor"></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Perguntas</h3>
          <div class="progress"><span><b>${answered}</b>/${d.itens.length} respondidas</span><span class="chip ok">${s.c} C</span><span class="chip bad">${s.nc} NC</span><span class="chip na">${s.na} N/A</span></div></div>
        <div class="items">${rows}</div>
      </section>
      <section class="panel">
        <label class="field"><span class="label">Observações gerais</span><textarea id="f-obs" placeholder="Condições encontradas, orientações dadas no local…">${esc(d.observacoes)}</textarea></label>
      </section>
      <div class="sticky-actions">
        <span class="label" id="f-msg">Todas as perguntas precisam de resposta.</span>
        <div class="row-actions"><button type="button" class="btn" data-act="descartar">Descartar</button><button type="submit" class="btn primary">Salvar inspeção</button></div>
      </div>
    </form>`;
  }

  function itemRow(it, i, num) {
    const seg = ["C", "NC", "NA"].map(v => `<button type="button" data-v="${v}" data-i="${i}" aria-pressed="${it.status === v}" aria-label="${{ C: "Conforme", NC: "Não conforme", NA: "Não aplicável" }[v]}">${v === "NA" ? "N/A" : v}</button>`).join("");
    const extra = it.status === "NC" ? `<div class="extra">
        <label class="field span3"><span class="label">Descrição da não conformidade</span><textarea id="nc-obs-${i}" data-k="obs" data-i="${i}" placeholder="O que foi encontrado">${esc(it.obs)}</textarea></label>
        <label class="field span3"><span class="label">Ação corretiva</span><input id="nc-acao-${i}" data-k="acao" data-i="${i}" value="${esc(it.acao)}" placeholder="O que deve ser feito"></label>
        <label class="field"><span class="label">Responsável pela ação</span><input id="nc-resp-${i}" data-k="respAcao" data-i="${i}" value="${esc(it.respAcao)}"></label>
        <label class="field"><span class="label">Prazo</span><input id="nc-prazo-${i}" type="date" data-k="prazo" data-i="${i}" value="${esc(it.prazo)}"></label>
      </div>` : (it.status ? `<input class="obs" id="it-obs-${i}" data-k="obs" data-i="${i}" value="${esc(it.obs)}" placeholder="Observação (opcional)">` : "");
    return `<div class="item" id="item-${i}"><span class="n">${num}</span>
      <div class="txt">${esc(it.texto)}${it.ref ? `<div class="ref">${esc(it.ref)}</div>` : ""}</div>
      <div class="seg" role="group" aria-label="Resultado da pergunta ${num}">${seg}</div>${extra}</div>`;
  }

  function readHeader() {
    const d = state.draft; if (!d) return;
    const g = id => document.getElementById(id);
    if (!g("f-data")) return;
    if (g("f-setor-nome")) d.setorNome = g("f-setor-nome").value;
    d.local = g("f-local").value; d.data = g("f-data").value; d.responsavel = g("f-resp").value; d.acompanhante = g("f-acomp").value; d.observacoes = g("f-obs").value;
  }

  function bindNova() {
    const f = document.getElementById("f-insp"); if (!f) return;
    f.addEventListener("input", e => {
      const k = e.target.dataset.k, i = e.target.dataset.i;
      if (k != null && i != null) state.draft.itens[+i][k] = e.target.value;
    });
    f.addEventListener("submit", async e => {
      e.preventDefault(); readHeader();
      const d = state.draft, msg = document.getElementById("f-msg");
      const fail = (t, id) => { msg.textContent = t; msg.style.color = "var(--bad)"; if (id) document.getElementById(id)?.focus(); };
      if (d.generico && !d.setorNome.trim()) return fail("Digite o nome do setor.", "f-setor-nome");
      if (!d.data) return fail("Preencha a data.", "f-data");
      if (!d.responsavel.trim()) return fail("Preencha o TST / inspetor.", "f-resp");
      const faltando = d.itens.findIndex(i => !i.status);
      if (faltando >= 0) { fail(`Responda a pergunta "${d.itens[faltando].texto.slice(0, 50)}…"`); document.getElementById("item-" + faltando).scrollIntoView({ block: "center" }); return; }
      const insp = { id: uid(), ...structuredClone(d), setorNome: d.setorNome.trim(), criadoEm: Date.now(), itens: d.itens.map(i => ({ ...i, corrigido: false, corrigidoEm: "" })) };
      delete insp.generico;
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Salvando…";
      try { await saveInsp(insp); state.draft = null; toast("Inspeção salva"); go("detalhe", { selected: insp.id }); }
      catch (err) {
        btn.disabled = false; btn.textContent = "Salvar inspeção";
        fail(err?.code === "invalid_argument" ? "Seu acesso não permite salvar inspeções nesta página." : err?.code === "quota_exceeded" ? "O banco atingiu o limite de registros. Exclua inspeções antigas para continuar." : "Não foi possível salvar agora. Tente novamente em instantes.");
      }
    });
  }

  // ---------- Setores e perguntas ----------
  function viewSetores() {
    if (!state.cfgDraft) state.cfgDraft = structuredClone(state.config);
    const cfg = state.cfgDraft;
    if (!cfg.setores.find(s => s.id === state.cfgSetor)) state.cfgSetor = cfg.setores[0]?.id;
    if (!cfg.secoes.find(s => s.id === state.cfgSecao)) state.cfgSecao = cfg.secoes[0]?.id;
    const st = cfg.setores.find(s => s.id === state.cfgSetor);
    const sec = cfg.secoes.find(s => s.id === state.cfgSecao);
    const ro = !state.canWrite;
    return `<h2>Setores e perguntas</h2><p class="lead">Cada setor recebe só as seções que se aplicam a ele. As mudanças valem para as próximas inspeções; as já registradas mantêm suas perguntas.</p>
    <div class="stack">
      <div class="chips">${cfg.setores.map(s => `<button type="button" class="pill" data-act="cfg-setor" data-id="${esc(s.id)}" aria-pressed="${s.id === state.cfgSetor}">${esc(s.nome)} <span class="c">(${countQ(cfg, s)})</span></button>`).join("")}
        ${ro ? "" : `<button type="button" class="pill" data-act="cfg-novo-setor">+ Novo setor</button>`}</div>
      ${st ? `<section class="panel stack" style="gap:14px">
        <div class="fields">
          <label class="field span2"><span class="label">Nome do setor</span><input id="cfg-nome" data-cfg="nome" value="${esc(st.nome)}" ${ro ? "disabled" : ""}></label>
          <label class="inline-check" style="align-self:end"><input type="checkbox" id="cfg-generico" data-cfg="generico" ${st.generico ? "checked" : ""} ${ro ? "disabled" : ""}><span>O TST digita o nome do setor ao abrir a inspeção (setor genérico)</span></label>
        </div>
        <div><h3>Seções de perguntas</h3><p class="lead" style="margin:2px 0 10px">Marque as seções que se aplicam a este setor.</p>
          <div class="check-grid">${cfg.secoes.map(s => `<label class="check-card"><input type="checkbox" data-cfg="secao" value="${esc(s.id)}" ${st.secoes.includes(s.id) ? "checked" : ""} ${ro ? "disabled" : ""}>
            <span class="nm">${esc(s.nome)}</span><span class="sub">${s.perguntas.length} perguntas${s.nr ? " · " + esc(s.nr) : ""}</span></label>`).join("")}</div></div>
        ${ro ? "" : (state.cfgConfirmDel ? `<div class="confirm">Excluir o setor "${esc(st.nome)}"? As inspeções já registradas não são apagadas. <button class="btn small danger" data-act="cfg-del-sim">Excluir</button><button class="btn small" data-act="cfg-del-nao">Cancelar</button></div>`
          : `<div><button type="button" class="btn danger small" data-act="cfg-del">Excluir setor</button></div>`)}
      </section>` : ""}
      <section class="panel stack" style="gap:12px">
        <div class="panel-head" style="margin:0"><h3>Perguntas das seções</h3>${ro ? "" : `<button type="button" class="btn small" data-act="cfg-nova-secao">+ Nova seção</button>`}</div>
        <div class="chips">${cfg.secoes.map(s => `<button type="button" class="pill" data-act="cfg-secao" data-id="${esc(s.id)}" aria-pressed="${s.id === state.cfgSecao}">${esc(s.nome)} <span class="c">(${s.perguntas.length})</span></button>`).join("")}</div>
        ${sec ? `<div class="fields">
          <label class="field span2"><span class="label">Nome da seção</span><input id="sec-nome" data-sec="nome" value="${esc(sec.nome)}" ${ro ? "disabled" : ""}></label>
          <label class="field"><span class="label">Norma</span><input id="sec-nr" data-sec="nr" value="${esc(sec.nr)}" placeholder="Ex.: NR-12" ${ro ? "disabled" : ""}></label>
        </div>
        <div>${sec.perguntas.map((p, i) => `<div class="q-row"><span class="n">${i + 1}</span>
          <input id="q-t-${i}" data-q="texto" data-i="${i}" value="${esc(p.texto)}" ${ro ? "disabled" : ""}>
          <input class="ref-in" id="q-r-${i}" data-q="ref" data-i="${i}" value="${esc(p.ref)}" placeholder="Item da NR" ${ro ? "disabled" : ""}>
          ${ro ? "" : `<button type="button" class="btn small danger" data-act="q-del" data-i="${i}" aria-label="Remover pergunta ${i + 1}">Remover</button>`}</div>`).join("")}</div>
        ${ro ? "" : `<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="q-nova" placeholder="Nova pergunta para a seção ${esc(sec.nome)}" style="flex:1 1 260px;width:auto"><button type="button" class="btn" data-act="q-add">Adicionar pergunta</button></div>`}` : ""}
      </section>
      ${ro ? "" : `<div class="save-bar"><button type="button" class="btn primary" data-act="cfg-salvar" ${state.cfgDirty ? "" : "disabled"}>Salvar alterações</button>
        <button type="button" class="btn" data-act="cfg-descartar" ${state.cfgDirty ? "" : "disabled"}>Descartar</button>
        <span class="label">${state.cfgDirty ? "Há alterações não salvas" : "Tudo salvo"}</span>
        <button type="button" class="btn small" data-act="cfg-padrao" style="margin-left:auto">Restaurar padrão</button></div>`}
    </div>`;
  }
  function cfgChanged(rerender = true) {
    state.cfgDirty = true;
    if (rerender) { const y = window.scrollY; render(); window.scrollTo(0, y); }
    else document.querySelectorAll('[data-act="cfg-salvar"],[data-act="cfg-descartar"]').forEach(b => b.disabled = false);
  }

  // ---------- Histórico ----------
  function filtered() {
    const qq = state.filtro.q.trim().toLowerCase();
    return state.inspecoes.filter(i => (!state.filtro.setor || setorLabel(i) === state.filtro.setor) &&
      (!qq || [setorLabel(i), i.local, i.responsavel].join(" ").toLowerCase().includes(qq)));
  }
  function viewHistorico() {
    const lead = `<h2>Histórico</h2><p class="lead">Todas as inspeções registradas. Clique em uma linha para ver o relatório.</p>`;
    if (!state.inspecoes.length) return lead + emptyState("Nenhuma inspeção ainda", "Registre a primeira inspeção para montar o histórico.");
    const setores = [...new Set(state.inspecoes.map(setorLabel))].sort();
    return lead + `<div class="filters">
        <input id="h-q" type="search" placeholder="Buscar por setor, local ou TST" value="${esc(state.filtro.q)}">
        <select id="h-setor"><option value="">Todos os setores</option>${setores.map(s => `<option ${state.filtro.setor === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <button class="btn" data-act="csv">Exportar CSV</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Data</th><th>Setor</th><th class="hide-sm">Local</th><th class="hide-sm">TST</th><th>Conformidade</th><th>NC abertas</th></tr></thead>
      <tbody id="h-body">${histRows(filtered())}</tbody></table></div>
      <div id="copy-area"></div>`;
  }
  function histRows(L) {
    if (!L.length) return `<tr><td colspan="6" class="empty">Nenhuma inspeção corresponde à busca.</td></tr>`;
    return L.map(i => { const s = score(i); const ab = i.itens.filter(x => x.status === "NC" && !x.corrigido).length;
      return `<tr data-act="abrir" data-id="${i.id}" tabindex="0"><td class="num">${fmtDate(i.data)}</td><td>${esc(setorLabel(i))}${i.exemplo ? ` <span class="chip ex">exemplo</span>` : ""}</td>
      <td class="hide-sm">${esc(i.local || "—")}</td><td class="hide-sm">${esc(i.responsavel)}</td><td>${pctChip(s.pct)}</td><td class="num">${ab ? `<span class="chip bad">${ab}</span>` : "0"}</td></tr>`; }).join("");
  }

  // ---------- Detalhe ----------
  function viewDetalhe() {
    const i = state.inspecoes.find(x => x.id === state.selected);
    if (!i) return `<h2>Inspeção não encontrada</h2><p class="lead">Ela pode ter sido excluída.</p><button class="btn" data-act="voltar">Voltar ao histórico</button>`;
    const s = score(i);
    let last = null;
    const itens = i.itens.map((it, idx) => {
      const head = it.secao && it.secao !== last ? `<div class="sec-head"><h3>${esc(it.secao)}</h3><span class="label">${esc(it.nr || "")}</span></div>` : "";
      last = it.secao || last;
      return head + `<div class="d-item"><span class="n label" style="padding-top:2px">${idx + 1}</span>
        <div>${esc(it.texto)}${it.ref ? ` <span class="label">${esc(it.ref)}</span>` : ""}</div>
        <span class="chip ${it.status === "C" ? "ok" : it.status === "NC" ? "bad" : "na"}">${{ C: "Conforme", NC: "Não conforme", NA: "N/A" }[it.status]}</span>
        ${it.obs ? `<div class="note">${esc(it.obs)}</div>` : ""}
        ${it.status === "NC" ? `<div class="act ${it.corrigido ? "done" : ""}">
          <span><span class="label">Ação</span> ${esc(it.acao || "não definida")}</span>
          ${it.respAcao ? `<span><span class="label">Resp.</span> ${esc(it.respAcao)}</span>` : ""}
          <span><span class="label">Prazo</span> ${fmtDate(it.prazo)}</span>
          ${it.corrigido ? `<span class="chip ok">Corrigido em ${fmtDate(it.corrigidoEm)}</span>${state.canWrite ? `<button class="btn small" data-act="reabrir" data-idx="${idx}">Reabrir</button>` : ""}`
            : state.canWrite ? `<button class="btn small" data-act="corrigir" data-idx="${idx}">Marcar como corrigido</button>` : `<span class="chip bad">Em aberto</span>`}
        </div>` : ""}</div>`;
    }).join("");
    return `<div class="stack">
      <div><button class="btn small" data-act="voltar">← Histórico</button></div>
      <section class="panel">
        <div class="detail-head">
          <div style="min-width:0"><span class="label">Setor</span><h2 style="margin-top:4px">${esc(setorLabel(i))}</h2>${i.exemplo ? `<span class="chip ex">registro de exemplo</span>` : ""}</div>
          <div style="text-align:right"><div class="score" style="color:${pctColor(s.pct)}">${s.pct ?? "—"}${s.pct != null ? "%" : ""}</div><span class="label">conformidade</span></div>
        </div>
        <div class="meta">
          <div><span class="label">Data</span><b>${fmtDate(i.data)}</b></div>
          <div><span class="label">Local / área</span><b>${esc(i.local || "—")}</b></div>
          <div><span class="label">TST / inspetor</span><b>${esc(i.responsavel)}</b></div>
          <div><span class="label">Acompanhante</span><b>${esc(i.acompanhante || "—")}</b></div>
          <div><span class="label">Resultado</span><b><span class="chip ok">${s.c} C</span> <span class="chip bad">${s.nc} NC</span> <span class="chip na">${s.na} N/A</span></b></div>
        </div>
        ${i.observacoes ? `<p style="margin:16px 0 0;max-width:65ch"><span class="label">Observações gerais</span><br>${esc(i.observacoes)}</p>` : ""}
      </section>
      <section class="panel">${itens}</section>
      <div class="row-actions">
        <button class="btn" data-act="relatorio">Baixar relatório (HTML)</button>
        <button class="btn" data-act="csv-one">Exportar CSV</button>
        ${i.setorId && state.config.setores.some(s => s.id === i.setorId) ? `<button class="btn" data-act="duplicar">Nova inspeção neste setor</button>` : ""}
        ${state.canWrite ? (state.confirmDelete
          ? `<div class="confirm">Excluir esta inspeção definitivamente? <button class="btn small danger" data-act="excluir-sim">Excluir</button><button class="btn small" data-act="excluir-nao">Cancelar</button></div>`
          : `<button class="btn danger" data-act="excluir">Excluir</button>`) : ""}
      </div>
      <div id="copy-area"></div>
    </div>`;
  }

  // ---------- Exportação ----------
  function toCSV(list) {
    const head = ["Data", "Setor", "Local", "TST", "Seção", "Norma", "Nº", "Pergunta", "Ref.", "Resultado", "Observação", "Ação corretiva", "Responsável ação", "Prazo", "Corrigido"];
    const qq = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [head.map(qq).join(";")];
    for (const i of list) i.itens.forEach((it, n) => rows.push([fmtDate(i.data), setorLabel(i), i.local, i.responsavel, it.secao, it.nr || i.nr, n + 1, it.texto, it.ref,
      { C: "Conforme", NC: "Não conforme", NA: "N/A" }[it.status], it.obs, it.acao, it.respAcao, it.prazo ? fmtDate(it.prazo) : "", it.status === "NC" ? (it.corrigido ? "Sim " + fmtDate(it.corrigidoEm) : "Não") : ""].map(qq).join(";")));
    return "﻿" + rows.join("\r\n");
  }
  function reportHTML(i) {
    const s = score(i), lab = { C: "Conforme", NC: "Não conforme", NA: "N/A" };
    let last = null;
    const rows = i.itens.map((it, n) => {
      const h = it.secao && it.secao !== last ? `<tr><th colspan="5" style="background:#1d211c;color:#fff">${esc(it.secao)}${it.nr ? " · " + esc(it.nr) : ""}</th></tr>` : "";
      last = it.secao || last;
      return h + `<tr><td>${n + 1}</td><td>${esc(it.texto)}${it.ref ? ` <small>(${esc(it.ref)})</small>` : ""}</td><td class="${it.status}">${lab[it.status]}</td><td>${esc(it.obs)}</td><td>${it.status === "NC" ? `${esc(it.acao)}${it.respAcao ? " / " + esc(it.respAcao) : ""}${it.prazo ? " / " + fmtDate(it.prazo) : ""}${it.corrigido ? " — corrigido em " + fmtDate(it.corrigidoEm) : ""}` : ""}</td></tr>`;
    }).join("");
    return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Inspeção – ${esc(setorLabel(i))} – ${fmtDate(i.data)}</title>
<style>body{font-family:Arial,sans-serif;color:#1d211c;max-width:900px;margin:24px auto;padding:0 16px;font-size:13px}h1{font-size:20px;margin:0}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #bbb;padding:6px;text-align:left;vertical-align:top}th{background:#eee}.C{color:#1f7a3d}.NC{color:#c0281e;font-weight:bold}.meta td{border:0;padding:2px 12px 2px 0}.sig{display:flex;gap:48px;margin-top:48px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}</style></head><body>
<div style="height:6px;background:repeating-linear-gradient(-45deg,#e8b500 0 12px,#1d211c 12px 24px)"></div>
<h1 style="margin-top:12px">Relatório de Inspeção de Segurança</h1><p>Setor: <b>${esc(setorLabel(i))}</b></p>
<table class="meta"><tr><td><b>Local:</b> ${esc(i.local || "—")}</td><td><b>Data:</b> ${fmtDate(i.data)}</td><td><b>Conformidade:</b> ${s.pct ?? "—"}% (${s.c} C · ${s.nc} NC · ${s.na} N/A)</td></tr>
<tr><td><b>TST:</b> ${esc(i.responsavel)}</td><td><b>Acompanhante:</b> ${esc(i.acompanhante || "—")}</td><td></td></tr></table>
<table><thead><tr><th>Nº</th><th>Pergunta</th><th>Resultado</th><th>Observação</th><th>Ação corretiva / Resp. / Prazo</th></tr></thead><tbody>${rows}</tbody></table>
${i.observacoes ? `<p><b>Observações gerais:</b> ${esc(i.observacoes)}</p>` : ""}
<div class="sig"><div>${esc(i.responsavel)}<br>TST / Inspetor</div><div>${esc(i.acompanhante || "")}<br>Responsável do setor</div></div></body></html>`;
  }
  async function offer(filename, data) {
    if (downloads) {
      try { await downloads.save({ filename, data }); toast("Arquivo salvo"); return; }
      catch (e) { if (e?.code === "declined") return; }
    }
    if (!window.claude) {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "text/html;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Arquivo baixado"); return;
    }
    const area = document.getElementById("copy-area");
    if (area) {
      area.innerHTML = `<div class="panel" style="margin-top:12px"><div class="panel-head"><h3>Copiar conteúdo</h3><button class="btn small" data-act="copiar">Copiar</button></div>
        <p class="lead" style="margin:0 0 8px">O download não está disponível nesta visualização. Copie o conteúdo abaixo e salve como <b>${esc(filename)}</b>.</p><textarea class="copybox" id="copy-text" readonly></textarea></div>`;
      document.getElementById("copy-text").value = data;
    }
  }
  const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 40);

  // ---------- Ações ----------
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-act], [data-setor], .seg button");
    if (!el) return;
    if (el.dataset.setor && !el.dataset.act) {
      readHeader();
      const old = state.draft; state.draft = newDraft(el.dataset.setor);
      if (old) Object.assign(state.draft, { local: old.local, responsavel: old.responsavel, data: old.data, acompanhante: old.acompanhante, observacoes: old.observacoes });
      render(); return;
    }
    if (el.matches(".seg button")) {
      readHeader();
      const it = state.draft.itens[+el.dataset.i]; it.status = it.status === el.dataset.v ? "" : el.dataset.v;
      const y = window.scrollY; render(); window.scrollTo(0, y);
      if (it.status === "NC") document.getElementById("nc-obs-" + el.dataset.i)?.focus({ preventScroll: true });
      return;
    }
    const act = el.dataset.act;
    const cur = () => state.inspecoes.find(x => x.id === state.selected);
    const cfg = state.cfgDraft;
    const keepY = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
    switch (act) {
      case "nova": go("nova"); break;
      case "abrir": go("detalhe", { selected: el.dataset.id }); break;
      case "voltar": go("historico"); break;
      case "descartar": state.draft = null; render(); break;
      case "sec-c": readHeader(); state.draft.itens.forEach(i => { if (i.secaoId === el.dataset.sec && !i.status) i.status = "C"; }); keepY(); break;
      case "corrigir": case "reabrir": {
        const i = structuredClone(cur()); const it = i.itens[+el.dataset.idx];
        it.corrigido = act === "corrigir"; it.corrigidoEm = it.corrigido ? today() : "";
        el.disabled = true;
        try { await saveInsp(i); toast(it.corrigido ? "Ação marcada como corrigida" : "Pendência reaberta"); } catch { el.disabled = false; toast("Não foi possível atualizar. Tente novamente."); }
        break;
      }
      case "excluir": state.confirmDelete = true; render(); break;
      case "excluir-nao": state.confirmDelete = false; render(); break;
      case "excluir-sim": try { await deleteInsp(state.selected); toast("Inspeção excluída"); go("historico"); } catch { toast("Não foi possível excluir. Tente novamente."); } break;
      case "duplicar": { const i = cur(); state.draft = newDraft(i.setorId); Object.assign(state.draft, { setorNome: i.setorNome, local: i.local, responsavel: i.responsavel, acompanhante: i.acompanhante }); go("nova"); break; }
      case "relatorio": { const i = cur(); offer(`inspecao-${slug(setorLabel(i))}-${i.data}.html`, reportHTML(i)); break; }
      case "csv-one": { const i = cur(); offer(`inspecao-${slug(setorLabel(i))}-${i.data}.csv`, toCSV([i])); break; }
      case "csv": offer(`inspecoes-${today()}.csv`, toCSV(filtered())); break;
      case "copiar": {
        const ta = document.getElementById("copy-text");
        try { await navigator.clipboard.writeText(ta.value); toast("Copiado"); } catch { ta.select(); toast("Texto selecionado. Use Ctrl+C para copiar."); }
        break;
      }
      // Configuração
      case "cfg-setor": state.cfgSetor = el.dataset.id; state.cfgConfirmDel = false; keepY(); break;
      case "cfg-secao": state.cfgSecao = el.dataset.id; keepY(); break;
      case "cfg-novo-setor": { const id = "s-" + uid(); cfg.setores.push({ id, nome: "Novo setor", generico: false, secoes: [] }); state.cfgSetor = id; cfgChanged(); document.getElementById("cfg-nome")?.select(); break; }
      case "cfg-nova-secao": { const id = "sec-" + uid(); cfg.secoes.push({ id, nome: "Nova seção", nr: "", perguntas: [] }); state.cfgSecao = id; cfgChanged(); document.getElementById("sec-nome")?.select(); break; }
      case "cfg-del": state.cfgConfirmDel = true; keepY(); break;
      case "cfg-del-nao": state.cfgConfirmDel = false; keepY(); break;
      case "cfg-del-sim": cfg.setores = cfg.setores.filter(s => s.id !== state.cfgSetor); state.cfgConfirmDel = false; state.cfgSetor = cfg.setores[0]?.id; cfgChanged(); break;
      case "q-del": cfg.secoes.find(s => s.id === state.cfgSecao).perguntas.splice(+el.dataset.i, 1); cfgChanged(); break;
      case "q-add": { const inp = document.getElementById("q-nova"); const t = inp.value.trim(); if (!t) { inp.focus(); break; }
        cfg.secoes.find(s => s.id === state.cfgSecao).perguntas.push({ texto: t, ref: "" }); cfgChanged(); document.getElementById("q-nova")?.focus(); break; }
      case "cfg-padrao": state.cfgDraft = { secoes: structuredClone(DEFAULT_SECOES), setores: structuredClone(DEFAULT_SETORES) }; cfgChanged(); toast("Padrão carregado. Clique em Salvar alterações para aplicar."); break;
      case "cfg-descartar": state.cfgDraft = null; state.cfgDirty = false; keepY(); break;
      case "cfg-salvar": {
        const usados = new Set(cfg.setores.flatMap(s => s.secoes));
        cfg.secoes.forEach(s => s.perguntas = s.perguntas.filter(p => p.texto.trim()));
        el.disabled = true;
        try { await saveConfig(structuredClone(cfg)); state.config = structuredClone(cfg); state.cfgDirty = false; state.cfgDraft = null; toast("Setores e perguntas salvos"); keepY(); }
        catch (err) { el.disabled = false; toast(err?.code === "invalid_argument" ? "Seu acesso não permite alterar os setores." : "Não foi possível salvar. Tente novamente."); }
        void usados; break;
      }
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
    if (e.key === "Enter" && e.target.id === "q-nova") { e.preventDefault(); document.querySelector('[data-act="q-add"]')?.click(); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "h-q" || t.id === "h-setor") {
      state.filtro.q = document.getElementById("h-q").value; state.filtro.setor = document.getElementById("h-setor").value;
      document.getElementById("h-body").innerHTML = histRows(filtered()); return;
    }
    if (state.view !== "setores" || !state.cfgDraft) return;
    const st = state.cfgDraft.setores.find(s => s.id === state.cfgSetor);
    const sec = state.cfgDraft.secoes.find(s => s.id === state.cfgSecao);
    if (t.dataset.cfg === "nome") { st.nome = t.value; cfgChanged(false); }
    else if (t.dataset.cfg === "generico") { st.generico = t.checked; cfgChanged(false); }
    else if (t.dataset.cfg === "secao") {
      const ids = [...document.querySelectorAll('[data-cfg="secao"]:checked')].map(x => x.value);
      st.secoes = state.cfgDraft.secoes.map(s => s.id).filter(id => ids.includes(id)); cfgChanged();
    }
    else if (t.dataset.sec) { sec[t.dataset.sec] = t.value; cfgChanged(false); }
    else if (t.dataset.q) { sec.perguntas[+t.dataset.i][t.dataset.q] = t.value; cfgChanged(false); }
  });

  try { const h = location.hash.slice(1); if (["painel", "nova", "historico", "setores"].includes(h)) state.view = h; } catch {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  initStore();
})();
</script>

</body>
</html>
