<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Inspeção de Segurança</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prancheta de campo. Barra superior com abas, conteúdo em coluna única de até 1040px; faixas de sinalização NR-26 (amarelo/preto) só no cabeçalho. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #e9ebe6;
  --fg: #1d211c;
  --muted: #5d645a;
  --line: #d3d7cf;
  --accent: #e8b500;      /* amarelo segurança */
  --accent-ink: #1d211c;
  --ok: #1f7a3d;
  --ok-bg: #e2f2e6;
  --bad: #c0281e;
  --bad-bg: #fbe5e2;
  --na: #6b7068;
  --na-bg: #ebece8;
  --warn: #9a6a00;
  --warn-bg: #fdf1cf;
  --focus: #1b5fd1;
  --s-reg: #2f6fb5; --s-done: #1f8a45; --s-open: #d49b00; --s-late: #c0281e;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151814; --surface: #1e221d; --surface-2: #272c26; --fg: #e9ece6; --muted: #a2a99e; --line: #353b33;
    --accent: #f2c21b; --accent-ink: #151814;
    --ok: #5cc27e; --ok-bg: #1b3323; --bad: #ff7a6e; --bad-bg: #3d1d1a; --na: #a2a99e; --na-bg: #2b302a;
    --warn: #f2c21b; --warn-bg: #3a3116; --focus: #7aa8ff; --s-reg: #4f8fdc; --s-done: #3fa865; --s-open: #e0b020; --s-late: #ff7a6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151814; --surface: #1e221d; --surface-2: #272c26; --fg: #e9ece6; --muted: #a2a99e; --line: #353b33;
  --accent: #f2c21b; --accent-ink: #151814;
  --ok: #5cc27e; --ok-bg: #1b3323; --bad: #ff7a6e; --bad-bg: #3d1d1a; --na: #a2a99e; --na-bg: #2b302a;
  --warn: #f2c21b; --warn-bg: #3a3116; --focus: #7aa8ff; --s-reg: #4f8fdc; --s-done: #3fa865; --s-open: #e0b020; --s-late: #ff7a6e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabeçalho */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fg); color: var(--bg); }
.hazard { height: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, var(--fg) 12px 24px); }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand small { display: block; font-family: var(--f-mono); font-size: 11px; opacity: .7; letter-spacing: .04em; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs button { font: 600 14px var(--f-body); background: transparent; color: var(--bg); border: 1px solid transparent; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
nav.tabs button:hover { border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
nav.tabs button[hidden] { display: none; }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

main { padding-block: 24px 64px; }
.store-note { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 30px; text-transform: uppercase; letter-spacing: .01em; margin: 0 0 4px; line-height: 1.05; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 65ch; }
.label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 20px; }

/* Painel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .num { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.alert .num { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--f-body); color: var(--ok); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s ease-in-out infinite; }
.live.off { color: var(--muted); } .live.off::before { background: var(--muted); animation: none; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.feed .day { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 0 2px; }
.feed .nc-row .when { font: 500 12px var(--f-mono, monospace); color: var(--muted); white-space: nowrap; }
.extra-add { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.nc-list { display: flex; flex-direction: column; gap: 0; }
.nc-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.nc-row:first-child { border-top: 0; }
.nc-row .bar { align-self: stretch; background: var(--bad); border-radius: 2px; }
.nc-row.late .bar { background: var(--bad); }
.nc-row.ontime .bar { background: var(--accent); }
.nc-row .t { font-weight: 500; }
.nc-row .m { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.barrow { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 4px 10px; align-items: center; font-size: 13px; }
.barrow .track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.barrow .fill { height: 100%; border-radius: 4px; }
.barrow .pct { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Botões e campos */
.btn { font: 600 14px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.span2 { grid-column: span 2; }
.field.span3 { grid-column: 1 / -1; }
input, select, textarea { font: 400 15px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 60px; }

/* Seleção de checklist */
.cl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cl-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; color: var(--fg); font: inherit; display: flex; flex-direction: column; gap: 4px; }
.cl-card:hover { border-color: var(--muted); }
.cl-card[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: var(--surface-2); }
.cl-card .nr { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cl-card .nm { font-weight: 600; }

/* Itens do checklist */
.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.item .txt { padding-top: 5px; }
.item .ref { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 13px var(--f-body); border: 0; background: var(--surface); color: var(--muted); padding: 7px 11px; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"][data-v="C"] { background: var(--ok); color: #fff; }
.seg button[aria-pressed="true"][data-v="NC"] { background: var(--bad); color: #fff; }
.seg button[aria-pressed="true"][data-v="NA"] { background: var(--na); color: var(--surface); }
.item .extra { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; background: var(--bad-bg); border-radius: 6px; padding: 10px 12px; }
.item .extra .field.span3 { grid-column: 1 / -1; }
.item .obs { grid-column: 2 / -1; }
.progress { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--fg); }
.sticky-actions { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; z-index: 3; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-body); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.na { background: var(--na-bg); color: var(--na); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.open { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.chip.rep { background: color-mix(in srgb, var(--s-reg) 16%, transparent); color: var(--s-reg); }
.repro-h { font-size: 12px; color: var(--muted); }
.mon-table td { vertical-align: top; }
@media (max-width: 640px) {
  .mon-table thead { display: none; }
  .mon-table, .mon-table tbody, .mon-table tr, .mon-table td { display: block; width: 100%; }
  .mon-table tr { border-top: 1px solid var(--line); padding: 10px 0; }
  .mon-table td { border: 0; padding: 3px 0; }
  .mon-table td[data-l] { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .mon-table td[data-l]::before { content: attr(data-l); font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); min-width: 130px; }
} .mon-table .acts { white-space: nowrap; display: flex; gap: 6px; flex-wrap: wrap; }
.chip.crit { background: var(--bad); color: var(--surface); }
.crit-box { border: 2px solid var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.crit-box h4 { margin: 0; color: var(--bad); font-size: 14px; }
.regra { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 6px 10px; }
.check-line { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.check-line input { margin-top: 3px; width: auto; flex: none; padding: 0; }
.check-line span { flex: 1; }
.fotos-extra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fotos-extra figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
.fotos-extra img { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.acao-row .acao-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; grid-column: 1 / -1; }
.acao-row select, .acao-row input[disabled] { min-width: 0; }
.pend-box { border-left: 3px solid var(--warn); padding: 6px 10px; background: var(--warn-bg); border-radius: 4px; font-size: 13px; }
.hist { font-size: 12.5px; display: grid; gap: 4px; }
.hist div { border-bottom: 1px dashed var(--line); padding: 4px 0; }
.chip.ex { background: var(--surface-2); color: var(--muted); font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }

/* Histórico */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters input { flex: 1 1 220px; width: auto; }
.filters select { width: auto; flex: 0 1 220px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Detalhe */
.detail-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 16px; margin-top: 12px; }
.meta div { display: flex; flex-direction: column; min-width: 0; }
.meta b { font-weight: 500; overflow-wrap: anywhere; }
.score { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.d-item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.d-item:first-child { border-top: 0; }
.d-item .note { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
.d-item .act { grid-column: 2 / -1; font-size: 13px; background: var(--bad-bg); border-radius: 6px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.d-item .act.done { background: var(--ok-bg); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bad-bg); color: var(--bad); padding: 8px 12px; border-radius: 6px; font-size: 14px; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h3 { color: var(--fg); margin-bottom: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.copybox { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: 12px; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .field.span2 { grid-column: auto; }
  .item { grid-template-columns: 26px minmax(0, 1fr); }
  .item .seg { grid-column: 2; justify-self: start; }
  .item .extra { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
}

/* Painel de ações */
.kpis7 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.kpis7 .num { font-size: 32px; }
.filters .field { flex: 1 1 200px; }
.filters .field select { width: 100%; flex: none; }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 600px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { font: 11px var(--f-mono); fill: var(--muted); }
.chart .val { font: 600 13px var(--f-mono); fill: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htrack { height: 12px; }
.hstack { display: flex; gap: 2px; height: 100%; min-width: 4px; }
.hstack i { display: block; height: 100%; border-radius: 3px; min-width: 3px; }
.hv { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tv { margin-top: 8px; font-size: 13px; }
.tv summary { cursor: pointer; color: var(--muted); }
.tv .table-wrap { margin-top: 8px; }
.grid2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 760px) { .grid2.even { grid-template-columns: minmax(0, 1fr); } .hrow { grid-template-columns: minmax(0, 1fr) auto; } .hrow .htrack { grid-column: 1 / -1; grid-row: 2; } }

/* Finalização da ação */
.fin { flex-basis: 100%; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border-radius: 6px; padding: 10px 12px; margin-top: 4px; }
.fin .m { font-size: 12px; color: var(--muted); }
.fin-form .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.evid { max-width: 260px; max-height: 200px; border-radius: 6px; object-fit: cover; }
@media (max-width: 760px) { .fin-form .fields { grid-template-columns: minmax(0, 1fr); } }

/* Foto e análise do Claude */
.foto-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.foto-empty { width: 120px; height: 84px; border: 1px dashed var(--bad); border-radius: 6px; display: grid; place-items: center; font-size: 12px; color: var(--bad); background: var(--surface); }
.ai-note { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 6px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ai-note.busy { color: var(--fg); }
.ai-note.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--fg); animation: spin 1s linear infinite; }
.ai-note.err { color: var(--bad); }
.ai-text { font-size: 14px; background: var(--surface); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
.nc-info { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.nc-info .m { color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ai-note.busy::before { animation: none; } }
.d-item .act { white-space: pre-wrap; }

.extra > .span3 { grid-column: 1 / -1; }
.acoes { display: grid; gap: 8px; }
.acao-row { display: grid; grid-template-columns: 64px minmax(0, 2fr) minmax(0, 1fr) 160px auto; gap: 8px; align-items: start; }

.perguntas { background: var(--warn-bg); border-radius: 6px; padding: 10px 12px; gap: 8px; }
.perguntas .field > span { font-size: 14px; }

/* Assinatura */
.sig-pad { display: block; width: 100%; max-width: 100%; aspect-ratio: 900 / 240; background: #fff; border: 1px dashed var(--muted); border-radius: 6px; touch-action: none; cursor: crosshair; }
.sig-img { display: block; max-width: 100%; height: 110px; object-fit: contain; background: #fff; border-radius: 6px; }
.sig-line { border-top: 1px solid var(--fg); margin-top: 6px; padding-top: 4px; font-size: 13px; color: var(--muted); max-width: 420px; }

/* Setores e perguntas */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font: 500 14px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.pill:hover { border-color: var(--muted); }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill .c { font-family: var(--f-mono); font-size: 12px; opacity: .7; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.check-card { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px; align-items: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
.check-card input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--bad); }
.check-card .nm { font-weight: 600; }
.vis-sec { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; background: var(--surface-2); }
.vis-sec summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.vis-q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.vis-q input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ok); }
.check-card .sub { grid-column: 2; font-size: 12px; color: var(--muted); }
.inline-check { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.inline-check input { width: 18px; height: 18px; flex: none; margin-top: 2px; accent-color: var(--bad); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 18px 0 8px; border-bottom: 2px solid var(--fg); }
.sec-head:first-child { padding-top: 0; }
.q-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.q-row:first-child { border-top: 0; }
.q-row .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.save-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 3; }
@media (max-width: 760px) { .q-row { grid-template-columns: 24px minmax(0, 1fr); } .q-row .ref-in, .q-row .btn { grid-column: 2; justify-self: start; } }

  // central de alertas internos (diretriz 17)

  const endOfMonth = k => { const [y, m] = k.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };
  function monthRange() {
    const t = today(), cur = t.slice(0, 7), p = state.pf.periodo;

    if (p === "ano") start = t.slice(0, 4) + "-01";

  function svgBars(months, series) {
    const W = 900, H = 220, L = 30, B = 24, T = 10, max = Math.max(1, ...series.flatMap(s => s.values));
    const step = Math.max(1, Math.ceil(max / 4)), top = step * 4, y = v => T + (H - T - B) * (1 - v / top);
    const gw = (W - L - 6) / months.length, bw = Math.max(2, Math.min(16, (gw - 6) / series.length - 2));
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="tick">${v}</text>`;
    months.forEach((k, i) => {
      const cx = L + gw * i + gw / 2, x0 = cx - (series.length * (bw + 2) - 2) / 2;
      series.forEach((s, j) => { const v = s.values[i]; if (!v) return; const yy = y(v), h = y(0) - yy;
        g += `<path d="M${x0 + j * (bw + 2)},${y(0)} v${-(h - 3)} q0,-3 3,-3 h${bw - 6} q3,0 3,3 v${h - 3} z" fill="${s.color}"><title>${mLabel(k)} · ${s.name}: ${v}</title></path>`; });
      const every = Math.ceil(months.length / 8);

  }
  function svgLine(months, values, name) {

    const step = Math.max(1, Math.ceil(max / 4)), top = step * 4, y = v => T + (H - T - B) * (1 - v / top);
    const x = i => months.length === 1 ? (L + W) / 2 : L + 20 + (W - L - 50) * i / (months.length - 1);
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="tick">${v}</text>`;

  // aplica a tabela oficial: Crítico/Alto/Médio recebem o vencimento calculado; Baixo/Insignificante nunca recebem prazo automático

  }
  // ---------- Auditoria (diretriz 18) ----------
  // cada alteração fica no histórico da inspeção: quem (conta), quando, o quê, antes, depois e justificativa
  function audit(insp, op, d = {}) {
    (insp.historico ||= []).push({ ts: Date.now(), uid: state.uid || "", papel: state.isAdmin ? "Administrador" : "TST", op, ...d });
  }
  const nomeConta = u => (u && state.nomes?.[u]) || "";
  const respsUsados = () => [...new Set(state.inspecoes.flatMap(i => i.itens.flatMap(it => acoesDe(it).map(a => (a.resp || "").trim()))).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const locaisNC = i => [...new Set(i.itens.filter(it => it.status === "NC" && it.localNC?.trim()).map(it => it.localNC.trim()))].join("; ") || i.local || "";

  // ---------- TSTs ----------
  async function registrarTst(nome, registro) {
    nome = (nome || "").trim(); registro = (registro || "").trim(); if (!nome) return;
    const eq = structuredClone(state.equipe); eq.tsts ||= [];
    const ex = eq.tsts.find(t => (t.nome || "").trim().toLowerCase() === nome.toLowerCase());
    if (ex && (ex.registro || !registro)) return;
    if (ex) ex.registro = registro; else eq.tsts.push({ nome, registro });
    eq.tsts.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    try { await saveEquipe(eq); if (state.cfgDraft && !state.cfgDirty) state.cfgDraft = null; } catch {}
  }
  function tstList() {
    const m = new Map();
    for (const t of state.equipe.tsts || []) { const n = (t.nome || "").trim(); if (n) m.set(n.toLowerCase(), { nome: n, registro: (t.registro || "").trim() }); }
    for (const i of [...state.inspecoes].reverse()) { const n = (i.responsavel || "").trim(); if (!n) continue; const k = n.toLowerCase();
      if (!m.has(k)) m.set(k, { nome: n, registro: (i.registroTst || "").trim() }); else if (!m.get(k).registro && i.registroTst) m.get(k).registro = i.registroTst.trim(); }
    return [...m.values()].sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  }

  // ---------- Nova inspeção ----------
  function newDraft(setorId) {
    const cfg = state.config, st = cfg.setores.find(s => s.id === setorId);
    const itens = [];
    for (const sid of st.secoes) { const sec = secById(cfg, sid); if (!sec) continue;
      for (const p of sec.perguntas) if (visivel(st, sec.id, p)) itens.push({ secaoId: sec.id, secao: sec.nome, nr: /^NR-\d/.test(p.ref || "") ? p.ref : sec.nr, texto: p.texto, ref: /^NR-\d/.test(p.ref || "") ? "" : p.ref, status: "", obs: "", nota: "", foto: "", analiseFoto: "", enquadramento: "", risco: "", acao: "", prazo: "", respAcao: "" }); }
    const tst = lsGet(LS_TST, {});
    return { setorId, setorNome: st.generico ? "" : st.nome, generico: st.generico, filial: tst.filial || (cfg.filiais?.length === 1 ? cfg.filiais[0] : ""), local: "", responsavel: tst.nome || "", registroTst: tst.registro || "", data: today(), horaInicio: nowHM(), abertoTs: Date.now(), horaFim: "", turno: "", acompanhante: "", cargoLider: "", assinaturaLider: "", assinaturaTst: "", observacoes: "", itens };
  }

  function viewNova() {
    if (!state.canWrite) return `<h2>Nova inspeção</h2><div class="panel empty"><h3>Somente leitura</h3><p>Seu acesso a esta página permite consultar as inspeções, mas não registrar novas.</p></div>`;
    const d = state.draft, cfg = state.config;
    const chips = `<div class="chips">${cfg.setores.map(s => `<button type="button" class="pill" data-setor="${esc(s.id)}" aria-pressed="${d?.setorId === s.id}">${esc(s.nome)} <span class="c">(${countQ(cfg, s)})</span></button>`).join("")}</div>`;
    const rasc = !d ? lsGet(LS_DRAFT, null) : null;
    if (!d) return `<h2>Nova inspeção</h2>${rasc?.itens ? `<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>Rascunho salvo neste aparelho</h3><span class="label">${esc(rasc.setorNome || "Outro setor")} · ${rasc.salvoTs ? new Date(rasc.salvoTs).toLocaleString("pt-BR") : ""}</span></div>
      <p class="lead" style="margin:0 0 10px">Uma inspeção não foi salva. Rascunhos não entram nos indicadores nem no monitoramento.${rasc.semFotos ? " As fotos não couberam na memória do aparelho e precisam ser anexadas de novo." : ""}</p>
      <div class="row-actions"><button class="btn primary" data-act="rasc-continuar">Continuar rascunho</button><button class="btn" data-act="rasc-descartar">Descartar rascunho</button></div></div>` : ""}<p class="lead">Escolha o setor. Cada setor traz só as seções de perguntas que se aplicam a ele.</p>${chips}`;
    d.itens.forEach(it => { if (it.status === "NC") aplicarPrazos(it, d.data || today()); });
    const s = score(d), answered = d.itens.filter(i => i.status).length;
    let lastSec = null, n = 0, secN = 0, mixNr = false;
    const rows = d.itens.map((it, i) => {
      let head = "";
      if (it.secaoId !== lastSec) { lastSec = it.secaoId; secN++; n = 0;
        const total = d.itens.filter(x => x.secaoId === it.secaoId).length;
        const nrs = [...new Set(d.itens.filter(x => x.secaoId === it.secaoId).map(x => x.nr).filter(Boolean))];
        mixNr = nrs.length > 1;
        head = `<div class="sec-head"><h3>${esc(it.secao)}</h3><span class="label">${esc(nrs.join(" / "))}${nrs.length ? " · " : ""}${it.extra ? `${total} ${total === 1 ? "apontamento" : "apontamentos"}` : `${total} perguntas <button type="button" class="btn small" data-act="sec-c" data-sec="${esc(it.secaoId)}" style="margin-left:8px">Pendentes = C</button>`}</span></div>`; }
      if (!(it.ocorrencia > 1)) n++;
      return head + itemRow(it, i, (it.extra ? `E${n}` : `${secN}.${n}`) + (it.ocorrencia > 1 ? `-${it.ocorrencia}` : ""), mixNr);
    }).join("");
    return `<h2>Nova inspeção</h2><p class="lead">${esc(d.generico ? "Outro setor" : d.setorNome)} · ${d.itens.filter(x => !x.extra).length} perguntas</p>
    <form id="f-insp" class="stack" novalidate>
      <details class="panel"><summary class="label" style="cursor:pointer">Trocar setor</summary><div style="margin-top:12px">${chips}</div></details>
      <section class="panel">
        <div class="panel-head"><h3>Dados do TST</h3><span class="label">quem realizou a inspeção</span></div>
        <div class="fields">
          ${(() => { const L = tstList(), cur = (d.responsavel || "").trim().toLowerCase(), known = L.some(t => t.nome.toLowerCase() === cur), outro = !L.length || (cur && !known) || d.tstOutro;
            return `<label class="field span2"><span class="label">Nome do TST *</span>${L.length ? `<select id="f-tst-sel"><option value="">Selecione o TST</option>${L.map(t => `<option value="${esc(t.nome)}" data-reg="${esc(t.registro)}" ${!outro && t.nome.toLowerCase() === cur ? "selected" : ""}>${esc(t.nome)}</option>`).join("")}<option value="__outro" ${outro ? "selected" : ""}>Outro nome…</option></select>` : ""}
              <input id="f-resp" required value="${esc(d.responsavel)}" placeholder="Nome completo do técnico" ${outro ? "" : "hidden"}></label>`; })()}
          <label class="field"><span class="label">Registro profissional</span><input id="f-reg" value="${esc(d.registroTst)}" placeholder="Ex.: MTE/SRTE nº 12345"></label>
          <label class="field"><span class="label">Data da inspeção *</span><input id="f-data" type="date" required value="${esc(d.data)}"></label>
          <label class="field"><span class="label">Hora de início</span><input id="f-hini" type="time" value="${esc(d.horaInicio)}"><span class="label" style="text-transform:none;letter-spacing:0">Registrada ao abrir a inspeção</span></label>
          <label class="field"><span class="label">Hora de término</span><input id="f-hfim" type="time" value="${esc(d.horaFim)}" placeholder="ao salvar"><span class="label" style="text-transform:none;letter-spacing:0">${d.horaFim ? "" : "Preenchida ao salvar"}</span></label>
          <label class="field"><span class="label">Turno</span><select id="f-turno"><option value="">—</option>${["1º turno", "2º turno", "3º turno", "Administrativo"].map(o => `<option ${d.turno === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>
          <label class="field"><span class="label">Filial *</span>${(cfg.filiais || []).length ? `<select id="f-filial"><option value="">Selecione</option>${cfg.filiais.map(f => `<option ${d.filial === f ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>`
            : `<input id="f-filial" list="filiais-dl" value="${esc(d.filial || "")}" placeholder="Nome da filial"><datalist id="filiais-dl">${[...new Set(state.inspecoes.map(x => x.filial).filter(Boolean))].map(f => `<option value="${esc(f)}">`).join("")}</datalist>`}</label>
        </div>
      </section>
      ${d.generico ? `<section class="panel">
        <div class="panel-head"><h3>Setor inspecionado</h3></div>
        <div class="fields">
          <label class="field span2"><span class="label">Nome do setor *</span><input id="f-setor-nome" required value="${esc(d.setorNome)}" placeholder="Ex.: Manutenção"></label>
        </div>
      </section>` : ""}
      <datalist id="resp-dl">${respsUsados().map(l => `<option value="${esc(l)}">`).join("")}</datalist>
      <datalist id="locs-dl">${locaisSetor(d).map(l => `<option value="${esc(l)}">`).join("")}</datalist>
      <datalist id="eqs-dl">${locaisSetor(d, "equipamento").map(l => `<option value="${esc(l)}">`).join("")}</datalist>
      <section class="panel">
        <div class="panel-head"><h3>Liderança que acompanhou</h3></div>
        <div class="fields">
          <label class="field span2"><span class="label">Nome da liderança *</span><input id="f-acomp" required value="${esc(d.acompanhante)}" placeholder="Nome de quem acompanhou a inspeção"></label>
          <label class="field"><span class="label">Cargo / função</span><input id="f-cargo" value="${esc(d.cargoLider)}" placeholder="Ex.: Supervisor, Líder de turno"></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Perguntas</h3>
          <div class="progress"><span><b>${answered}</b>/${d.itens.length} respondidas</span><span class="chip ok">${s.c} C</span><span class="chip bad">${s.nc} NC</span><span class="chip na">${s.na} N/A</span></div></div>
        <div class="items">${rows}</div>
        <div class="extra-add"><button type="button" class="btn" data-act="extra-add">+ Apontar não conformidade fora do checklist</button>
          <span class="label" style="text-transform:none;letter-spacing:0">Opcional. Use quando encontrar uma não conformidade que nenhuma pergunta cobre.</span></div>
      </section>
      <section class="panel">
        <label class="field"><span class="label">Observações gerais</span><textarea id="f-obs" placeholder="Condições encontradas, orientações dadas no local…">${esc(d.observacoes)}</textarea></label>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Assinatura da liderança *</h3><button type="button" class="btn small" data-act="sig-clear" data-sig="lider">Limpar assinatura</button></div>
        <p class="lead" style="margin:-4px 0 10px">${d.acompanhante ? esc(d.acompanhante) : "A liderança"} assina com o dedo ou o mouse no quadro abaixo, ao final da inspeção. A assinatura registra ciência e acompanhamento da inspeção, não concordância automática com todas as conclusões técnicas.</p>
        <canvas id="sig-pad" class="sig-pad" data-sig="lider" width="900" height="240" aria-label="Quadro de assinatura da liderança"></canvas>
        <div class="sig-line"><span>${esc(d.acompanhante || "Nome da liderança")}${d.cargoLider ? " · " + esc(d.cargoLider) : ""}</span></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>Assinatura do TST *</h3><button type="button" class="btn small" data-act="sig-clear" data-sig="tst">Limpar assinatura</button></div>
        <canvas id="sig-pad-tst" class="sig-pad" data-sig="tst" width="900" height="240" aria-label="Quadro de assinatura do TST"></canvas>
        <div class="sig-line"><span>${esc(d.responsavel || "Nome do TST")}${d.registroTst ? " · " + esc(d.registroTst) : ""}</span></div>
        <p class="label" style="text-transform:none;letter-spacing:0;margin:8px 0 0">Assinatura eletrônica simples feita na tela, com nome, data, hora e código da inspeção. Não é certificação digital.</p>
      </section>
      <div class="sticky-actions">
        <span class="label" id="f-msg">Todas as perguntas precisam de resposta.</span>
        <div class="row-actions"><button type="button" class="btn" data-act="descartar">Descartar</button><button type="submit" class="btn primary">Salvar inspeção</button></div>
      </div>
    </form>`;
  }

  function itemRow(it, i, num, mixNr = false) {
    const seg = ["C", "NC", "NA"].map(v => `<button type="button" data-v="${v}" data-i="${i}" aria-pressed="${it.status === v}" aria-label="${{ C: "Conforme", NC: "Não conforme", NA: "Não aplicável" }[v]}">${v === "NA" ? "N/A" : v}</button>`).join("");
    const ai = state.ai[i];
    const aiBox = !sample ? `<div class="ai-note">A análise automática pelo Claude funciona quando o sistema é aberto dentro do Claude. Aqui, preencha os campos manualmente.</div>`
      : ai?.status === "loading" ? `<div class="ai-note busy">Claude está analisando a foto e montando o plano de ação…</div>`
      : ai?.status === "erro" ? `<div class="ai-note err">${esc(ai.msg)} <button type="button" class="btn small" data-act="ai-run" data-i="${i}">Tentar de novo</button></div>`
      : it.foto ? `<div class="ai-note">${it.analiseFoto ? "Texto gerado pelo Claude. Revise antes de salvar." : "Anexe a foto e, se quiser, escreva o que viu. O Claude completa o resto."} <button type="button" class="btn small" data-act="ai-run" data-i="${i}">${it.analiseFoto ? "Gerar de novo" : "Analisar com Claude"}</button></div>` : "";
    const base = state.draft?.data || today(), lim = limiteRisco(it.risco, base), A = it.status !== "NC" ? [] : it.acoes?.length ? it.acoes : (it.monitoramento ? [] : (it.acoes = [novaAcao()]));
    const regra = !it.risco ? "Selecione o nível de risco para definir as regras de prazo."
      : it.risco === "Crítico" ? `Risco crítico: intervenção e medidas de proteção imediatas. Prazo imediato (${fmtDate(lim)}); alteração só com autorização do administrador.`
      : prazoFixo(it.risco) ? `Prazo automático e obrigatório de ${PRAZO_DIAS[it.risco]} ${PRAZO_DIAS[it.risco] === 1 ? "dia corrido" : "dias corridos"}: vence em ${fmtDate(lim)}. Alteração só com autorização do administrador.`
      : `Risco ${it.risco.toLowerCase()}: sem prazo automático. O TST define o prazo de cada ação e justifica tecnicamente.`;
    const extra = it.status === "NC" ? `<div class="extra">
        <label class="field span3"><span class="label">Local da não conformidade *</span><input id="nc-local-${i}" data-k="localNC" data-i="${i}" list="locs-dl" autocomplete="off" value="${esc(it.localNC || "")}" placeholder="Ponto de referência. Ex.: Moldadora 2, lado do operador, próximo ao painel P-14"></label>
        <label class="field span3"><span class="label">Equipamento ou instalação *</span><input id="nc-eq-${i}" data-k="equipamento" data-i="${i}" list="eqs-dl" autocomplete="off" value="${esc(it.equipamento || "")}" placeholder="Ex.: Talha elétrica TL-03, Painel elétrico P-14, Passarela do forno 2"></label>
        <div class="field span3 foto-field"><span class="label">Foto da não conformidade *</span>
          <div class="foto-row">${it.foto ? imgTag(it.foto, "evid", "Foto da não conformidade") : `<div class="foto-empty">Sem foto</div>`}
            <label class="btn small"><input type="file" accept="image/*" capture="environment" data-nc-foto="${i}" hidden>${it.foto ? "Trocar foto" : "Tirar ou anexar foto"}</label></div>
          ${it.foto ? `<div class="fotos-extra">${(it.fotosExtra || []).map((f, k) => `<figure>${imgTag(f, "", "Foto complementar " + (k + 1))}<button type="button" class="btn small danger" data-act="foto-extra-del" data-i="${i}" data-k="${k}">Remover</button></figure>`).join("")}
            ${(it.fotosExtra || []).length < 3 ? `<label class="btn small"><input type="file" accept="image/*" capture="environment" data-nc-foto-extra="${i}" hidden>+ Foto complementar</label>` : ""}</div>` : ""}</div>
        <label class="field span3"><span class="label">Anotação preliminar do TST · não vai para o relatório</span><input id="nc-nota-${i}" data-k="nota" data-i="${i}" value="${esc(it.nota)}" placeholder="Ex.: proteção da correia aberta"></label>
        <div class="span3">${aiBox}</div>
        ${it.analiseFoto ? `<div class="field span3"><span class="label">Análise da foto pelo Claude</span><div class="ai-text">${esc(it.analiseFoto)}</div></div>` : ""}
        ${it.fotoMostraNC === false ? `<label class="check-line span3"><input type="checkbox" data-kc="fotoConfirmada" data-i="${i}" ${it.fotoConfirmada ? "checked" : ""}><span><b>Confirmo que a foto corresponde a esta não conformidade.</b> O Claude não identificou a irregularidade na imagem; troque a foto ou confirme.</span></label>` : ""}
        ${(it.pendencias || []).length ? `<div class="pend-box span3"><b>Pendências técnicas:</b> ${it.pendencias.map(esc).join("; ")}</div>` : ""}
        ${(it.perguntasIA || []).length ? `<div class="field span3 perguntas"><span class="label">Perguntas do Claude para completar o plano</span>
          ${it.perguntasIA.map((x, k) => `<label class="field"><span>${esc(x.q)}</span><input id="pq-${i}-${k}" data-pq="${i}:${k}" value="${esc(x.r)}" placeholder="Sua resposta"></label>`).join("")}
          ${sample ? `<div><button type="button" class="btn small primary" data-act="ai-run" data-i="${i}">Responder e atualizar plano</button></div>` : ""}</div>` : ""}
        <label class="field span3"><span class="label">Descrição técnica da não conformidade *</span><textarea id="nc-obs-${i}" data-k="obs" data-i="${i}" placeholder="Constatado que… (local, equipamento, irregularidade, condição de risco e consequência potencial)">${esc(it.obs)}</textarea></label>
        <label class="check-line span3"><input type="checkbox" id="nc-val-${i}" data-kc="descValidada" data-i="${i}" ${it.descValidada ? "checked" : ""}><span>Revisei e valido a descrição técnica *</span></label>
        <label class="field span2"><span class="label">Referência normativa (NR e item)</span><input id="nc-enq-${i}" data-k="enquadramento" data-i="${i}" value="${esc(it.enquadramento)}" placeholder="Ex.: NR-12, item 12.5.1"></label>
        <label class="field"><span class="label">Situação da referência *</span><select id="nc-norma-${i}" data-k="normaSit" data-i="${i}"><option value="">Selecione</option>${[["conferida", "Conferida pelo TST"], ["pendente", "Pendente de confirmação"], ["na", "Não se aplica"]].map(([v, n]) => `<option value="${v}" ${it.normaSit === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="field"><span class="label">Nível de risco *</span><select id="nc-risco-${i}" data-risco="${i}"><option value="">Selecione</option>${RISCOS.map(r => `<option ${it.risco === r ? "selected" : ""}>${r}</option>`).join("")}</select></label>
        <label class="field span2"><span class="label">Justificativa da classificação</span><input id="nc-rj-${i}" data-k="riscoJust" data-i="${i}" value="${esc(it.riscoJust || "")}" placeholder="Severidade, probabilidade, exposição, controles existentes"></label>
        <div class="regra span3">${regra}</div>
        ${it.risco === "Crítico" ? `<div class="crit-box span3"><h4>Risco crítico: providências imediatas obrigatórias</h4>
          <label class="check-line"><input type="checkbox" data-kc="critComunicado" data-i="${i}" ${it.critComunicado ? "checked" : ""}><span>A liderança foi comunicada *</span></label>
          <label class="field"><span class="label">Avaliação de isolamento, bloqueio ou paralisação *</span><select id="nc-critm-${i}" data-k="critMedida" data-i="${i}"><option value="">Selecione</option>${["Área isolada", "Equipamento bloqueado", "Atividade paralisada", "Outra medida de controle imediata", "Isolamento ou paralisação não necessários (justificar nas providências)"].map(o => `<option ${it.critMedida === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>
          <label class="field"><span class="label">Providências imediatas adotadas *</span><textarea id="nc-critp-${i}" data-k="critProvidencias" data-i="${i}" placeholder="O que foi feito no local para eliminar a exposição">${esc(it.critProvidencias || "")}</textarea></label>
          <label class="check-line"><input type="checkbox" data-kc="critControlado" data-i="${i}" ${it.critControlado ? "checked" : ""}><span>A situação está controlada antes da continuidade da atividade *</span></label></div>` : ""}
        ${it.risco === "Insignificante" ? `<label class="check-line span3"><input type="checkbox" data-kc="monitoramento" data-i="${i}" ${it.monitoramento ? "checked" : ""}><span>Somente manter monitoramento, sem ação formal</span></label>` : ""}
        ${(it.risco === "Baixo" || it.risco === "Insignificante") && !(it.risco === "Insignificante" && it.monitoramento) ? `<label class="field span3"><span class="label">Justificativa técnica do prazo definido *</span><input id="nc-pj-${i}" data-k="prazoJust" data-i="${i}" value="${esc(it.prazoJust || "")}" placeholder="Agravamento, controles existentes, complexidade da solução, disponibilidade operacional, requisitos legais"></label>` : ""}
        ${it.risco === "Insignificante" && it.monitoramento ? `<label class="field span3"><span class="label">Justificativa do monitoramento *</span><input id="nc-mj-${i}" data-k="monitoramentoJust" data-i="${i}" value="${esc(it.monitoramentoJust || "")}" placeholder="Por que não é necessária ação formal"></label>` : `<div class="field span3"><span class="label">Plano de ação * · de 1 a 5 ações, cada uma com seu responsável e prazo</span>
          <div class="acoes">${A.map((a, k) => `<div class="acao-row"><span class="acao-n">Ação ${k + 1}</span>

  async function corrigirTextos(alvos) {

    if (!itens.length) return { ok: true, n: 0 };
    if (!sample) return { ok: false, n: 0 };
    const textos = Object.fromEntries(itens.map((a, k) => ["t" + k, a.get()]));
    const prompt = `Revise os textos abaixo, escritos por técnicos de segurança do trabalho numa fundição, para um relatório de inspeção.
Corrija ortografia, acentuação, concordância, pontuação e letras maiúsculas, em português do Brasil, com linguagem técnica e clara.
Regras: mantenha o sentido e todas as informações; não acrescente fatos; não traduza; mantenha nomes de pessoas, códigos de máquinas, números, datas, NR e itens de norma como estão; não use aspas nem markdown.
Responda só com JSON com as mesmas chaves e os textos corrigidos.
${JSON.stringify(textos)}`;
    for (let tent = 0; tent < 2; tent++) {
      try {
        const r = await Promise.race([sample.json(prompt), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 60000))]);
        let n = 0;

    }
    return { ok: false, n: 0 };
  }
  function alvosInsp(insp) {
    const campo = (o, k) => ({ get: () => o[k] || "", set: v => { o[k] = v; } });
    const L = [campo(insp, "observacoes"), campo(insp, "cargoLider")];
    for (const it of insp.itens) {
      if (it.status === "NC") {
        L.push(campo(it, "localNC"), campo(it, "obs"));
        if (it.extra) L.push(campo(it, "texto"));
        for (const a of it.acoes || []) L.push(campo(a, "texto"), campo(a, "descricaoConclusao"), ...(a.reprogramacoes || []).map(r => campo(r, "justificativa")));

      for (const [n, x] of d.itens.entries()) { if (x.status !== "NC") continue; const f2 = faltaNC(x); if (!f2) continue;
        fail(`Não conformidade "${x.texto.slice(0, 40)}…": falta ${f2[0]}.`); document.getElementById("item-" + n).scrollIntoView({ block: "center" }); if (f2[1]) document.getElementById(f2[1] + "-" + n)?.focus({ preventScroll: true }); return; }
      if (Object.values(state.ai).some(a => a?.status === "loading")) return fail("Aguarde o Claude terminar a análise das fotos.");
      if (!d.assinaturaLider) { fail("Colha a assinatura da liderança no quadro de assinatura."); document.getElementById("sig-pad").scrollIntoView({ block: "center" }); return; }
      if (!d.assinaturaTst) { fail("Assine como TST no quadro de assinatura do TST."); document.getElementById("sig-pad-tst").scrollIntoView({ block: "center" }); return; }
      if (!d.horaFim) d.horaFim = nowHM();
      if (!d.horaInicio) d.horaInicio = d.horaFim;
      const insp = { id: uid(), ...structuredClone(d), setorNome: d.setorNome.trim(), filial: d.filial.trim(), situacao: "Finalizada", regraPrazo: "diretrizes-2026-10", criadoEm: Date.now(), criadoPorUid: state.uid || "",
        itens: d.itens.map(i => { const x = { ...i, corrigido: false, corrigidoEm: "" }; if (x.extra) { x.texto = x.texto.trim(); x.nr = x.nr || nrDe(x.enquadramento) || "Fora do checklist"; } if (x.status === "NC") { x.ncId = uid(); x.registradoTs = Date.now(); syncNC(x); } else { delete x.acoes; } return x; }) };
      delete insp.generico; delete insp.tstOutro;
      audit(insp, "Inspeção registrada e finalizada", { depois: `${insp.itens.filter(x => x.status === "NC").length} ocorrências de NC; assinaturas da liderança e do TST colhidas` });
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Salvando…";
      lsSet(LS_TST, { nome: insp.responsavel.trim(), registro: (insp.registroTst || "").trim(), filial: insp.filial });
      registrarTst(insp.responsavel, insp.registroTst);
      try {
        btn.textContent = "Revisando ortografia…";
        const rev = await corrigirTextos(alvosInsp(insp));
        insp.ortografiaRevisada = rev.ok;
        if (insp.itens.some(x => x.status === "NC")) insp.itens.forEach(x => { if (x.status === "NC") syncNC(x); });
        if (!rev.ok && sample) toast("Não foi possível revisar a ortografia agora. A inspeção será salva assim; use Revisar ortografia no histórico depois.");
        btn.textContent = "Enviando fotos…";
        for (const it of insp.itens) if (it.foto) it.foto = await persistFoto(it.foto);
        for (const it of insp.itens) if ((it.fotosExtra || []).length) it.fotosExtra = await Promise.all(it.fotosExtra.map(persistFoto));
        insp.assinaturaLider = await persistFoto(insp.assinaturaLider);
        insp.assinaturaTst = await persistFoto(insp.assinaturaTst);
        btn.textContent = "Salvando…";
        insp.codigo = codigoInsp(insp);
        while (state.inspecoes.some(x => x.codigo === insp.codigo || codigoInsp(x) === insp.codigo)) insp.codigo = `ISE-${insp.data.replace(/-/g, "")}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
        await saveInsp(insp); state.draft = null; state.ai = {}; salvarRascunho(true); toast("Inspeção salva. Gerando o relatório em Excel…"); go("detalhe", { selected: insp.id });
        exportXlsx(insp, document.querySelector('[data-act="relatorio"]')); }
      catch (err) {
        btn.disabled = false; btn.textContent = "Salvar inspeção";
        fail(err?.code === "invalid_argument" ? "Seu acesso não permite salvar inspeções nesta página." : err?.code === "quota_exceeded" ? "O banco atingiu o limite de registros. Exclua inspeções antigas para continuar." : "Não foi possível salvar agora. Tente novamente em instantes.");
      }
    });
  }

  // ---------- Setores e perguntas ----------
  function viewSetores() {

    if (!cfg.secoes.find(s => s.id === state.cfgSecao)) state.cfgSecao = cfg.secoes[0]?.id;
    const st = cfg.setores.find(s => s.id === state.cfgSetor);
    const sec = cfg.secoes.find(s => s.id === state.cfgSecao);
    const ro = !state.canWrite;
    return `<h2>Setores e perguntas</h2><p class="lead">Cada setor recebe só as seções que se aplicam a ele. As mudanças valem para as próximas inspeções; as já registradas mantêm suas perguntas.</p>

      ${st ? `<section class="panel stack" style="gap:14px">
        <div class="fields">
          <label class="field span2"><span class="label">Nome do setor</span><input id="cfg-nome" data-cfg="nome" value="${esc(st.nome)}" ${ro ? "disabled" : ""}></label>
          <label class="inline-check" style="align-self:end"><input type="checkbox" id="cfg-generico" data-cfg="generico" ${st.generico ? "checked" : ""} ${ro ? "disabled" : ""}><span>O TST digita o nome do setor ao abrir a inspeção (setor genérico)</span></label>
        </div>
        <div><h3>Seções de perguntas</h3><p class="lead" style="margin:2px 0 10px">Marque as seções que se aplicam a este setor.</p>
          <div class="check-grid">${cfg.secoes.map(s => `<label class="check-card"><input type="checkbox" data-cfg="secao" value="${esc(s.id)}" ${st.secoes.includes(s.id) ? "checked" : ""} ${ro ? "disabled" : ""}>
            <span class="nm">${esc(s.nome)}</span><span class="sub">${s.perguntas.length} perguntas${s.nr ? " · " + esc(s.nr) : ""}</span></label>`).join("")}</div></div>
        <div><h3>Perguntas que aparecem neste setor</h3><p class="lead" style="margin:2px 0 10px">Desmarque as perguntas que não devem aparecer na inspeção nem no relatório deste setor. Elas não são apagadas; dá para marcar de novo quando quiser.</p>
          ${st.secoes.map(id => secById(cfg, id)).filter(Boolean).map(s => { const vis = s.perguntas.filter(p => visivel(st, s.id, p)).length; return `<details class="vis-sec" data-sec-open="${esc(s.id)}" ${state.cfgOpen?.has(s.id) ? "open" : ""}><summary><b>${esc(s.nome)}</b> <span class="label" id="vis-c-${esc(s.id)}">${vis} de ${s.perguntas.length} aparecem</span></summary>
            ${s.perguntas.map(p => `<label class="vis-q"><input type="checkbox" data-cfg="vis" data-secid="${esc(s.id)}" value="${esc(qKey(s.id, p.texto))}" ${visivel(st, s.id, p) ? "checked" : ""} ${ro ? "disabled" : ""}><span>${esc(p.texto)}${p.ref ? ` <small class="label">${esc(p.ref)}</small>` : ""}</span></label>`).join("")}</details>`; }).join("")}</div>
        ${ro ? "" : (state.cfgConfirmDel ? `<div class="confirm">Excluir o setor "${esc(st.nome)}"? As inspeções já registradas não são apagadas. <button class="btn small danger" data-act="cfg-del-sim">Excluir</button><button class="btn small" data-act="cfg-del-nao">Cancelar</button></div>`
          : `<div><button type="button" class="btn danger small" data-act="cfg-del">Excluir setor</button></div>`)}
      </section>` : ""}
      <section class="panel stack" style="gap:12px">
        <div class="panel-head" style="margin:0"><h3>Perguntas das seções</h3>${ro ? "" : `<button type="button" class="btn small" data-act="cfg-nova-secao">+ Nova seção</button>`}</div>
        <div class="chips">${cfg.secoes.map(s => `<button type="button" class="pill" data-act="cfg-secao" data-id="${esc(s.id)}" aria-pressed="${s.id === state.cfgSecao}">${esc(s.nome)} <span class="c">(${s.perguntas.length})</span></button>`).join("")}</div>
        ${sec ? `<div class="fields">
          <label class="field span2"><span class="label">Nome da seção</span><input id="sec-nome" data-sec="nome" value="${esc(sec.nome)}" ${ro ? "disabled" : ""}></label>
          <label class="field"><span class="label">Norma</span><input id="sec-nr" data-sec="nr" value="${esc(sec.nr)}" placeholder="Ex.: NR-12" ${ro ? "disabled" : ""}></label>
        </div>
        <div>${sec.perguntas.map((p, i) => `<div class="q-row"><span class="n">${i + 1}</span>
          <input id="q-t-${i}" data-q="texto" data-i="${i}" value="${esc(p.texto)}" ${ro ? "disabled" : ""}>
          <input class="ref-in" id="q-r-${i}" data-q="ref" data-i="${i}" value="${esc(p.ref)}" placeholder="NR ou item (ex.: NR-12)" ${ro ? "disabled" : ""}>
          ${ro ? "" : `<button type="button" class="btn small danger" data-act="q-del" data-i="${i}" aria-label="Remover pergunta ${i + 1}">Remover</button>`}</div>`).join("")}</div>
        ${ro ? "" : `<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="q-nova" placeholder="Nova pergunta para a seção ${esc(sec.nome)}" style="flex:1 1 260px;width:auto"><button type="button" class="btn" data-act="q-add">Adicionar pergunta</button></div>`}` : ""}
      </section>
      <section class="panel stack" style="gap:12px">
        <div class="panel-head" style="margin:0"><h3>TSTs que realizam inspeções</h3>${ro ? "" : `<button type="button" class="btn small" data-act="tst-add">+ Adicionar TST</button>`}</div>
        <p class="label" style="text-transform:none;letter-spacing:0;margin:0">Os nomes aparecem para seleção no campo do TST da nova inspeção, já com o registro profissional.</p>

          <input class="ref-in" id="tst-r-${i}" data-tst="registro" data-i="${i}" value="${esc(t.registro)}" placeholder="Registro (MTE)" ${ro ? "disabled" : ""}>

        ${(cfg.filiais || []).length ? `<div>${cfg.filiais.map((f, i) => `<div class="q-row"><span class="n">${i + 1}</span><input id="fil-${i}" data-filial="${i}" value="${esc(f)}" placeholder="Nome da filial" ${ro ? "disabled" : ""}>
          ${ro ? "" : `<button type="button" class="btn small danger" data-act="filial-del" data-i="${i}">Remover</button>`}</div>`).join("")}</div>` : `<p class="label" style="text-transform:none;letter-spacing:0;margin:0">Nenhuma filial cadastrada. Enquanto isso, o TST digita o nome da filial.</p>`}
      </section>
      ${ro ? "" : `<div class="save-bar"><button type="button" class="btn primary" data-act="cfg-salvar" ${state.cfgDirty ? "" : "disabled"}>Salvar alterações</button>
        <button type="button" class="btn" data-act="cfg-descartar" ${state.cfgDirty ? "" : "disabled"}>Descartar</button>
        <span class="label">${state.cfgDirty ? "Há alterações não salvas" : "Tudo salvo"}</span>
        <button type="button" class="btn small" data-act="cfg-padrao" style="margin-left:auto">Restaurar padrão</button></div>`}
    </div>`;
  }
  function cfgChanged(rerender = true) {
    state.cfgDirty = true;
    if (rerender) { const y = window.scrollY; render(); window.scrollTo(0, y); }
    else document.querySelectorAll('[data-act="cfg-salvar"],[data-act="cfg-descartar"]').forEach(b => b.disabled = false);
  }

  // ---------- Histórico ----------
  function filtered() {
    const qq = state.filtro.q.trim().toLowerCase();
    return state.inspecoes.filter(i => (!state.filtro.setor || setorLabel(i) === state.filtro.setor) &&
      (!qq || [setorLabel(i), locaisNC(i), i.responsavel, ...i.itens.flatMap(it => it.status === "NC" ? acoesDe(it).map(a => a.os ? "OS " + a.os : "") : [])].join(" ").toLowerCase().includes(qq)));
  }
  function viewHistorico() {
    const lead = `<h2>Histórico</h2><p class="lead">Todas as inspeções registradas. Clique em uma linha para ver o relatório.</p>`;
    if (!state.inspecoes.length) return lead + emptyState("Nenhuma inspeção ainda", "Registre a primeira inspeção para montar o histórico.");
    const setores = [...new Set(state.inspecoes.map(setorLabel))].sort();
    return lead + `<div class="filters">
        <input id="h-q" type="search" placeholder="Buscar por setor, local, TST ou nº da OS" value="${esc(state.filtro.q)}">
        <select id="h-setor"><option value="">Todos os setores</option>${setores.map(s => `<option ${state.filtro.setor === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <button class="btn" data-act="csv">Exportar CSV</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Data</th><th>Setor</th><th class="hide-sm">Locais com NC</th><th class="hide-sm">TST</th><th>Conformidade</th><th>NC em aberto</th></tr></thead>
      <tbody id="h-body">${histRows(filtered())}</tbody></table></div>
      <div id="copy-area"></div>`;
  }
  function histRows(L) {
    if (!L.length) return `<tr><td colspan="6" class="empty">Nenhuma inspeção corresponde à busca.</td></tr>`;
    return L.map(i => { const s = score(i); const ab = i.itens.filter(x => x.status === "NC" && !x.encerrada).length;
      return `<tr data-act="abrir" data-id="${i.id}" tabindex="0"><td class="num">${fmtDate(i.data)}</td><td>${esc(setorLabel(i))}${i.filial ? `<div class="label">${esc(i.filial)}</div>` : ""}${i.exemplo ? ` <span class="chip ex">exemplo</span>` : ""}${i.situacao === "Cancelada" ? ` <span class="chip na">cancelada</span>` : ""}</td>
      <td class="hide-sm">${esc(locaisNC(i) || "—")}</td><td class="hide-sm">${esc(i.responsavel)}</td><td>${pctChip(s.pct)}</td><td class="num">${ab ? `<span class="chip bad">${ab}</span>` : "0"}</td></tr>`; }).join("");
  }

  // ---------- Detalhe ----------
  function viewDetalhe() {
    const i = state.inspecoes.find(x => x.id === state.selected);

    const s = score(i);
    let last = null;
    const podeAgir = state.canWrite && i.situacao !== "Cancelada";
    const itens = i.itens.map((it, idx) => {
      const head = it.secao && it.secao !== last ? `<div class="sec-head"><h3>${esc(it.secao)}</h3><span class="label">${esc(it.nr || "")}</span></div>` : "";
      last = it.secao || last;
      return head + `<div class="d-item"><span class="n label" style="padding-top:2px">${idx + 1}</span>
        <div>${esc(it.texto)}${it.ref ? ` <span class="label">${esc(it.ref)}</span>` : ""}${it.ocorrencia > 1 ? ` <span class="label">${it.ocorrencia}ª ocorrência</span>` : ""}</div>

          ${it.risco === "Crítico" && it.critProvidencias ? `<div><span class="label">Providências imediatas</span> ${esc(it.critMedida || "")}: ${esc(it.critProvidencias)}${it.critComunicado ? " · liderança comunicada" : ""}${it.critControlado ? " · situação controlada" : ""}</div>` : ""}

          ${it.prazoJust ? `<div><span class="label">Justificativa do prazo</span> ${esc(it.prazoJust)}</div>` : ""}
          ${(it.pendencias || []).length ? `<div><span class="label">Pendências técnicas</span> ${it.pendencias.map(esc).join("; ")}</div>` : ""}
          <div><span class="label">Situação da NC</span> ${it.encerrada ? `<span class="chip ok">Encerrada</span>` : `<span class="chip bad">Em aberto</span>`}</div></div></div>` : ""}
        ${it.status === "NC" ? `<div class="acoes-d">${acoesDe(it).map((a, k) => acaoDetalhe(i, it, idx, a, k, podeAgir)).join("")}</div>` : ""}</div>`;
    }).join("");
    return `<div class="stack">
      <div><button class="btn small" data-act="voltar">← Histórico</button></div>
      <section class="panel">
        <div class="detail-head">
          <div style="min-width:0"><span class="label">${esc(codigoInsp(i))} · Setor</span><h2 style="margin-top:4px">${esc(setorLabel(i))}</h2>${i.exemplo ? `<span class="chip ex">registro de exemplo</span>` : ""}${i.situacao === "Cancelada" ? `<span class="chip bad">Inspeção cancelada</span>` : ""}</div>
          <div style="text-align:right"><div class="score" style="color:${pctColor(s.pct)}">${s.pct ?? "—"}${s.pct != null ? "%" : ""}</div><span class="label">conformidade</span></div>
        </div>
        <div class="meta">
          <div><span class="label">Data</span><b>${fmtDate(i.data)}</b></div>
          <div><span class="label">Filial</span><b>${esc(i.filial || "—")}</b></div>
          ${locaisNC(i) ? `<div><span class="label">Locais com NC</span><b>${esc(locaisNC(i))}</b></div>` : ""}
          <div><span class="label">TST</span><b>${esc(i.responsavel)}</b>${i.registroTst ? `<span class="label">${esc(i.registroTst)}</span>` : ""}</div>
          <div><span class="label">Horário</span><b>${i.horaInicio || i.horaFim ? `${esc(i.horaInicio || "?")} – ${esc(i.horaFim || "?")}` : "—"}</b></div>
          <div><span class="label">Turno</span><b>${esc(i.turno || "—")}</b></div>
          <div><span class="label">Liderança</span><b>${esc(i.acompanhante || "—")}</b>${i.cargoLider ? `<span class="label">${esc(i.cargoLider)}</span>` : ""}</div>
          <div><span class="label">Resultado</span><b><span class="chip ok">${s.c} C</span> <span class="chip bad">${s.nc} NC</span> <span class="chip na">${s.na} N/A</span></b>${s.ocorr !== s.nc ? `<span class="label">${s.ocorr} ocorrências de NC</span>` : ""}</div>
        </div>
        ${i.situacao === "Cancelada" && i.cancelamento ? `<p class="store-note" style="margin:14px 0 0">Cancelada em ${new Date(i.cancelamento.ts).toLocaleString("pt-BR")}: ${esc(i.cancelamento.motivo)}. Não entra nos indicadores.</p>` : ""}
        ${i.observacoes ? `<p style="margin:16px 0 0;max-width:65ch"><span class="label">Observações gerais</span><br>${esc(i.observacoes)}</p>` : ""}
      </section>
      <section class="panel">${itens}</section>
      ${i.assinaturaLider || i.assinaturaTst ? `<div class="grid2 even">
        ${i.assinaturaLider ? `<section class="panel"><div class="panel-head"><h3>Assinatura da liderança</h3><span class="label">${i.assinaturaLiderTs ? new Date(i.assinaturaLiderTs).toLocaleString("pt-BR") : fmtDate(i.data) + " " + esc(i.horaFim || "")}</span></div>
          ${imgTag(i.assinaturaLider, "sig-img", "Assinatura de " + i.acompanhante)}<div class="sig-line"><span>${esc(i.acompanhante)}${i.cargoLider ? " · " + esc(i.cargoLider) : ""}</span></div><p class="label" style="text-transform:none;letter-spacing:0;margin:6px 0 0">Ciência e acompanhamento da inspeção.</p></section>` : ""}
        ${i.assinaturaTst ? `<section class="panel"><div class="panel-head"><h3>Assinatura do TST</h3><span class="label">${i.assinaturaTstTs ? new Date(i.assinaturaTstTs).toLocaleString("pt-BR") : ""}</span></div>

  function shrinkImage(file) {

  // Gráficos do dashboard do Excel, desenhados em canvas e embutidos como imagem.
  function chartPNG(kind, title, rows, opts = {}) {

      let a0 = -Math.PI / 2;
      rows.forEach(r => { if (!r.v) return; const a1 = a0 + r.v / tot * Math.PI * 2; g.beginPath(); g.arc(cx, cy, R, a0, a1); g.arc(cx, cy, r0, a1, a0, true); g.closePath(); g.fillStyle = r.c; g.fill(); g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke(); a0 = a1; });

    } else {
      const L = opts.labelW || 190, top = 54, rowH = Math.min(30, (H - top - 14) / Math.max(1, rows.length)), max = opts.max || Math.max(1, ...rows.map(r => r.v));
      const bw = W - L - 70;
      g.strokeStyle = grid; g.lineWidth = 1;
      for (let q = 0; q <= 4; q++) { const x = L + bw * q / 4; g.beginPath(); g.moveTo(x, top - 4); g.lineTo(x, top + rowH * rows.length); g.stroke(); }
      rows.forEach((r, i) => {
        const y = top + i * rowH, h = Math.max(6, rowH - 10);
        g.fillStyle = ink; g.font = "12px Arial"; g.textAlign = "right";
        let lab = r.l; while (g.measureText(lab).width > L - 12 && lab.length > 4) lab = lab.slice(0, -2); if (lab !== r.l) lab += "…";

        g.fillStyle = r.c || "#2f6fb5"; g.beginPath(); g.roundRect ? g.roundRect(L, y, w, h, 3) : g.rect(L, y, w, h); g.fill();
        g.fillStyle = ink; g.font = "600 12px Arial"; g.fillText(opts.fmt ? opts.fmt(r.v) : String(r.v), L + w + 6, y + h / 2 + 5);
      });
      if (!rows.length) { g.fillStyle = muted; g.font = "13px Arial"; g.fillText(opts.empty || "Sem dados", 16, top + 20); }
    }
    return c.toDataURL("image/png");
  }

  document.addEventListener("toggle", e => { const d = e.target; if (d?.dataset?.secOpen) { state.cfgOpen ||= new Set(); d.open ? state.cfgOpen.add(d.dataset.secOpen) : state.cfgOpen.delete(d.dataset.secOpen); } }, true);
  document.addEventListener("change", async e => {
    if (e.target.dataset.sitAcao) { const [idx, k] = e.target.dataset.sitAcao.split(":").map(Number), v = e.target.value;
      await gravarAcao(e.target, idx, k, (a, it, i) => { const antes = a.situacao || "Aberta"; if (antes === v) return false; a.situacao = v; audit(i, "Situação da ação alterada", { alvo: alvoAc(idx, k), antes, depois: v }); }, "Situação atualizada"); return; }
    if (e.target.id === "f-tst-sel") {
      const o = e.target.selectedOptions[0], r = document.getElementById("f-resp"), g = document.getElementById("f-reg"), outro = e.target.value === "__outro";
      if (state.draft) state.draft.tstOutro = outro;
      r.hidden = !outro; r.value = outro || !e.target.value ? "" : e.target.value;
      g.value = !outro && e.target.value ? o.dataset.reg || "" : ""; if (outro) r.focus();
      return;
    }
    if (e.target.dataset.ncFoto != null && state.draft) {
      const i = +e.target.dataset.ncFoto, f = e.target.files?.[0]; if (!f) return;
      readHeader();
      try { const it = state.draft.itens[i]; it.foto = await shrinkImage(f); it.analiseFoto = ""; it.fotoMostraNC = null; it.fotoConfirmada = false; salvarRascunho(); rerenderKeep(); if (sample) runAI(i); }
      catch { toast("Não foi possível ler a imagem. Tente outra foto."); }
      return;
    }
    if (e.target.dataset.ncFotoExtra != null && state.draft) {
      const i = +e.target.dataset.ncFotoExtra, f = e.target.files?.[0]; if (!f) return;
      readHeader();
      try { const it = state.draft.itens[i]; (it.fotosExtra ||= []).push(await shrinkImage(f)); salvarRascunho(); rerenderKeep(); }
      catch { toast("Não foi possível ler a imagem. Tente outra foto."); }
      return;
    }
    if (e.target.id !== "fin-foto" || !state.closing) return;
    const f = e.target.files?.[0]; if (!f) return;
    try { state.closing.foto = await shrinkImage(f); const y = window.scrollY; render(); window.scrollTo(0, y); }
    catch { toast("Não foi possível ler a imagem. Tente outra foto."); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
    if (e.key === "Enter" && e.target.id === "q-nova") { e.preventDefault(); document.querySelector('[data-act="q-add"]')?.click(); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (state.closing && t.id === "fin-data") { state.closing.data = t.value; return; }
    if (state.closing && t.id === "fin-por") { state.closing.por = t.value; return; }
    if (state.closing && t.id === "fin-desc") { state.closing.desc = t.value; return; }
    if (state.osEdit && t.id === "os-in") { state.osEdit.val = t.value; return; }
    if (state.osEdit && t.id === "os-sit") { state.osEdit.sit = t.value; return; }
    if (state.closing && t.id === "fin-os") { state.closing.os = t.value; return; }
    if (state.repro && t.id === "rep-med") { state.repro.med = t.value; return; }
    if (t.id === "motivo-txt") { state.motivo = t.value; return; }
    if (state.valid && t.dataset.valid) { state.valid[t.dataset.valid] = t.checked; return; }
    if (state.valid && t.id === "val-data") { state.valid.data = t.value; return; }
    if (state.valid && t.id === "val-por") { state.valid.por = t.value; return; }
    if (state.valid && t.id === "val-obs") { state.valid.obs = t.value; return; }
    if (state.repro && t.id === "rep-data") { state.repro.data = t.value; return; }
    if (state.repro && t.id === "rep-por") { state.repro.por = t.value; return; }
    if (state.repro && t.id === "rep-just") { state.repro.just = t.value; return; }
    if (/^pf-(periodo|setor|tst|filial|resp|risco|status)$/.test(t.id)) {
      const g = id => document.getElementById(id)?.value || "";
      state.pf = { periodo: g("pf-periodo"), setor: g("pf-setor"), tst: g("pf-tst"), filial: g("pf-filial"), resp: g("pf-resp"), risco: g("pf-risco"), status: g("pf-status") };
      const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    if (t.id === "h-q" || t.id === "h-setor") {
      state.filtro.q = document.getElementById("h-q").value; state.filtro.setor = document.getElementById("h-setor").value;
      document.getElementById("h-body").innerHTML = histRows(filtered()); return;
    }
    if (state.view !== "setores" || !state.cfgDraft) return;
    const st = state.cfgDraft.setores.find(s => s.id === state.cfgSetor);
    const sec = state.cfgDraft.secoes.find(s => s.id === state.cfgSecao);
    if (t.dataset.cfg === "nome") { st.nome = t.value; cfgChanged(false); }
    else if (t.dataset.cfg === "generico") { st.generico = t.checked; cfgChanged(false); }
    else if (t.dataset.cfg === "vis") {
      const set = new Set(st.ocultas || []); t.checked ? set.delete(t.value) : set.add(t.value); st.ocultas = [...set];
      const sc = state.cfgDraft.secoes.find(x => x.id === t.dataset.secid); const c = document.getElementById("vis-c-" + t.dataset.secid);
      if (sc && c) c.textContent = `${sc.perguntas.filter(p => visivel(st, sc.id, p)).length} de ${sc.perguntas.length} aparecem`;
      cfgChanged(false); return;
    }
    else if (t.dataset.cfg === "secao") {
      const ids = [...document.querySelectorAll('[data-cfg="secao"]:checked')].map(x => x.value);
      st.secoes = state.cfgDraft.secoes.map(s => s.id).filter(id => ids.includes(id)); cfgChanged();
    }
    else if (t.dataset.sec) { sec[t.dataset.sec] = t.value; cfgChanged(false); }
    else if (t.dataset.q) { sec.perguntas[+t.dataset.i][t.dataset.q] = t.value; cfgChanged(false); }
    else if (t.dataset.filial != null) { state.cfgDraft.filiais[+t.dataset.filial] = t.value; cfgChanged(false); }
    else if (t.dataset.cfgmeta) { state.cfgDraft.metaTst = Math.max(0, parseInt(t.value, 10) || 0); cfgChanged(false); }
    else if (t.dataset.tst) { state.cfgDraft.tsts[+t.dataset.i][t.dataset.tst] = t.value; cfgChanged(false); }
  });

  try { const h = location.hash.slice(1); if (["painel", "nova", "historico", "setores", "monitor"].includes(h)) state.view = h; } catch {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  initStore();
})();
</script>

</body>
</html>
